<!DOCTYPE html>
<html lang="en" class="dark custom-scroll">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP V7 - SEARCH</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.__4sp_nav_none = true;</script>
    <script src="/injector.js"></script>
    <script src="/pillbar.js"></script>

    <style>
        body { 
            font-family: 'Manrope', sans-serif; 
            background-color: var(--bg-main, #0B0A10);
            color: var(--text-main, #ffffff);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .search-input-wrapper {
            position: relative;
            margin-bottom: 2rem;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 1.5rem 1.2rem 3.5rem;
            background: var(--bg-card, #15131C);
            border: 1px solid var(--border-color, #2D273D);
            border-radius: 20px;
            color: var(--text-main, #ffffff);
            font-size: 1.1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: var(--glow-soft);
        }

        .search-input:focus {
            border-color: var(--accent, #9D7BFF);
            box-shadow: var(--glow-hover);
        }

        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted, #C4B0FF);
            font-size: 1.2rem;
        }

        .quick-selections {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
        }

        @media (min-width: 640px) {
            .quick-selections {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .selection-card {
            background: var(--bg-card, #15131C);
            border: 1px solid var(--border-color, #2D273D);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            color: var(--text-main, #ffffff);
        }

        .selection-card:hover {
            border-color: var(--accent, #9D7BFF);
            transform: scale(1.05) translateY(-5px);
            box-shadow: var(--glow-hover);
        }

        .selection-card i {
            font-size: 1.5rem;
            color: var(--accent, #9D7BFF);
        }

        .selection-card span {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
            pointer-events: none;
            z-index: -1;
            opacity: 0.3;
        }
    </style>
</head>
<body class="grid-bg">
    <div id="dynamic-background"></div>

    <div class="search-container">
        <h1 class="text-4xl font-extrabold mb-8 tracking-tighter">4SP <span class="text-[var(--accent)]">V7</span></h1>
        
        <form id="search-form" class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="search-query" class="search-input" placeholder="Search the web or 4SP..." autocomplete="off">
        </form>

        <div class="quick-selections">
            <a href="/logged-in/games.html" class="selection-card">
                <i class="fa-solid fa-gamepad"></i>
                <span>Games</span>
            </a>
            <a href="/VELIUM/index.html" class="selection-card">
                <i class="fa-solid fa-music"></i>
                <span>Music</span>
            </a>
            <a href="/logged-in/vora.html" class="selection-card">
                <i class="fa-solid fa-tv"></i>
                <span>Movies</span>
            </a>
            <a href="/logged-in/settings.html" class="selection-card">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('search-form');
        const searchQuery = document.getElementById('search-query');

        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = searchQuery.value.trim();
            if (query) {
                // Redirect to proxy search
                window.location.href = `/logged-in/vern.html?q=${encodeURIComponent(query)}`;
            }
        });
    </script>
</body>
</html>
