<!DOCTYPE html>

<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>4SP - VERN</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../injector.js"></script>
<style>
        :root {
            --bg-page: var(--bg-primary, #000);
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: var(--bg-page);
        }
        
        /* The injector/navigation adds padding-top: 64px to body.
           We need to ensure the page content fills the remaining space. */
        
        body {
            display: flex;
            flex-direction: column;
        }

        #page-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }
    </style><style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Geist', sans-serif; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300;
        }

        /* Subtle dot grid */
        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }
</style>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;display=swap" rel="stylesheet"/>
</head>
<body class="grid-bg min-h-screen relative"><div id="dynamic-background"></div><div id="navbar-container"></div>
<div id="page-content" style="display: none;">
<iframe allowfullscreen="" src="../VERN/vern.html"></iframe>
</div>
<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { firebaseConfig } from "../firebase-config.js";
        import { checkAdminStatus } from "../utils.js";

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const pageContent = document.getElementById('page-content');

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                pageContent.style.display = 'flex'; // Show content for everyone logged in
            } else {
                // User is signed out, redirect to authentication page
                window.location.href = '../authentication.html';
            }
        });
    </script>
</body>
</html>
