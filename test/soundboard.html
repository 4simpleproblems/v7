<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - SOUNDBOARD</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/injector.js"></script>
    <style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
        }

        body { 
            font-family: 'Geist', sans-serif; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300;
            overflow: hidden;
        }

        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }

        #soundboard-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #soundboard-sidebar {
            width: 380px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-main);
            background: var(--bg-card);
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #soundboard-main-view {
            flex-grow: 1;
            padding: 64px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: transparent;
        }
        .category-item:hover { background: var(--btn-bg); color: var(--accent-color); }
        .category-item.active { background: var(--btn-bg); color: var(--accent-color); border-color: var(--accent-glow); }

        .sound-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            border-radius: 1.25rem;
            padding: 1.5rem;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .sound-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            background: var(--btn-bg);
        }
        
        .sound-btn.playing {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
            transform: scale(0.98);
        }

        .custom-checkbox {
            appearance: none;
            width: 1.25rem; height: 1.25rem;
            border: 1px solid var(--border-main);
            border-radius: 6px;
            background: var(--bg-page);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .custom-checkbox:checked { background: var(--accent-color); border-color: var(--accent-color); }
        .custom-checkbox:checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; font-size: 0.7rem; }

        .custom-scroll::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="grid-bg min-h-screen relative">
    <div id="dynamic-background"></div>
    <div id="navbar-container"></div>

    <main id="soundboard-container">
        <aside id="soundboard-sidebar" class="custom-scroll">
            <div class="mb-12">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2">Audio Tools</p>
                <h2 class="text-4xl font-light tracking-tight">Soundboard</h2>
            </div>

            <div class="mb-10">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 opacity-30 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Search sounds..." 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:border-[var(--accent-color)] transition-colors text-white">
                </div>
            </div>

            <nav id="category-nav" class="flex flex-col gap-2 mb-10">
                <button class="category-item active" data-cat="normal"><i class="fa-solid fa-volume-high"></i> Normal</button>
                <button class="category-item" data-cat="explicit" id="explicitNavItem"><i class="fa-solid fa-triangle-exclamation"></i> Explicit</button>
                <button class="category-item" data-cat="thirdparty"><i class="fa-solid fa-globe"></i> Third Party</button>
            </nav>

            <div class="p-6 rounded-2xl bg-white/5 border border-white/10 mt-auto">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-4">Playback Settings</p>
                <div class="flex flex-col gap-4">
                    <label class="flex items-center justify-between cursor-pointer">
                        <span class="text-xs font-medium opacity-60">Overlay Mode</span>
                        <input type="checkbox" id="overlayCheckbox" class="custom-checkbox">
                    </label>
                    <button id="stopAllBtn" class="w-full py-3 rounded-xl border border-red-500/30 bg-red-500/10 text-red-400 text-xs font-bold uppercase tracking-widest hover:bg-red-500/20 transition">
                        Stop All Sounds
                    </button>
                </div>
            </div>
        </aside>

        <section id="soundboard-main-view" class="custom-scroll">
            <div id="content-viewer">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2" id="current-label">Collection</p>
                <h2 class="text-6xl font-light tracking-tight mb-12" id="active-title">Normal Sounds</h2>
                <div id="sounds-grid" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-6 gap-6 transition-all duration-300"></div>
            </div>
        </section>
    </main>

    <script type="module">
        import { sounds as thirdPartySounds } from 'https://cdn.jsdelivr.net/gh/genizy/soundboard@main/sounds.js';
        
        let allSounds = { normal: [], explicit: [], thirdparty: [] };
        let activeCat = 'normal';
        let playingAudios = [];

        async function loadSounds() {
            try {
                const res = await fetch('https://cdn.jsdelivr.net/npm/4sp-sounds@latest/soundboard_names.json');
                const data = await res.json();
                allSounds.normal = (data.NormalSounds || []).map(f => ({ name: f.replace('.mp3', '').replace(/_/g, ' '), url: `https://cdn.jsdelivr.net/npm/4sp-sounds@latest/sounds/${f}` }));
                allSounds.explicit = (data.ExplicitSounds || []).map(f => ({ name: f.replace('.mp3', '').replace(/_/g, ' '), url: `https://cdn.jsdelivr.net/npm/4sp-sounds@latest/sounds/${f}` }));
                allSounds.thirdparty = thirdPartySounds.map(s => ({ name: s.name, url: `https://cdn.jsdelivr.net/gh/genizy/soundboard@main/${s.mp3}` }));
                renderSounds();
            } catch (e) { console.error(e); }
        }

        function createSoundBtn(sound) {
            const btn = document.createElement('div');
            btn.className = 'sound-btn';
            btn.textContent = sound.name;
            btn.onclick = () => {
                if (!document.getElementById('overlayCheckbox').checked) stopAll();
                const audio = new Audio(sound.url);
                btn.classList.add('playing');
                audio.play();
                playingAudios.push(audio);
                audio.onended = () => {
                    btn.classList.remove('playing');
                    playingAudios = playingAudios.filter(a => a !== audio);
                };
            };
            return btn;
        }

        function renderSounds(filter = '') {
            const grid = document.getElementById('sounds-grid');
            grid.innerHTML = '';
            const list = allSounds[activeCat].filter(s => s.name.toLowerCase().includes(filter.toLowerCase()));
            list.forEach(s => grid.appendChild(createSoundBtn(s)));
        }

        function stopAll() {
            playingAudios.forEach(a => { a.pause(); a.currentTime = 0; });
            playingAudios = [];
            document.querySelectorAll('.sound-btn.playing').forEach(b => b.classList.remove('playing'));
        }

        document.getElementById('stopAllBtn').onclick = stopAll;
        document.getElementById('searchInput').oninput = (e) => renderSounds(e.target.value);

        document.querySelectorAll('.category-item').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.category-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeCat = btn.dataset.cat;
                document.getElementById('active-title').textContent = btn.textContent.trim();
                renderSounds();
            };
        });

        loadSounds();
    </script>
</body>
</html>
