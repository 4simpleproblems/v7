<script>
        const basePath = "/VERN/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",

    </script>
<script src="/VERN/baremux/index.js"></script>
<script type="module">
        import * as libcurl from "/VERN/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const connection = new BareMux.BareMuxConnection("/VERN/baremux/worker.js");
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VERN/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Valo: BareMux Transport Active");
                    
                    // Signal readiness to all Service Workers
                    const bc = new BroadcastChannel("bare-mux-sync");
                    const signal = { type: 'baremuxready', path: "/VERN/baremux/worker.js", port: connection.port };
                    bc.postMessage(signal);
                    
                    if (navigator.serviceWorker.controller) {
                        // Fix for TypeError: Only transfer port if it exists and is valid
                        const transferList = connection.port ? [connection.port] : [];
                        navigator.serviceWorker.controller.postMessage(signal, transferList);
                    }

                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Valo: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("Proxy Register Error", e); }
            }
            await window.checkBare();
        })();
    </script>

<style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);

        }

            color: var(--text-muted);
            font-weight: 300;

            font-weight: 200 !important;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar main"
                "bottombar bottombar";
            grid-template-columns: 280px 1fr;
            grid-template-rows: 1fr 80px;
            height: 100vh;
            width: 100%;
            background: var(--bg-page);
        }

        .sidebar {
            grid-area: sidebar;
            background: var(--bg-page);
            border-right: 1px solid var(--border-main);
            display: flex;
            flex-direction: column;
            padding: 32px 0;
            overflow-y: auto;
        }

        .main-view {
            grid-area: main;
            background: var(--bg-page);
            overflow-y: auto;
            position: relative;
            padding: 32px;
        }

        .bottom-bar {
            grid-area: bottombar;
            background: var(--bg-page);
            opacity: 0.9;
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-main);
            display: flex;
            align-items: center;
            padding: 0 32px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            color: var(--text-muted);
            opacity: 0.6;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 18px;
            margin: 0 16px;
            font-weight: 300;
        }

        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            opacity: 1;
            background: var(--border-faint);
        }

        .nav-item.active {
            color: var(--accent-color);
            background: var(--btn-bg);
            border: 1px solid var(--accent-glow);
        }

        .match-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .match-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }

        .status-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 4px 12px;
            border-radius: 100px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .status-badge.live {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .status-badge.live::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #ef4444;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .team-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }

        .search-box {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 498px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--accent-color);
            background: var(--bg-page);
            box-shadow: 0 0 0 4px var(--btn-bg);
        }

        .sport-chip {
            padding: 8px 20px;
            border-radius: 100px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .sport-chip:hover, .sport-chip.active {
            border-color: var(--accent-color);
            color: var(--text-main);
            background: var(--btn-bg);
        }

        /* Modal / Stream Player */
        #player-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-main);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-player {
            position: absolute;
            top: -50px;
            right: 0;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .close-player:hover { opacity: 1; }
