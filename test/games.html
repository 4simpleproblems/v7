<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <title>4SP - GAMES</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/x-icon" href="../favicon.ico" id="faviconLink">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/injector.js"></script>
    <style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Geist', sans-serif; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300;
            overflow: hidden;
        }

        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }

        #games-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #games-sidebar {
            width: 380px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-main);
            background: var(--bg-card);
            padding: 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        #games-main-view {
            flex-grow: 1;
            padding: 64px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .category-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
            text-align: left;
            background: transparent;
        }
        .category-item:hover { background: var(--btn-bg); color: var(--accent-color); }
        .category-item.active { background: var(--btn-bg); color: var(--accent-color); border-color: var(--accent-glow); }

        .game-card {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 1.5rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            cursor: pointer;
        }
        .game-card:hover { border-color: var(--accent-color); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .game-card-img { aspect-ratio: 16/10; width: 100%; object-fit: cover; border-bottom: 1px solid var(--border-main); }

        .btn-card-action {
            display: inline-flex;
            align-items: center; justify-content: center;
            width: 2.25rem; height: 2.25rem;
            border-radius: 12px;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            transition: all 0.2s;
        }
        .btn-card-action:hover { border-color: var(--accent-color); color: var(--accent-color); background: var(--btn-bg); }
        .btn-card-action.favorited { background: var(--accent-color); color: white; border-color: var(--accent-color); }

        #zoneViewer { 
            display: none; position: fixed; inset: 0;
            background-color: var(--bg-page); z-index: 5000; flex-direction: column; 
        }
        #zoneViewer.active { display: flex; }
        .zone-header {
            background-color: var(--bg-card);
            padding: 12px 24px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-main);
        }
        #zoneFrame { flex-grow: 1; border: none; }

        .custom-scroll::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body class="grid-bg min-h-screen relative">
    <div id="dynamic-background"></div>
    <div id="navbar-container"></div>

    <main id="games-container">
        <aside id="games-sidebar" class="custom-scroll">
            <div class="mb-12">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2">Discovery</p>
                <h2 class="text-4xl font-light tracking-tight">Game Hub</h2>
            </div>

            <div class="mb-10">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 opacity-30 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Search games..." 
                        class="w-full bg-white/5 border border-white/10 rounded-2xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:border-[var(--accent-color)] transition-colors text-white">
                </div>
            </div>

            <nav id="category-nav" class="flex flex-col gap-2 mb-10"></nav>

            <div class="mt-auto">
                <button id="creditsBtn" class="category-item">
                    <i class="fa-solid fa-users"></i> System Credits
                </button>
            </div>
        </aside>

        <section id="games-main-view" class="custom-scroll">
            <div id="favoritesSection" class="mb-16 hidden">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2">Saved Content</p>
                <h2 class="text-5xl font-light tracking-tight mb-8">Your Favorites</h2>
                <div id="favoritesGameList" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6"></div>
            </div>

            <div id="category-viewer">
                <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2" id="current-category-label">Collection</p>
                <h2 class="text-6xl font-light tracking-tight mb-12" id="active-category-title">All Games</h2>
                <div id="games-grid-container" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-6 transition-opacity duration-300"></div>
            </div>
        </section>
    </main>

    <div id="zoneViewer">
        <div class="zone-header">
            <h2 id="zoneNameEl" class="text-lg font-medium">Game Title</h2>
            <div class="flex gap-2">
                <button id="fullscreenBtnZone" class="btn-card-action"><i class="fas fa-expand"></i></button>
                <button id="closeBtnZone" class="btn-card-action"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <iframe id="zoneFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" title="Game Content"></iframe>
    </div>

    <script type="module">
        // Configuration
        const WORKER_ROOT = "https://dv-service-lfs.4simpleproblems.workers.dev/";
        const GAMES_BASE_URL = "https://dv-service-lfs.4simpleproblems.workers.dev/GAMES/";
        const CARDS_DATA_URL = "https://dv-service-lfs.4simpleproblems.workers.dev/GAMES/cards-data.js";
        const FAVORITES_KEY = 'gameHubFavorites_v3';

        let allGames = [];
        let searchableGames = [];
        let categories = [];
        let currentCategoryIndex = 0;

        const getFavorites = () => JSON.parse(localStorage.getItem(FAVORITES_KEY)) || [];
        const saveFavorites = (favs) => localStorage.setItem(FAVORITES_KEY, JSON.stringify(favs));

        const imageObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const img = entry.target;
                    if (img.dataset.src) img.src = img.dataset.src;
                    imageObserver.unobserve(img);
                }
            });
        }, { rootMargin: "200px" });

        function resolveGameUrl(path) {
            if (!path) return "";
            if (path.startsWith('http')) return path;
            if (path.startsWith('../')) return `${WORKER_ROOT}${path.substring(3)}`;
            return `${GAMES_BASE_URL}${path.replace(/^\.\//, '')}`;
        }

        function createGameCard(game, forceSmall = false) {
            const isStrongdog = game.category === 'StrongdogXP';
            let imgSrc = game.imgSrc;
            if (isStrongdog) imgSrc = `${WORKER_ROOT}strongdog${game.page || 1}/img/${game.imgSrc}`;
            else imgSrc = resolveGameUrl(game.imgSrc);

            const isFav = getFavorites().map(String).includes(String(game.id));
            const card = document.createElement("div");
            card.className = 'game-card';
            card.innerHTML = `
                <img data-src="${imgSrc}" alt="${game.name}" class="game-card-img">
                <div class="p-4">
                    <h3 class="font-medium truncate text-sm mb-3">${game.name}</h3>
                    <div class="flex justify-between items-center">
                        <button class="btn-card-action play-action"><i class="fa-solid fa-play text-xs"></i></button>
                        <button class="btn-card-action fav-action ${isFav ? 'favorited' : ''}"><i class="fa-solid fa-star text-xs"></i></button>
                    </div>
                </div>
            `;

            const play = async (e) => {
                e.stopPropagation();
                let url = resolveGameUrl(game.url || game.href);
                if (isStrongdog) {
                    const base = game.page > 1 ? `${WORKER_ROOT}strongdog${game.page}/` : `${WORKER_ROOT}GAMES/`;
                    url = base + game.href.replace(/^\.\//, "");
                }
                openZone(game.name, url, game.id);
            };

            card.addEventListener('click', play);
            card.querySelector('.play-action').addEventListener('click', play);
            card.querySelector('.fav-action').addEventListener('click', (e) => {
                e.stopPropagation();
                toggleFavorite(game.id);
                e.target.closest('.fav-action').classList.toggle('favorited');
            });

            imageObserver.observe(card.querySelector('img'));
            return card;
        }

        function toggleFavorite(id) {
            let favs = getFavorites().map(String);
            const strId = String(id);
            if (favs.includes(strId)) favs = favs.filter(f => f !== strId);
            else favs.push(strId);
            saveFavorites(favs);
            renderFavorites();
        }

        function renderFavorites() {
            const favIds = getFavorites().map(String);
            const section = document.getElementById("favoritesSection");
            const list = document.getElementById("favoritesGameList");
            if (favIds.length > 0) {
                section.classList.remove('hidden');
                list.innerHTML = '';
                allGames.filter(g => favIds.includes(String(g.id))).forEach(g => list.appendChild(createGameCard(g, true)));
            } else section.classList.add('hidden');
        }

        function openZone(name, url, id) {
            const viewer = document.getElementById('zoneViewer');
            const frame = document.getElementById('zoneFrame');
            document.getElementById('zoneNameEl').textContent = name;
            frame.src = url;
            viewer.classList.add('active');
        }

        window.closeZoneViewer = () => {
            const viewer = document.getElementById('zoneViewer');
            document.getElementById('zoneFrame').src = 'about:blank';
            viewer.classList.remove('active');
        };

        document.getElementById('closeBtnZone').onclick = window.closeZoneViewer;
        document.getElementById('fullscreenBtnZone').onclick = () => document.getElementById('zoneFrame').requestFullscreen();

        async function switchCategory(idx) {
            currentCategoryIndex = idx;
            const container = document.getElementById('games-grid-container');
            container.style.opacity = '0';
            setTimeout(() => {
                const cat = categories[idx];
                document.getElementById('active-category-title').textContent = cat;
                container.innerHTML = '';
                allGames.filter(g => g.category === cat).forEach(g => container.appendChild(createGameCard(g)));
                container.style.opacity = '1';
                updateCategoryNav();
            }, 150);
        }

        function updateCategoryNav() {
            const nav = document.getElementById('category-nav');
            nav.innerHTML = categories.map((cat, i) => `
                <button class="category-item ${i === currentCategoryIndex ? 'active' : ''}" data-idx="${i}">
                    <i class="fa-solid fa-layer-group opacity-30"></i>
                    <span>${cat}</span>
                </button>
            `).join('');
            nav.querySelectorAll('.category-item').forEach(btn => btn.onclick = () => switchCategory(parseInt(btn.dataset.idx)));
        }

        async function init() {
            try {
                const res = await fetch(CARDS_DATA_URL);
                const text = await res.text();
                const data = eval(text.replace('export default', ''));
                allGames = data.map(g => ({ ...g, category: 'StrongdogXP' }));
                
                categories = ['StrongdogXP'];
                updateCategoryNav();
                switchCategory(0);
                renderFavorites();

                document.getElementById('searchInput').oninput = (e) => {
                    const term = e.target.value.toLowerCase();
                    const container = document.getElementById('games-grid-container');
                    container.innerHTML = '';
                    allGames.filter(g => g.name.toLowerCase().includes(term)).slice(0, 50).forEach(g => container.appendChild(createGameCard(g)));
                };
            } catch (e) { console.error(e); }
        }

        init();
    </script>
</body>
</html>
