<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velium Music</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- VERN_SYSTEM Proxy Scripts (Local) -->
    <link rel="preload" href="/VELIUM/uv/uv.bundle.js" as="script">
    <link rel="preload" href="/VELIUM/baremux/index.js" as="script">
    <link rel="preload" href="/VELIUM/baremux/worker.js" as="worker">
    <link rel="preload" href="/VELIUM/uv/sw.js" as="worker">

    <script src="/VELIUM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VELIUM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: basePath + "sw.js",
        };
    </script>
    <script src="/VELIUM/baremux/index.js"></script>
    <script>
        // Immediate Initialization of VERN_SYSTEM Proxy
        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    // Register Root SW
                    const reg = await navigator.serviceWorker.register("/VELIUM/sw.js", {
                        scope: "/VELIUM/"
                    });
                    console.log("VERN_SYSTEM SW Registered");

                    // Reload if controller changes (SW activated)
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!navigator.serviceWorker.controller) return;
                        console.log("SW Activated, reloading...");
                        window.location.reload();
                    });

                } catch (e) {
                    console.error("SW Register Failed", e);
                }
            }
            try {
                const connection = new BareMux.BareMuxConnection("/VELIUM/baremux/worker.js");
                const wispUrl = "wss://wisp.mercurywork.shop/";
                connection.setTransport("/VELIUM/libcurl/index.mjs", [{ websocket: wispUrl }]);
                console.log("BareMux Initialized");
            } catch (e) {
                console.error("BareMux Init Failed", e);
            }
        })();
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#040404',
                        'card-dark': '#111111',
                        'accent-indigo': '#4f46e5',
                        'brand-border': '#252525',
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: #040404; 
            color: #d1d5db; 
            font-weight: 300; 
            padding-bottom: 120px; /* Space for player */
        }

        /* --- Global Scrollbar --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* --- Toolbar Button Style --- */
        .btn-toolbar-style {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 16px;
            color: #d1d5db;
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            position: relative;
        }
        .btn-toolbar-style:hover {
            border-color: #fff;
            color: #fff;
            transform: scale(1.02) translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.1);
            z-index: 50;
        }
        .btn-toolbar-style:active {
            transform: scale(0.98);
            transition: transform 0.05s ease-out !important;
        }
        .btn-toolbar-style.active {
            background-color: rgba(79, 70, 229, 0.1);
            border-color: #4f46e5;
            color: #4f46e5;
        }

        /* --- Search Bar --- */
        #search-container {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        #search-container:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.15);
            border-color: #4f46e5;
        }

        /* --- Player Bar (Fixed Dark Style) --- */
        #player-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 90px;
            background-color: #000000;
            border-top: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            transition: background-color 0.5s ease;
            cursor: pointer;
        }
        #player-bar:hover {
            background-color: #111;
        }

        .player-info { display: flex; align-items: center; gap: 1rem; width: 300px; }
        .player-info img { 
            width: 56px; height: 56px; 
            border-radius: 0.5rem; 
            border: 1px solid rgba(255,255,255,0.1);
            object-fit: cover;
        }
        .player-text { display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .player-title { color: white; font-size: 0.95rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
        .player-artist { color: rgba(255,255,255,0.7); font-size: 0.75rem; }

        .custom-player-controls {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; max-width: 600px;
        }
        .control-buttons { display: flex; gap: 2rem; align-items: center; }
        .player-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 1.2rem; cursor: pointer; transition: all 0.2s; }
        .player-btn:hover { color: white; transform: scale(1.1); }
        .play-btn { color: white; font-size: 2.5rem; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; }
        .play-btn:hover { transform: scale(1.1); }

        .progress-container { width: 100%; display: flex; align-items: center; gap: 1rem; color: rgba(255,255,255,0.7); font-size: 0.75rem; }
        .progress-bar {
            flex: 1; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px;
            -webkit-appearance: none; outline: none; cursor: pointer;
        }
        /* Thumb always visible */
        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px; background: white; border-radius: 50%; opacity: 1; transition: transform 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .progress-container:hover .progress-bar::-webkit-slider-thumb { transform: scale(1.2); }

        .volume-controls { display: flex; align-items: center; gap: 1rem; width: 200px; justify-content: flex-end; color: rgba(255,255,255,0.6); }
        .volume-slider { width: 80px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; -webkit-appearance: none; outline: none; }
        .volume-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 10px; background: rgba(255,255,255,0.8); border-radius: 50%; }

        /* --- Fullscreen Player Styles --- */
        #fs-player {
            position: fixed; inset: 0; z-index: 200;
            background: #111; 
            display: flex; flex-direction: column;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%); opacity: 0; pointer-events: none;
        }
        #fs-player.active {
            transform: translateY(0); opacity: 1; pointer-events: auto;
        }
        
        #fs-bg-art {
            position: absolute; inset: 0; z-index: 0;
            background-size: cover; background-position: center;
            opacity: 0.4; filter: blur(60px); transform: scale(1.2);
            transition: background-image 0.5s ease;
        }
        #fs-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); z-index: 1; }

        .fs-content {
            position: relative; z-index: 10;
            flex: 1; display: flex; flex-direction: column;
            padding: 2rem;
        }
        
        .fs-header { display: flex; justify-content: center; align-items: center; position: relative; height: 60px; }
        .fs-close-btn { 
            position: absolute; left: 0; top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px; border-radius: 50%; 
            background: rgba(255,255,255,0.1); border: none; color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.2s;
        }
        .fs-close-btn:hover { background: rgba(255,255,255,0.2); }

        .fs-body {
            flex: 1; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            gap: 3rem; width: 100%; max-width: 1000px; margin: 0 auto;
        }
        
        /* Desktop Layout: Side by Side */
        @media (min-width: 768px) {
            .fs-body { flex-direction: row; align-items: center; gap: 5rem; }
            .fs-art-container { width: 450px !important; height: 450px !important; }
            .fs-controls-container { flex: 1; max-width: 400px; }
        }

        .fs-art-container {
            width: 300px; height: 300px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border-radius: 12px; overflow: hidden;
            transition: transform 0.3s ease;
        }
        .fs-art-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .fs-controls-container { width: 100%; display: flex; flex-direction: column; gap: 1.5rem; }
        
        .fs-text-info { text-align: left; }
        .fs-title { font-size: 2rem; font-weight: 700; color: white; margin-bottom: 0.25rem; line-height: 1.2; }
        .fs-artist { font-size: 1.25rem; color: rgba(255,255,255,0.7); font-weight: 400; }

        .fs-slider-container { width: 100%; }
        .fs-time-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: rgba(255,255,255,0.5); margin-top: 0.5rem; font-family: monospace; }
        
        .fs-buttons { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-top: 1rem; 
        }
        .fs-main-actions { display: flex; align-items: center; gap: 2rem; }
        .fs-btn { background: none; border: none; color: white; cursor: pointer; transition: transform 0.1s; opacity: 0.8; }
        .fs-btn:hover { opacity: 1; }
        .fs-btn:active { transform: scale(0.95); }
        .fs-play-btn { font-size: 4rem; opacity: 1; }
        
        /* --- Modals (Match 4SP DV Settings) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px); z-index: 200;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: #000; border: 1px solid #333;
            border-radius: 18px; 
            width: 90%; max-width: 450px;
            transform: scale(0.95); transition: transform 0.2s;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-header {
            padding: 1.5rem; border-bottom: 1px solid #333;
            background: #000; display: flex; justify-content: space-between; align-items: center;
        }
        .modal-body { padding: 1.5rem; background: #0a0a0a; display: flex; flex-direction: column; gap: 1rem; }

        .modal-input {
            width: 100%; background: #111; border: 1px solid #252525;
            color: white; padding: 0.75rem; border-radius: 16px;
            outline: none; transition: all 0.2s;
        }
        .modal-input:focus { border-color: #4f46e5; transform: scale(1.01); }

        .modal-btn {
            width: 100%; padding: 0.75rem 1.25rem; border-radius: 16px;
            font-weight: 500; cursor: pointer; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center; font-size: 0.9rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
        }
        .modal-btn:hover { transform: scale(1.02) translateY(-1px); }
        .modal-btn:active { transform: scale(0.98); transition: transform 0.05s ease-out !important; }

        .btn-primary { background: rgba(79, 70, 229, 0.1); color: #4f46e5; border: 1px solid #4f46e5; }
        .btn-primary:hover { background: rgba(79, 70, 229, 0.15); border-color: #6366f1; color: #6366f1; }
        
        .btn-secondary { background: #0a0a0a; color: #d1d5db; border: 1px solid #333; }
        .btn-secondary:hover { border-color: #fff; color: white; }
        
        .btn-danger { background: rgba(220, 38, 38, 0.1); color: #dc2626; border: 1px solid #dc2626; }
        .btn-danger:hover { background: rgba(220, 38, 38, 0.15); border-color: #ef4444; color: #ef4444; }

        .close-btn-round {
            width: 2.5rem; height: 2.5rem; border-radius: 16px;
            background: #0a0a0a; border: 1px solid #333; color: #d1d5db;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .close-btn-round:hover { border-color: #fff; color: #fff; transform: scale(1.05); }

        /* Cropper */
        #cropper-modal-content { max-width: 600px; }
        #cropperCanvasContainer {
            position: relative; margin: 0 auto; overflow: hidden; max-height: 60vh; border: 1px dashed #333; border-radius: 8px;
        }
        canvas { display: block; max-width: 100%; }

        /* --- Library Drawer List Items --- */
        .compact-list-item {
            border-radius: 16px; 
            margin-bottom: 2px;
            padding: 0.5rem; 
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .compact-list-item:hover { background-color: #1a1a1a; }

        /* --- Notifications --- */
        #notification-container { position: fixed; bottom: 2rem; right: 2rem; display: flex; flex-direction: column; gap: 0.75rem; z-index: 1000; pointer-events: none; }
        .notification-toast { background-color: #0a0a0a; border: 1px solid #333; border-radius: 14px; padding: 0.75rem 1.25rem; color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; min-width: 200px; transform: translateX(120%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease, background-color 0.2s; opacity: 0; pointer-events: auto; cursor: default; }
        .notification-toast.show { transform: translateX(0); opacity: 1; }
        .notification-toast.show:hover { transform: scale(1.05) translateX(-5px); background-color: #151515; border-color: #555; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
        .notification-icon { font-size: 1.1rem; }
        .notification-icon.success { color: #4ade80; }
        .notification-icon.info { color: #60a5fa; }
        .notification-icon.warning { color: #fbbf24; }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        
        .loader { display: flex; justify-content: center; align-items: center; height: 200px; color: #4f46e5; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen relative">

    <header class="fixed top-0 left-0 right-0 bg-black/80 backdrop-blur-md z-40 border-b border-brand-border h-16 flex items-center justify-between px-6">
        <div class="flex items-center gap-4">
            <h1 class="text-xl text-white tracking-widest font-bold mr-4">VELIUM</h1>
            
            <label class="cursor-pointer">
                <input type="radio" name="search-type" value="song" class="hidden peer" checked>
                <div class="btn-toolbar-style peer-checked:active">
                    <i class="fas fa-music"></i> Songs
                </div>
            </label>
            <label class="cursor-pointer">
                <input type="radio" name="search-type" value="artist" class="hidden peer">
                <div class="btn-toolbar-style peer-checked:active">
                    <i class="fas fa-microphone-lines"></i> Artists
                </div>
            </label>
        </div>

        <div class="flex items-center gap-3">
             <button onclick="openCreatePlaylistModal()" class="btn-toolbar-style" title="New Playlist">
                <i class="fas fa-plus"></i> New Playlist
            </button>
             <button id="view-library-btn" class="btn-toolbar-style" title="My Library" onclick="document.getElementById('library-drawer').classList.toggle('translate-x-full')">
                <i class="fas fa-layer-group"></i> Library
            </button>
             <div class="relative">
                <button id="settings-btn" class="btn-toolbar-style !px-3" title="Settings" onclick="toggleSettingsMenu()">
                    <i class="fas fa-gear"></i>
                </button>
                <div id="settings-dropdown" class="absolute right-0 top-full mt-2 w-64 bg-[#0a0a0a] border border-[#333] rounded-2xl shadow-xl p-4 hidden z-50 transform origin-top-right transition-all duration-200">
                    <h3 class="text-white font-bold mb-3 text-sm uppercase tracking-wider border-b border-[#333] pb-2">Playback</h3>
                    
                    <div class="flex flex-col gap-3">
                        <div class="flex justify-between items-center">
                            <span class="text-gray-400 text-sm">Transition</span>
                            <select id="transition-select" class="bg-[#111] text-white text-sm border border-[#333] rounded-lg p-1 outline-none focus:border-indigo-500" onchange="handleTransitionChange()">
                                <option value="none">None</option>
                                <option value="crossfade">Crossfade</option>
                            </select>
                        </div>

                        <div id="crossfade-slider-container" class="hidden flex-col gap-1 transition-all duration-300">
                            <div class="flex justify-between text-xs text-gray-500">
                                <span>Duration</span>
                                <span id="crossfade-value">6s</span>
                            </div>
                            <input type="range" id="crossfade-slider" min="3" max="12" value="6" step="1" class="w-full accent-indigo-500 h-1 bg-[#333] rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="pt-24 px-4 sm:px-8 max-w-screen-2xl mx-auto">
        
        <div class="max-w-3xl mx-auto mb-12">
            <div id="search-container" class="relative flex items-center bg-[#111] border border-[#333] rounded-2xl p-2 group transition-all">
                <i class="fas fa-search text-gray-500 ml-4 text-lg"></i>
                <input type="text" id="search-box" placeholder="Search for songs, artists..." 
                       class="w-full bg-transparent border-none outline-none text-white px-4 py-3 text-lg placeholder-gray-600 font-light">
                <button onclick="handleSearch()" class="btn-toolbar-style active px-8">Search</button>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <h2 id="main-header" class="text-2xl text-white font-medium">Home</h2>
        </div>

        <div id="content-area" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div class="col-span-full flex flex-col items-center justify-center text-gray-500 mt-20 opacity-50">
                <i class="fas fa-wave-square text-6xl mb-4"></i>
                <p class="text-xl">Discover your sound.</p>
            </div>
        </div>

    </main>

    <aside id="library-drawer" class="fixed top-0 right-0 h-full w-80 bg-[#0a0a0a] border-l border-[#252525] z-50 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col pt-20">
        <div class="px-6 pb-4 border-b border-[#252525] flex justify-between items-center">
            <h2 class="text-xl text-white font-medium">Your Library</h2>
            <button onclick="document.getElementById('library-drawer').classList.add('translate-x-full')" class="text-gray-400 hover:text-white">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <div id="library-list" class="flex-grow overflow-y-auto p-4 space-y-2">
            </div>
    </aside>

    <div id="fs-player">
        <div id="fs-bg-art"></div>
        <div id="fs-overlay"></div>
        
        <div class="fs-content">
            <div class="fs-header">
                <button class="fs-close-btn" onclick="closeFullscreenPlayer()">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <span class="text-xs font-bold uppercase tracking-widest text-gray-400">Now Playing</span>
            </div>
            
            <div class="fs-body">
                <div class="fs-art-container">
                    <img id="fs-art" src="" alt="Album Art">
                </div>
                
                <div class="fs-controls-container">
                    <div class="fs-text-info">
                        <h2 id="fs-title" class="fs-title">Song Title</h2>
                        <p id="fs-artist" class="fs-artist">Artist Name</p>
                    </div>
                    
                    <div class="fs-slider-container">
                        <input type="range" class="progress-bar" id="fs-seek-slider" min="0" max="100" step="0.01" value="0">
                        <div class="fs-time-info">
                            <span id="fs-current-time">0:00</span>
                            <span id="fs-duration">0:00</span>
                        </div>
                    </div>
                    
                    <div class="fs-buttons">
                        <button class="fs-btn"><i class="fas fa-shuffle text-xl"></i></button>
                        <div class="fs-main-actions">
                            <button class="fs-btn" onclick="document.getElementById('audio-player').currentTime -= 10"><i class="fas fa-backward text-2xl"></i></button>
                            <button class="fs-btn fs-play-btn" id="fs-play-btn" onclick="document.getElementById('play-pause-btn').click()"><i class="fas fa-play-circle"></i></button>
                            <button class="fs-btn" onclick="document.getElementById('audio-player').currentTime += 10"><i class="fas fa-forward text-2xl"></i></button>
                        </div>
                        <button class="fs-btn"><i class="fas fa-repeat text-xl"></i></button>
                    </div>

                    <div class="flex items-center gap-3 mt-4">
                        <i class="fas fa-volume-low text-gray-400 text-xs"></i>
                        <input type="range" class="volume-slider flex-1" id="fs-volume-slider" min="0" max="1" step="0.01" value="1">
                        <i class="fas fa-volume-high text-gray-400 text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="player-bar" class="hidden" onclick="openFullscreenPlayer(event)">
        <div class="player-info group">
            <div class="relative w-14 h-14">
                <img id="player-img" src="" alt="Cover" class="w-full h-full object-cover rounded-lg group-hover:opacity-60 transition">
                <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                    <i class="fas fa-expand text-white drop-shadow-md"></i>
                </div>
            </div>
            <div class="player-text">

    <script src="db.js"></script>
    <script src="script.js"></script>

    <script src="uv/uv.bundle.js"></script>
    <script>
    // --- Sound & Notification Logic ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let isMuted = false;

    function playClickSound() {
        if (isMuted) return; if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
        osc.connect(gainNode); gainNode.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.015);
        osc.start(); osc.stop(audioCtx.currentTime + 0.015);
    }

    const notificationContainer = document.getElementById('notification-container');
    window.showNotification = function(message, iconClass = 'fa-solid fa-info-circle', type = 'info') {
        if (!notificationContainer) return;
        while (notificationContainer.children.length >= 3) notificationContainer.removeChild(notificationContainer.firstChild);
        const toast = document.createElement('div'); toast.className = 'notification-toast';
        toast.innerHTML = `<i class="${iconClass} notification-icon ${type}"></i><span>${message}</span>`;
        notificationContainer.appendChild(toast);
        requestAnimationFrame(() => { toast.classList.add('show'); playClickSound(); });
        setTimeout(() => { toast.classList.remove('show'); setTimeout(() => { if (toast.parentElement) toast.remove(); }, 300); }, 3000);
    };
    
    window.showToast = function(msg) {
        window.showNotification(msg, 'fa-solid fa-bell', 'info');
    };

    // --- FULLSCREEN PLAYER LOGIC ---

    // Open logic
    window.openFullscreenPlayer = function(e) {
        // Prevent opening if clicking on controls inside the mini player
        if(e && (e.target.closest('button') || e.target.closest('input') || e.target.closest('a'))) return;

        const fsPlayer = document.getElementById('fs-player');
        const miniImg = document.getElementById('player-img');
        const miniTitle = document.getElementById('player-title');
        const miniArtist = document.getElementById('player-artist');

        // Sync Data from Mini Player to Fullscreen
        if(miniImg.src) {
            document.getElementById('fs-art').src = miniImg.src;
            document.getElementById('fs-bg-art').style.backgroundImage = `url('${miniImg.src}')`;
        }
        document.getElementById('fs-title').innerText = miniTitle.innerText;
        document.getElementById('fs-artist').innerText = miniArtist.innerText;

        // Show
        fsPlayer.classList.add('active');
    };

    // Close logic
    window.closeFullscreenPlayer = function() {
        document.getElementById('fs-player').classList.remove('active');
    };

    // --- SYNC LOGIC (Mini Player <-> Fullscreen) ---
    // Wait for DOM
    document.addEventListener('DOMContentLoaded', () => {
        // IMPORTANT: Use local variable 'fsAudio' to avoid clash with 'audioPlayer' in script.js
        const fsAudio = document.getElementById('velium-audio-player');
        const playBtn = document.getElementById('play-pause-btn');
        const fsPlayBtn = document.getElementById('fs-play-btn');
        const fsSeek = document.getElementById('fs-seek-slider');
        const fsVol = document.getElementById('fs-volume-slider');
        const volSlider = document.getElementById('volume-slider');

        // 1. Sync Play/Pause Button Icon
        if(playBtn && fsPlayBtn) {
            const observer = new MutationObserver((mutations) => {
                mutations.forEach((mutation) => {
                    if(mutation.type === 'childList' || mutation.type === 'attributes') {
                        // Check if mini player has pause icon
                        const isPlaying = playBtn.innerHTML.includes('fa-pause');
                        fsPlayBtn.innerHTML = isPlaying 
                            ? '<i class="fas fa-pause-circle text-[70px]"></i>' 
                            : '<i class="fas fa-play-circle text-[70px]"></i>';
                    }
                });
            });
            observer.observe(playBtn, { childList: true, attributes: true, subtree: true });
        }

        // 2. Sync Progress & Time
        if(fsAudio) {
            fsAudio.addEventListener('timeupdate', () => {
                if(!fsAudio.duration) return;
                
                // Calculate percentage
                const pct = (fsAudio.currentTime / fsAudio.duration) * 100;
                
                // Update FS Slider
                if(fsSeek) {
                    fsSeek.value = pct;
                    fsSeek.style.backgroundSize = `${pct}% 100%`;
                }

                // Update FS Time Text
                document.getElementById('fs-current-time').innerText = formatTime(fsAudio.currentTime);
                document.getElementById('fs-duration').innerText = formatTime(fsAudio.duration);
            });
        }

        // 3. Sync Volume
        if(volSlider && fsVol) {
            // Mini -> FS
            volSlider.addEventListener('input', (e) => { fsVol.value = e.target.value; });
            // FS -> Audio & Mini
            fsVol.addEventListener('input', (e) => { 
                if(fsAudio) fsAudio.volume = e.target.value; 
                volSlider.value = e.target.value; 
            });
        }

        // 4. FS Slider Seek Functionality
        if(fsSeek && fsAudio) {
            fsSeek.addEventListener('input', (e) => {
                const time = (fsAudio.duration / 100) * e.target.value;
                fsAudio.currentTime = time;
            });
        }
    });

    function formatTime(seconds) {
        if(isNaN(seconds)) return "0:00";
        const min = Math.floor(seconds / 60);
        const sec = Math.floor(seconds % 60);
        return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }
    </script>
