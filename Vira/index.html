<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script>
        // Generate a unique ID for this session to ensure a fresh proxy identity
        const viraId = Math.random().toString(36).substring(2, 10);
        console.log("VIRA: Session ID initialized:", viraId);

        // Ultraviolet Configuration
        const basePath = "/VORA/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            bare: "/bare/",
            encodeUrl: (url) => {
                if (typeof Ultraviolet === 'undefined') return url;
                return Ultraviolet.codec.xor.encode(url);
            },
            decodeUrl: (url) => {
                if (typeof Ultraviolet === 'undefined') return url;
                return Ultraviolet.codec.xor.decode(url);
            },
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/sw.js",
        };
    </script>

    <!-- VERN_SYSTEM Proxy Scripts -->
    <script src="/VORA/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script src="/VORA/VERN_SYSTEM/baremux/index.js"></script>
    <script>
        window.checkBare = async () => {
            try {
                // Ensure BareMux is ready and set transport immediately
                const connection = new BareMux.BareMuxConnection("/VORA/VERN_SYSTEM/baremux/worker.js");
                const wispUrl = "wss://wisp.lol/";
                const transportPath = "/VORA/VERN_SYSTEM/libcurl/index.mjs";
                
                await connection.setTransport(transportPath, [{ websocket: wispUrl }]);
                console.log("VIRA: Proxy transport established.");
            } catch (e) {
                console.warn("VIRA: BareMux initialization issue:", e);
            }
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira - YouTube</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#000000',
                        'accent-red': '#FF0000',
                        'brand-border': '#333333',
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Manrope', sans-serif; 
            background-color: #000000; 
            color: #c0c0c0; 
            font-weight: 300; 
            margin: 0;
            display: flex;
            min-height: 100vh;
            padding-top: 64px;
        }

        .sidebar {
            width: 260px;
            background-color: #000000;
            border-right: 1px solid #333;
            height: calc(100vh - 64px);
            position: fixed;
            left: 0;
            top: 64px;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 100;
        }

        .main-content {
            margin-left: 260px;
            flex-grow: 1;
            padding: 48px;
            min-height: 100vh;
            width: calc(100% - 260px);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #888;
            text-decoration: none;
            border-radius: 14px;
            margin-bottom: 4px;
            font-size: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .nav-link:hover, .nav-link.active {
            background-color: rgba(255, 0, 0, 0.1);
            color: #FF0000;
            border: 1px solid #FF0000;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 24px; width: 100%; }
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .video-item {
            background-color: #000000;
            border: 1px solid #333;
            border-radius: 0.75rem;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .video-item:hover {
            border-color: #FF0000;
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.15);
        }

        .thumbnail-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
        }

        .thumbnail-container img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-item:hover .play-overlay { opacity: 1; }

        .search-input {
            background: #000000;
            border: 1px solid #333;
            color: white;
            transition: all 0.3s ease;
            border-radius: 14px;
        }
        .search-input:focus {
            border-color: #FF0000;
            outline: none;
            box-shadow: 0 0 0 2px rgba(255, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    
    <script src="../navigation.js"></script>
    <script src="/injector.js"></script>
</head>
<body class="bg-deep-black">
    <nav class="sidebar">
        <div class="logo flex items-center gap-3 mb-10 px-2">
            <img src="../images/logo.png" id="navbar-logo" class="w-8 h-8 object-contain" alt="4SP Logo">
            <h1 class="text-xl tracking-tight text-white">VIRA</h1>
        </div>
        
        <div class="flex-grow">
            <a href="javascript:void(0)" onclick="window.location.hash=''; window.location.reload();" class="nav-link active">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            
            <div class="mt-8 mb-4 px-4">
                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Playlists</h3>
            </div>
            
            <div id="playlist-list" class="flex flex-col gap-1"></div>

            <button onclick="openCreatePlaylistModal()" class="nav-link w-full text-left mt-2 border border-dashed border-brand-border hover:border-accent-red">
                <i class="fas fa-plus"></i>
                <span>New Playlist</span>
            </button>
        </div>

        <div class="mt-auto pt-6 border-t border-brand-border">
            <a href="https://discord.com/invite/zcADhddGQz" target="_blank" class="nav-link">
                <i class="fab fa-discord"></i>
                <span>Discord</span>
            </a>
        </div>
    </nav>

    <div class="main-content">
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div class="flex flex-col">
                <h2 class="text-2xl text-white font-medium">Explore YouTube</h2>
                <p class="text-gray-500 text-sm">Search for videos, channels, and playlists.</p>
            </div>
            <div class="relative w-full md:w-96 flex items-center gap-2">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="searchInput" placeholder="Search YouTube..." class="search-input w-full pl-12 pr-4 py-3 rounded-[12px] text-sm">
                </div>
                <button id="searchCloseBtn" onclick="closePlayer()" class="hidden w-10 h-10 flex items-center justify-center rounded-[12px] bg-deep-black border border-brand-border hover:border-accent-red text-white transition-all">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </header>

        <main>
            <!-- Player Section -->
            <section id="player-section" class="mb-12 hidden">
                <div id="player-container" class="relative w-full rounded-[14px] overflow-hidden shadow-2xl border border-brand-border mb-6 bg-black">
                    <video id="vira-player" class="w-full aspect-video hidden" controls crossorigin="anonymous"></video>
                    <div id="embed-container" style="left: 0; width: 100%; height: 0; position: relative; padding-bottom: 56.25%;">
                        <iframe id="youtube-embed" src="" style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                    </div>
                </div>
                <div class="bg-card-dark p-8 rounded-[14px] border border-brand-border shadow-xl">
                    <div class="flex justify-between items-start mb-6">
                        <div class="flex-grow">
                            <h2 id="player-title" class="text-3xl text-white mb-2 font-medium">Video Title</h2>
                            <div class="flex items-center gap-4">
                                <p id="player-metadata" class="text-gray-500 text-sm"></p>
                                <button onclick="switchInstance()" class="text-accent-red text-xs hover:underline flex items-center gap-1">
                                    <i class="fas fa-redo"></i> Switch Instance
                                </button>
                            </div>
                        </div>
                        <button onclick="closePlayer()" class="w-12 h-12 flex items-center justify-center rounded-full bg-deep-black border border-brand-border hover:border-accent-red transition-all text-xl text-white">
                            <i class="fas fa-times"></i>
                        </button>
                    </div>
                    <div id="player-description" class="text-gray-400 leading-relaxed max-h-40 overflow-y-auto pr-2 custom-scrollbar"></div>
                    
                    <div class="mt-6 pt-4 border-t border-brand-border">
                        <button onclick="showComments()" class="text-accent-red hover:underline text-sm"><i class="fas fa-comment"></i> Show Comments</button>
                        <div id="comments-container" class="mt-4 hidden">
                            <!-- Comments will load here -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Results Section -->
            <section id="dynamic-section">
                <div id="dynamic-header" class="flex items-center gap-3 mb-6">
                    <i class="fas fa-youtube text-accent-red"></i>
                    <h2 id="dynamic-title" class="text-xl text-white">Search Results</h2>
                </div>
                <div id="videoGrid" class="video-grid">
                    <p class="text-gray-500 text-center col-span-full" id="noResultsMessage">Start by searching for videos!</p>
                </div>
            </section>
        </main>

        <footer class="mt-24 pt-12 border-t border-brand-border text-center text-xs text-gray-600">
            <p class="mb-4">Modified by US5.</p>
            <div class="flex justify-center gap-6">
                <a href="https://discord.gg/VDA8Ngx38Z" class="hover:text-accent-red transition-colors">Discord</a>
                <a href="#" class="hover:text-accent-red transition-colors">Back to top</a>
            </div>
        </footer>
    </div>

    <!-- Modals -->
    <div id="create-playlist-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-card-dark border border-brand-border p-8 rounded-[24px] w-full max-w-md shadow-2xl">
            <h3 class="text-2xl text-white font-medium mb-6">Create New Playlist</h3>
            <input type="text" id="new-playlist-name" placeholder="Playlist Name" class="search-input w-full p-4 mb-6 rounded-[14px]">
            <div class="flex justify-end gap-4">
                <button onclick="closeModals()" class="px-6 py-3 text-gray-400 hover:text-white transition-colors">Cancel</button>
                <button onclick="confirmCreatePlaylist()" class="px-8 py-3 bg-accent-red text-white rounded-[14px] hover:scale-105 transition-all">Create</button>
            </div>
        </div>
    </div>

    <div id="add-to-playlist-modal" class="fixed inset-0 z-[200] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm">
        <div class="bg-card-dark border border-brand-border p-8 rounded-[24px] w-full max-w-md shadow-2xl max-h-[80vh] flex flex-col">
            <h3 class="text-2xl text-white font-medium mb-6">Add to Playlist</h3>
            <div id="modal-playlist-list" class="flex flex-col gap-2 overflow-y-auto pr-2 custom-scrollbar mb-6"></div>
            <div class="flex justify-end gap-4">
                <button onclick="closeModals()" class="px-6 py-3 text-gray-400 hover:text-white transition-colors">Cancel</button>
                <button onclick="openCreatePlaylistModal()" class="px-6 py-3 border border-brand-border text-white rounded-[14px] hover:border-accent-red transition-all">New Playlist</button>
            </div>
        </div>
    </div>

    <script src="/Vira/script.js"></script>
<!-- Made with ❤️ from 4SP -->
</body>
</html>
