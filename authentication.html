<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - AUTHENTICATION</title>
    <meta name="description" content="Log into or create your 4SP account to access the student toolkit.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #0B0A10;
            --bg-card: #15131C;
            --text-main: #ffffff;
            --text-muted: #C4B0FF;
            --accent-color: #9D7BFF;
            --accent-glow: rgba(157, 123, 255, 0.15);
            --border-main: #2D273D;
            --border-hover: #9D7BFF;
        }

        body { 
            font-family: 'Manrope', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-muted); 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .auth-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 32px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5);
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
            margin: 2rem auto;
        }

        .input-style {
            width: 100%; 
            padding: 1rem 1.25rem; 
            border: 1px solid var(--border-main); 
            background-color: var(--bg-page); 
            border-radius: 16px; 
            color: var(--text-main); 
            font-size: 0.9375rem;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-style:focus {
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
            font-size: 0.9375rem;
            border-radius: 16px;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-primary {
            background-color: var(--accent-color);
            border: none;
            color: white;
        }
        .btn-primary:hover {
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 10px 20px var(--accent-glow);
        }
        .btn-secondary {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-main);
            margin-top: 1rem;
        }
        .btn-secondary:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .brand-bg {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
            z-index: -1;
            opacity: 0.4;
        }

        h2 { font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem; font-size: 2rem; }
        p { font-size: 0.9rem; margin-bottom: 2rem; }

        .message-area { min-height: 24px; margin-top: 1rem; font-size: 0.8rem; }
        .error-message { color: #f87171; }
        .success-message { color: #4ade80; }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-top: 2rem;
        }

        .social-btn {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .social-btn:hover {
            border-color: var(--accent-color);
            background: var(--bg-card);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            color: var(--text-muted);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-main);
            margin: 0 1rem;
        }

        .hidden { display: none !important; }
    </style>

<body class="flex flex-col min-h-screen">
    <div class="brand-bg"></div>
    <div id="navbar-container"></div>

    <main class="flex-grow flex items-center justify-center p-6">
        <div class="auth-container animate-slide-up w-full max-w-md">
            <!-- Consolidated Auth Forms -->
            <div id="auth-forms" class="w-full">
                <!-- Login View -->
                <div id="loginContainer" class="auth-view">
                    <h2 class="tracking-tighter">Welcome back</h2>
                    <p>Access your 4SP dashboard and tools.</p>
                    <form id="loginForm" novalidate class="space-y-4"> 
                        <input type="email" id="loginEmail" placeholder="Email Address" required class="input-style">
                        <input type="password" id="loginPassword" placeholder="Password" required class="input-style">
                        <div class="flex justify-end">
                            <a id="forgotPasswordLink" class="text-xs hover:text-[var(--accent-color)] transition-colors cursor-pointer">Forgot Password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary">Sign In</button>
                    </form>
                    <div id="loginMessage" class="message-area text-center"></div>
                    
                    <div class="divider">OR</div>

                    <div class="social-grid">
                        <button class="social-btn social-auth-btn" data-provider="google">
                            <i class="fa-brands fa-google"></i> Google
                        </button>
                        <button class="social-btn social-auth-btn" data-provider="discord">
                            <i class="fa-brands fa-discord"></i> Discord
                        </button>
                        <button class="social-btn social-auth-btn" data-provider="github">
                            <i class="fa-brands fa-github"></i> GitHub
                        </button>
                        <button class="social-btn social-auth-btn" data-provider="twitter">
                            <i class="fa-brands fa-x-twitter"></i> X
                        </button>
                    </div>

                    <button id="showSignupLink" class="btn btn-secondary">Create an account</button>
                </div>

                <!-- Reset View -->
                <div id="resetPasswordContainer" class="auth-view" style="display: none;">
                    <h2 class="tracking-tighter">Recover</h2>
                    <p>Enter your email for a recovery link.</p>
                    <form id="resetPasswordForm" novalidate class="space-y-4">
                        <input type="email" id="resetEmail" placeholder="Email Address" required class="input-style">
                        <button type="submit" class="btn btn-primary">Send Reset Link</button>
                    </form>
                    <div id="resetMessage" class="message-area text-center"></div>
                    <button id="backToLoginLink" class="btn btn-secondary">Back to Login</button>
                </div>

                <!-- Username Step View -->
                <div id="usernameContainer" class="auth-view" style="display: none;">
                    <h2 class="tracking-tighter">Identity</h2>
                    <p>Choose a unique username.</p>
                    <form id="usernameForm" novalidate class="space-y-4"> 
                        <input type="text" id="signupUsername" placeholder="Username" required class="input-style">
                        <button type="submit" class="btn btn-primary">Continue</button>
                    </form>
                    <div id="usernameMessage" class="message-area text-center"></div>
                    <button id="showLoginLink" class="btn btn-secondary">Already have an account?</button>
                </div>
                
                <!-- Final Signup View -->
                <div id="signupContainer" class="auth-view" style="display: none;">
                    <h2 class="tracking-tighter">Security</h2>
                    <p>Set your login credentials.</p>
                    <form id="signupForm" novalidate class="space-y-4"> 
                        <input type="email" id="signupEmail" placeholder="Email Address" required class="input-style">
                        <input type="password" id="signupPassword" placeholder="Password" required class="input-style">
                        <button type="submit" class="btn btn-primary">Create Account</button>
                    </form>
                    <div id="signupMessage" class="message-area text-center"></div>
                    <button id="backToUsernameLink" class="btn btn-secondary">Back</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-8 w-full">
        <div class="text-center text-gray-600 text-[10px] font-bold uppercase tracking-widest">
            &copy; 2026 4SP. Built for students.
        </div>
    </footer>

    <!-- Hidden V1 Auth for legacy logic (kept to avoid JS breaks) -->
    <div id="v1-auth-wrapper" class="hidden"></div>


<script type="module">
        // --- Supabase & Firebase Imports ---
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            sendPasswordResetEmail,
            sendEmailVerification,
            fetchSignInMethodsForEmail,
            signOut,
            GoogleAuthProvider,
            GithubAuthProvider,
            TwitterAuthProvider,
            OAuthProvider,
            signInWithPopup,
            setPersistence,
            browserLocalPersistence,
            getAdditionalUserInfo
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            collection,
            query,
            where,
            getDocs,
            serverTimestamp,
            writeBatch
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        // --- Import Configs ---
        import { firebaseConfig } from "./firebase-config.js"; 
        import { supabaseConfig } from "./supabase-config.js";

        // --- Supabase Client (Reuse global instance if available) ---
        let supabase = window.supabase;
        if (!supabase) {
            supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
            window.supabase = supabase;
        }

        // --- Firebase Initialization ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let hasRedirected = false;

        // Sync Supabase Auth with Firebase Auth (Dual-Auth architecture)
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'SIGNED_IN') {
                console.log("Supabase Auth: Signed in", session.user.email);
                // In a production environment, we'd sync this to Firebase for legacy components
            }
        });

        const checkAuthAndRedirect = async (user) => {
            let sessionUser = user;
            if (!sessionUser && window.supabase) {
                const { data: { session } } = await window.supabase.auth.getSession();
                if (session) sessionUser = session.user;
            }

            if (sessionUser) {
                // 1. Check if they are using the correct provider for this account
                const currentMethod = sessionUser.app_metadata?.provider || (sessionUser.uid ? 'email' : 'email'); 
                // Note: sessionUser.app_metadata is Supabase specific. 
                // For Firebase users, it's more complex, but we mainly care about Supabase here.
                
                const requiredMethod = await checkUserAuthMethod(sessionUser.email, currentMethod);
                if (requiredMethod && requiredMethod !== currentMethod) {
                    console.warn(`Auth Mismatch: User used ${currentMethod} but account requires ${requiredMethod}`);
                    if (auth.currentUser) await signOut(auth);
                    if (window.supabase) await window.supabase.auth.signOut();
                    showMessage(messageDivs.login, `This account was created using <b>${requiredMethod}</b>. Please sign in with that instead.`, 'warning');
                    return;
                }

                // 1.5 NEW: Sync/Create profile
                if (window.supabase) {
                    const { data: profile } = await window.supabase
                        .from('profiles')
                        .select('*')
                        .eq('id', (sessionUser.uid || sessionUser.id))
                        .maybeSingle();
                    
                    const meta = sessionUser.user_metadata || sessionUser.raw_user_meta_data || {};
                    const googlePfp = meta.picture || meta.avatar_url;
                    const discordPfp = meta.avatar_url;
                    const oauthPfp = googlePfp || discordPfp;
                    const oauthName = meta.full_name || meta.name;

                    if (!profile) {
                        console.log("Auth: Profile missing, auto-creating...");
                        const emailUsername = sessionUser.email.split('@')[0].toLowerCase().replace(/[^a-z0-9]/g, '');
                        const finalUsername = emailUsername || `user${Math.floor(Math.random() * 10000)}`;
                        
                        // Create via helper which handles both DBs
                        await createUserDocument(sessionUser, currentMethod, finalUsername);
                        
                        // Add metadata if available
                        if (oauthPfp || oauthName) {
                            await window.supabase.from('profiles').update({
                                avatar_url: oauthPfp,
                                display_name: oauthName
                            }).eq('id', (sessionUser.uid || sessionUser.id));
                        }
                    } else if (oauthPfp && !profile.avatar_url) {
                        // Sync PFP if missing in profile but present in metadata
                        console.log("Auth: Syncing OAuth PFP to profile...");
                        await window.supabase.from('profiles').update({
                            avatar_url: oauthPfp
                        }).eq('id', (sessionUser.uid || sessionUser.id));
                    }
                }

                // 2. Check for email ban immediately
                const email = sessionUser.email;
                if (await checkEmailBan(email)) {
                    if (auth.currentUser) await signOut(auth);
                    if (window.supabase) await window.supabase.auth.signOut();
                    showMessage(messageDivs.login, 'This email address is not permitted to access this network.', 'error');
                    return;
                }

                // User is signed in.
                const path = window.location.pathname;
                const isAtAuthPage = path.endsWith('authentication.html') || 
                                    path.endsWith('/authentication') ||
                                    path === '/' || 
                                    path.endsWith('index.html');

                if (!hasRedirected && isAtAuthPage) {
                    // Check if they are verified OR if they are a social login user
                    // For Supabase users, we assume they are verified if they could sign in via OAuth
                    const isSupabase = !sessionUser.uid; 
                    const isProviderLogin = isSupabase || (sessionUser.providerData && sessionUser.providerData.some(p => 
                        ['google.com', 'github.com', 'twitter.com', 'microsoft.com', 'apple.com'].includes(p.providerId)
                    ));
                    
                    const isVerified = sessionUser.emailVerified || isProviderLogin;

                    if (isVerified) { 
                        hasRedirected = true;
                        navigateToDashboard();
                    } else {
                        console.log("User has session but is unverified. Blocking auto-redirect.");
                    }
                }
            } else {
                // User is signed out.
                hasRedirected = false;
            }
        };

        onAuthStateChanged(auth, async (user) => {
            await checkAuthAndRedirect(user);
        });

        // Supabase Listener
        if (window.supabase) {
            window.supabase.auth.onAuthStateChange(async (event, session) => {
                if (event === 'SIGNED_IN') {
                    console.log("Supabase Auth: Signed in", session.user.email);
                    await checkAuthAndRedirect(session.user);
                }
            });
            
            // Initial check
            window.supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) checkAuthAndRedirect(session.user);
            });
        }



        // --- Unified Data Model ---
        // All user profile data will be stored in a top-level 'users' collection.
        const getUserDocRef = (userId) => doc(db, 'users', userId);
        let selectedUsername = null; // Store username between signup steps

        // --- DOM Elements ---
        const containers = {
            login: document.getElementById('loginContainer'),
            reset: document.getElementById('resetPasswordContainer'),
            username: document.getElementById('usernameContainer'),
            signup: document.getElementById('signupContainer')
        };
        const messageDivs = {
            login: document.getElementById('loginMessage'),
            reset: document.getElementById('resetMessage'),
            username: document.getElementById('usernameMessage'),
            signup: document.getElementById('signupMessage')
        };

        // --- View Management ---
        const showView = (viewName) => {
            Object.values(messageDivs).forEach(div => div.innerHTML = '');
            
            // Hide all first
            for(const key in containers) {
                containers[key].style.display = 'none';
                containers[key].classList.remove('animate-slide-up');
            }

            const newContainer = containers[viewName];
            newContainer.style.display = 'block';
            newContainer.classList.add('animate-slide-up');
        };

        // --- Helper Functions ---
        const showMessage = (element, text, type = 'error') => {
            element.innerHTML = text;
            element.className = `message-area mt-4 text-center text-sm ${type}-message`;
        };
        
        const navigateToDashboard = () => window.location.href = '/logged-in/dashboard.html';

        const createUserDocument = async (user, authMethod, username) => {
            const isVerified = authMethod !== 'email' || !!user.emailVerified;
            try {
                const batch = writeBatch(db);
                
                // 1. Create User Document
                const userRef = getUserDocRef((user.uid || user.id));
                batch.set(userRef, {
                    email: user.email, 
                    authMethod: authMethod, 
                    createdAt: serverTimestamp(),
                    username: username, 
                    emailVerified: isVerified
                });

                // 2. Reserve Username
                const usernameRef = doc(db, "usernames", username.toLowerCase());
                batch.set(usernameRef, { uid: (user.uid || user.id) });

                // 3. Store auth method in Supabase profile as well
                if (window.supabase) {
                    await window.supabase.from('profiles').upsert({
                        id: (user.uid || user.id),
                        email: user.email,
                        username: username,
                        auth_method: authMethod
                    });
                }

                await batch.commit();
                return true;
            } catch (error) { 
                console.error("Error creating user document:", error); 
                return false; 
            }
        };

        /**
         * Checks if the user is trying to log in with the same method they used to sign up.
         */
        const checkUserAuthMethod = async (email, currentMethod) => {
            // Check Supabase first
            if (window.supabase) {
                const { data, error } = await window.supabase
                    .from('profiles')
                    .select('auth_method')
                    .eq('email', email.toLowerCase())
                    .maybeSingle();
                
                if (data && data.auth_method && data.auth_method !== currentMethod) {
                    return data.auth_method;
                }
            }
            return null;
        };

        const handleSuccessfulLogin = async (user) => {
            await setPersistence(auth, browserLocalPersistence);
            
            const isProviderLogin = user.providerData.some(p => ['google.com', 'github.com', 'twitter.com', 'discord.com'].includes(p.providerId));
            
            if (user.emailVerified || isProviderLogin) {                                                                                                                   
                navigateToDashboard();
            } else {
                showMessage(messageDivs.login, 'Your email is not verified. Please check your inbox. <a href="#" id="resend-link" class="underline cursor-pointer">Resend email</a>', 'error');
                document.getElementById('resend-link').addEventListener('click', async (e) => {
                    e.preventDefault();
                    try {
                        await sendEmailVerification(user);
                        showMessage(messageDivs.login, 'A new verification link has been sent!', 'success');
                    } catch (err) { showMessage(messageDivs.login, `Error sending email: ${err.message}`); }
                });
                await signOut(auth);
            }
        };

        const checkProfanity = async (text) => {
            try {
                const response = await fetch(`https://www.purgomalum.com/service/containsprofanity?text=${encodeURIComponent(text)}`);
                const result = await response.text();
                return result.toLowerCase() === 'true';
            } catch (error) { console.error('Profanity API error:', error); return false; }
        };

        const isUsernameTaken = async (username) => {
            const docRef = doc(db, 'usernames', username.toLowerCase());
            const docSnap = await getDoc(docRef);
            return docSnap.exists();
        };

        const checkEmailBan = async (email) => {
            const docRef = doc(db, 'email_bans', email.toLowerCase());
            const docSnap = await getDoc(docRef);
            return docSnap.exists();
        };

        const validateEmail = (email) => {
            // Robust regex check for basic email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) return 'Email is required.';
            if (!emailRegex.test(email)) return 'The email address format is invalid.';
            return null;
        };
        
        const validatePassword = (password) => {
            if (password.length < 8) return 'Password must be at least 8 characters.';
            if (!/[0-9]/.test(password)) return 'Password must contain at least one number.';
            if (!/[A-Z]/.test(password)) return 'Password must contain at least one uppercase letter.';
            if (!/[a-z]/.test(password)) return 'Password must contain at least one lowercase letter.';

            return null;
        };

        // --- Event Listener Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            // Apply theme-based layout
            const savedTheme = JSON.parse(localStorage.getItem('user-navbar-theme')) || { name: 'Dark' };
            const isV1OrV2 = savedTheme.name === 'V1 Original' || savedTheme.name === 'V2 Original';
            const isLightTheme = ['Light', 'Potato', 'Mint', 'Lavender', 'Rose Gold', 'V3 Original', 'V4 Original', 'Birthday'].includes(savedTheme.name);

            if (isV1OrV2) {
                document.body.classList.add('v1-mode');
            }
            if (isLightTheme) {
                document.documentElement.classList.add('light');
                document.documentElement.classList.remove('dark');
            }

            // Sync theme toggle icons/text
            const updateThemeUI = () => {
                const isLight = document.documentElement.classList.contains('light');
                const v1ThemeToggle = document.getElementById('v1-theme-toggle');
                if (v1ThemeToggle) v1ThemeToggle.textContent = isLight ? '☀️' : '🌙';
            };
            updateThemeUI();

            // Initial view
            showView('login');

            // --- V1 Event Handlers ---
            const v1ToggleBtn = document.getElementById('v1-toggle-auth-mode');
            const v1LoginForm = document.getElementById('v1-login-form');
            const v1Title = document.getElementById('v1-title');
            const v1SubmitBtn = document.getElementById('v1-submit-btn');
            const v1UsernameGroup = document.getElementById('v1-username-group');

            v1ToggleBtn?.addEventListener('click', (e) => {
                e.preventDefault();
                const isSignup = v1ToggleBtn.textContent === 'Sign Up';
                v1ToggleBtn.textContent = isSignup ? 'Log In' : 'Sign Up';
                v1Title.textContent = isSignup ? 'Sign Up' : 'Login';
                v1SubmitBtn.textContent = isSignup ? 'Create Account' : 'Log In';
                v1UsernameGroup.style.display = isSignup ? 'block' : 'none';
            });

            document.getElementById('v1-theme-toggle')?.addEventListener('click', () => {
                document.documentElement.classList.toggle('light');
                updateThemeUI();
            });

            v1LoginForm?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('v1-email').value.trim();
                const password = document.getElementById('v1-password').value;
                const username = document.getElementById('v1-username').value.trim();
                const isSignup = v1ToggleBtn.textContent === 'Log In'; // If button says Log In, we are in Sign Up mode

                const messageEl = document.getElementById('v1-message');
                messageEl.textContent = 'Processing...';

                try {
                    if (isSignup) {
                         const { data, error } = await supabase.auth.signUp({
                            email, password, options: { data: { username, display_name: username } }
                        });
                        if (error) throw error;
                        messageEl.textContent = 'Success! Check your email.';
                    } else {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                        if (data.user) await handleSuccessfulLogin(data.user);
                    }
                } catch (err) {
                    messageEl.textContent = err.message;
                }
            });

            document.querySelectorAll('.v1-social-auth-btn').forEach(btn => {
                btn.addEventListener('click', () => handleSocialAuth(btn.dataset.provider));
            });

            // --- Modern View Navigation ---
            document.getElementById('showSignupLink').addEventListener('click', (e) => { e.preventDefault(); showView('username'); });
            document.getElementById('showLoginLink').addEventListener('click', (e) => { e.preventDefault(); showView('login'); });
            document.getElementById('forgotPasswordLink').addEventListener('click', () => showView('reset'));
            document.getElementById('backToLoginLink').addEventListener('click', () => showView('login'));
            document.getElementById('backToUsernameLink').addEventListener('click', () => showView('username'));

            // --- Form Handlers ---

            // Login Form
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;
                if (!email || !password) { showMessage(messageDivs.login, 'Please enter both email and password.'); return; }

                try {
                    // Pre-check auth method
                    const requiredMethod = await checkUserAuthMethod(email, 'email');
                    if (requiredMethod && requiredMethod !== 'email') {
                        showMessage(messageDivs.login, `This account uses <b>${requiredMethod}</b>. Please sign in with that instead.`, 'warning');
                        return;
                    }

                    const { data, error } = await supabase.auth.signInWithPassword({
                        email: email,
                        password: password,
                    });
                    
                    if (error) throw error;
                    
                    if (data.user) {
                        await handleSuccessfulLogin(data.user);
                    }
                } catch (error) {
                    let msg = 'Invalid email or password.';
                    if (error.message.includes('too many requests')) msg = 'Access temporarily disabled due to too many failed login attempts.';
                    else if (error.message.includes('Invalid login credentials')) msg = 'Invalid email or password.';
                    showMessage(messageDivs.login, msg);
                    console.error("Supabase Auth Error:", error.message);
                }
            });

            // Password Reset Form
            document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('resetEmail').value.trim();
                if (!email) { showMessage(messageDivs.reset, 'Please enter your email.'); return; }

                try {
                    const { error } = await supabase.auth.resetPasswordForEmail(email, {
                      redirectTo: window.location.origin + '/authentication.html?view=reset',
                    });
                    if (error) throw error;
                    showMessage(messageDivs.reset, 'Password reset link sent! Check your inbox.', 'success');
                } catch (error) {
                    showMessage(messageDivs.reset, 'An error occurred. Please check the email and try again.');
                    console.error("Supabase Reset Error:", error.message);
                }
            });

            // Signup Step 1: Username Form
            document.getElementById('usernameForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('signupUsername').value.trim();
                if (username.length < 6 || username.length > 24) { showMessage(messageDivs.username, 'Username must be 6-24 characters.'); return; }
                if (!/^[a-zA-Z0-9.,\-+_\!\?\$\\]+$/.test(username)) { showMessage(messageDivs.username, 'Username contains invalid characters.'); return; }

                showMessage(messageDivs.username, 'Checking username...', 'warning');
                if (await checkProfanity(username)) { showMessage(messageDivs.username, 'This username is not allowed. Please choose another.'); return; }
                if (await isUsernameTaken(username)) { showMessage(messageDivs.username, 'This username is already taken.'); return; }

                selectedUsername = username;
                showView('signup');
                document.getElementById('signupEmail').focus();
            });

            // Signup Step 2: Credentials Form
            document.getElementById('signupForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('signupEmail').value.trim();
                const password = document.getElementById('signupPassword').value;

                const emailError = validateEmail(email);
                if (emailError) { showMessage(messageDivs.signup, emailError); return; }
                
                if (await checkEmailBan(email)) {
                    showMessage(messageDivs.signup, 'This email address is not permitted to create an account.');
                    return;
                }
                
                const passwordError = validatePassword(password);
                if (passwordError) { showMessage(messageDivs.signup, passwordError); return; }

                try {
                    const { data, error } = await supabase.auth.signUp({
                        email: email,
                        password: password,
                        options: {
                            data: {
                                username: selectedUsername,
                                display_name: selectedUsername
                            }
                        }
                    });

                    if (error) throw error;
                    
                    // Note: Supabase handles email verification sending automatically if configured
                    if (data.user) {
                        showMessage(messageDivs.signup, `Success! A verification email has been sent to ${email}. You can now log in.`, 'success');
                        
                        // Create user in Firebase as fallback/legacy if needed, or ignore
                        // For fully Supabase setup, the trigger handles profile creation
                    }
                } catch (error) {
                    let msg = 'An unknown error occurred.';
                    if (error.message.includes('already registered')) {
                        msg = 'This email is already in use. If you used a social provider, please sign in with that instead.';
                    } else if (error.message.includes('weak_password')) {
                        msg = 'Password is too weak. Please ensure it meets all complexity requirements.';
                    }
                    showMessage(messageDivs.signup, msg);
                    console.error("Supabase Auth Error:", error.message);
                }
            });

            // --- Social Authentication Handler ---
            const handleSocialAuth = async (providerName) => {
                try {
                    const origin = window.location.origin;
                    console.log("Auth: Initiating Supabase OAuth from origin:", origin);
                    
                    // Determine redirect URL accurately
                    let redirectUrl = origin + '/logged-in/dashboard.html';
                    
                    // Fix for potentially incorrect origins (e.g. running behind a proxy)
                    if (origin.includes('localhost') && origin !== 'http://localhost:3000') {
                        console.warn("Auth: Localhost mismatch detected. Ensure Supabase whitelist includes current origin.");
                    }

                    // Sign in with Supabase OAuth
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: providerName,
                        options: {
                            redirectTo: redirectUrl,
                            skipBrowserRedirect: false // Allow automatic redirect
                        }
                    });

                    if (error) throw error;

                    if (data.url) {
                        window.location.href = data.url;
                    }
                } catch (error) {
                    console.error("Supabase Auth Error:", error.message);
                    const visibleMessageDiv = messageDivs.login.offsetParent ? messageDivs.login : messageDivs.username;
                    showMessage(visibleMessageDiv, `Authentication failed: ${error.message}. Please ensure your domain is whitelisted in Supabase.`);
                }
            };

            document.querySelectorAll('.social-auth-btn').forEach(btn => {
                btn.addEventListener('click', () => handleSocialAuth(btn.dataset.provider));
            });
            
        });
    </script>
</body>
