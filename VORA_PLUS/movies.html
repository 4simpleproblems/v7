<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <!-- VERN_SYSTEM Proxy -->
    <script src="/VORA_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VORA_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VORA_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VORA_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const connection = new BareMux.BareMuxConnection("/VORA_PLUS/VERN_SYSTEM/baremux/worker.js");
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Vora Plus: BareMux Transport Active");

                    const bc = new BroadcastChannel("bare-mux-sync");
                    const port = connection.getInnerPort();
                    
                    const signalReady = () => {
                        const msg = { 
                            type: 'baremuxready', 
                            path: "/VORA_PLUS/VERN_SYSTEM/baremux/worker.js",
                            hasPort: !!port 
                        };
                        
                        bc.postMessage(msg);
                        
                        if (navigator.serviceWorker.controller) {
                            if (port) {
                                navigator.serviceWorker.controller.postMessage(msg, [port]);
                            } else {
                                navigator.serviceWorker.controller.postMessage(msg);
                            }
                        }

                        navigator.serviceWorker.getRegistrations().then(registrations => {
                            registrations.forEach(reg => {
                                const sw = reg.active || reg.waiting || reg.installing;
                                if (sw && sw !== navigator.serviceWorker.controller) {
                                    sw.postMessage(msg); 
                                }
                            });
                        });
                    };
                    
                    signalReady();
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Vora Plus: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vora Plus - Movies</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#0d0d0d',
                        'accent-purple': '#a855f7',
                        'brand-border': '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-page: #050505;
            --bg-card: #0d0d0d;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --border-main: #1a1a1a;
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-glass {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 4rem;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-main);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            padding-left: 4rem;
        }

        /* Player Styles */
        #player-container {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: black;
            display: none;
        }

        #player-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-player {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 2100;
            background: rgba(255,255,255,0.1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .close-player:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="custom-scroll pt-32">
    <!-- Navbar -->
    <nav class="nav-glass" id="navbar">
        <div class="flex items-center gap-8 w-full">
            <div class="flex items-center gap-3">
                <img src="./images/logo.png" class="w-10 h-10 object-contain navbar-logo">
                <span class="text-2xl font-black tracking-tighter text-white">VORA<span class="text-accent-purple ml-1">PLUS</span></span>
            </div>
            <div class="flex items-center gap-6 ml-8">
                <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition">Home</a>
                <a href="movies.html" class="text-sm font-medium text-white hover:text-gray-300 transition">Movies</a>
                <a href="series.html" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition">Series</a>
            </div>
            <div class="ml-auto flex items-center gap-6">
                <div class="relative">
                    <i class="fas fa-search text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Titles, people, genres" 
                           class="bg-black/40 border border-white/20 rounded-full py-1.5 pl-9 pr-4 text-xs focus:outline-none focus:border-white/40 w-64 transition-all">
                </div>
                <i class="fas fa-bell text-white cursor-pointer opacity-80 hover:opacity-100"></i>
                <div class="w-8 h-8 rounded bg-accent-purple flex items-center justify-center font-bold text-xs">A</div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-20 pb-20">
        <div id="movies-section">
            <h2 class="category-title">Movies</h2>
            <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 px-16">
                <!-- Data will be injected here -->
            </div>
        </div>
    </main>

    <!-- Video Player -->
    <div id="player-container">
        <div class="close-player" id="close-player">
            <i class="fas fa-times"></i>
        </div>
        <iframe id="player-frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <!-- Scripts -->
    <script src="./cachedFetch.js"></script>
    <script src="./utils.js"></script>
    <script src="./load/embeds.js"></script>
    <script src="../navigation.js"></script>
    <script src="/injector.js"></script>

    <script>
        // Initial setup for Movies page
        window.VORA_CONFIG = { currentView: 'movies' };

        // Link into embeds.js rendering
        const originalRenderTmdb = window.renderTmdb;
        window.renderTmdb = async function(res, endpoint) {
            const data = await res.clone().json();
            const grid = document.getElementById('videoGrid');
            if (grid && data.results) {
                if (data.page === 1) grid.innerHTML = '';
                data.results.forEach(item => {
                    const card = createMediaCard(item);
                    if (card) grid.appendChild(card);
                });
                return;
            }
            return originalRenderTmdb(res, endpoint);
        };

        window.playVideo = function(videoData) {
            const id = videoData.id;
            const type = videoData.media_type || 'movie';
            window.location.hash = `${type}/${id}`;
        };

        document.getElementById('close-player').onclick = () => {
            window.location.hash = '';
            window.location.reload();
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.loadVoraContent();
        });

        // Handle search
        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                if (!query) return;
                window.themoviedb(`search/movie`, { params: { query: query, page: 1 } });
            }
        };
    </script>
</body>
</html>
