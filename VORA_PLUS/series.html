<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <!-- VERN_SYSTEM Proxy -->
    <script src="/VORA_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VORA_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VORA_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VORA_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;
            const connection = new BareMux.BareMuxConnection("/VORA_PLUS/VERN_SYSTEM/baremux/worker.js");
            const transportPath = "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";
            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) libcurl.load_wasm().catch(() => {});
                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: "wss://wisp.mercurywork.shop/" },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" }
                        ]);
                    }
                    const bc = new BroadcastChannel("bare-mux-sync");
                    const port = connection.getInnerPort();
                    const msg = { type: 'baremuxready', path: "/VORA_PLUS/VERN_SYSTEM/baremux/worker.js", hasPort: !!port };
                    bc.postMessage(msg);
                    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage(msg, port ? [port] : []);
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) { await new Promise(r => setTimeout(r, 200)); }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try { await navigator.serviceWorker.register("/sw.js", { scope: "/" }); } catch (e) {}
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vora Plus - Series</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#0d0d0d',
                        'accent-purple': '#a855f7',
                        'brand-border': '#1a1a1a',
                    },
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-page: #050505;
            --bg-card: #0d0d0d;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --border-main: #1a1a1a;
        }
        body { 
            font-family: 'Manrope', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            overflow-x: hidden;
        }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .nav-glass {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 4rem;
            z-index: 1000;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-main);
        }

        .category-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 2rem; padding-left: 4rem; }

        .media-card {
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }
        .media-card:hover {
            transform: scale(1.08);
            z-index: 50;
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .media-card img { width: 100%; height: 100%; object-fit: cover; }
        .media-info-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .media-card:hover .media-info-overlay { opacity: 1; }

        /* Information Page UI */
        #player-view {
            position: fixed;
            inset: 0;
            background: #050505;
            z-index: 1500;
            overflow-y: auto;
        }
        .info-backdrop {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 70vh;
            background-size: cover;
            background-position: center;
        }
        .info-backdrop::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #050505 0%, rgba(5,5,5,0.7) 50%, rgba(5,5,5,0.3) 100%);
        }
        .info-container {
            position: relative;
            z-index: 10;
            padding: 15vh 4rem 4rem 4rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .player-container-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 3rem;
        }
        .ep-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        .ep-btn:hover { background: rgba(168, 85, 247, 0.2); border-color: #a855f7; }
        .ep-btn.active { background: #a855f7; color: white; border-color: #a855f7; }
    </style>
</head>
<body class="custom-scroll pt-32">
    <!-- Navbar -->
    <nav class="nav-glass" id="navbar">
        <div class="flex items-center gap-8 w-full">
            <div class="flex items-center gap-3">
                <img src="./images/logo.png" class="w-10 h-10 object-contain navbar-logo">
                <span class="text-2xl font-black tracking-tighter text-white">VORA<span class="text-accent-purple ml-1">PLUS</span></span>
            </div>
            <div class="flex items-center gap-6 ml-8">
                <a href="index.html" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition">Home</a>
                <a href="movies.html" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition">Movies</a>
                <a href="series.html" class="text-sm font-medium text-white hover:text-gray-300 transition">Series</a>
            </div>
            <div class="ml-auto flex items-center gap-6">
                <div class="relative">
                    <i class="fas fa-search text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Titles, people, genres" 
                           class="bg-black/40 border border-white/20 rounded-full py-1.5 pl-9 pr-4 text-xs focus:outline-none focus:border-white/40 w-64 transition-all">
                </div>
                <div class="w-8 h-8 rounded bg-accent-purple flex items-center justify-center font-bold text-xs cursor-pointer">4SP</div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="relative z-20 pb-20">
        <div id="series-section">
            <h2 class="category-title">TV Shows</h2>
            <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 px-16">
                <!-- Data will be injected here -->
            </div>
        </div>
        <div id="search-results-section" class="hidden">
            <h2 class="category-title">Search Results</h2>
            <div id="videoGridSearch" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 px-16"></div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="./cachedFetch.js"></script>
    <script src="./utils.js"></script>
    <script src="./load/embeds.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            window.switchView('series', false);
        });
    </script>
</body>
</html>
