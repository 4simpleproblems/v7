    <!-- VERN_SYSTEM Proxy -->
    <script src="/VELIUM_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VELIUM_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VELIUM_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VELIUM_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VELIUM_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const workerPath = "/VELIUM_PLUS/VERN_SYSTEM/baremux/worker.js";
            const connection = new BareMux.BareMuxConnection(workerPath);
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VELIUM_PLUS/VERN_SYSTEM/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Velium Plus: BareMux Transport Active");

                    const bc = new BroadcastChannel("bare-mux-sync");
                    const port = connection.getInnerPort();
                    
                    const signalReady = () => {
                        const msg = { 
                            type: 'baremuxready', 
                            path: workerPath,
                            hasPort: !!port 
                        };
                        
                        bc.postMessage(msg);
                        
                        if (navigator.serviceWorker.controller) {
                            if (port) {
                                navigator.serviceWorker.controller.postMessage(msg, [port]);
                            } else {
                                navigator.serviceWorker.controller.postMessage(msg);
                            }
                        }
                    };
                    
                    signalReady();
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Velium Plus: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/VELIUM_PLUS/VERN_SYSTEM/sw.js", {
                        scope: "/VELIUM_PLUS/VERN_SYSTEM/uv/service/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig as masterConfig } from "../firebase-config.js";

        const app = initializeApp(masterConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);






        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                const isSuperAdmin = user.email === '4simpleproblems@gmail.com';
                
                if (adminDoc.exists() || isSuperAdmin) {
                    const role = isSuperAdmin ? 'admin' : adminDoc.data().type;
                    if (role === 'full' || role === 'sub' || role === 'admin') {
                        document.getElementById('auth-overlay').classList.add('hidden');
                        initApp();
                    } else {
                        window.location.href = '../index.html';
                    }
                } else {
                    window.location.href = '../index.html';
                }
            } else {
                window.location.href = '../index.html';
            }
        });
    </script>
