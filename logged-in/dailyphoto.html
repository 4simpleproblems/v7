<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - DAILYPHOTO</title>
    <meta name="description" content="Share your day with friends through daily photos.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/injector.js"></script>
    <style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-muted); 
            font-weight: 300; 
            overflow: hidden; 
            height: 100vh;
            padding-top: 64px; /* Space for navbar */
        }
        
        h1, h2, h3, .font-bold, .font-semibold, strong, .tracking-widest {
            font-weight: 400 !important; 
            color: var(--text-main);
        }

        /* --- THEME BUTTONS --- */
        .btn-toolbar-style {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 14px; 
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-toolbar-style:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }
        
        .btn-toolbar-style.active, .btn-primary-override {
            background-color: var(--btn-bg) !important;
            border: 1px solid var(--accent-color) !important;
            color: var(--accent-color) !important;
        }

        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem; 
            height: 2.5rem; 
            border-radius: 14px; 
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-icon:hover {
            border-color: var(--text-main);
            color: var(--text-main);
        }
        
        /* --- LAYOUT --- */
        .app-container {
            display: grid;
            grid-template-areas: "sidebar main";
            grid-template-columns: 350px 1fr;
            height: calc(100vh - 64px);
            width: 100%;
            background: var(--bg-page);
        }

        /* --- SIDEBAR --- */
        .sidebar {
            grid-area: sidebar;
            background-color: var(--bg-page);
            border-right: 1px solid var(--border-main);
            display: flex;
            flex-direction: column;
            z-index: 50;
        }

        .sidebar-scroll-content {
            padding: 1.5rem;
            overflow-y: auto;
            flex-grow: 1;
        }
        .sidebar-scroll-content::-webkit-scrollbar { display: none; }

        .sidebar-bottom-controls {
            display: flex;
            width: 100%;
            border-top: 1px solid var(--border-main);
            background-color: var(--bg-card);
        }
        .sidebar-control-btn {
            flex: 1; 
            color: var(--text-muted);
            font-size: 1.25rem;
            padding: 1rem 0;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .sidebar-control-btn:hover { color: var(--text-main); }
        .sidebar-control-btn.active { color: var(--accent-color); }

        /* --- LISTS --- */
        .compact-list-wrapper {
             background-color: var(--bg-card);
             border-radius: 1.25rem; 
             border: 1px solid var(--border-main); 
             margin-top: 0.75rem;
             overflow: hidden;
        }
        .compact-list-items {
            overflow-y: auto;
            max-height: 350px; 
            padding: 0.25rem; 
        }
        
        .compact-list-item {
            border-radius: 14px; 
            margin-bottom: 2px;
            padding: 0.5rem; 
            transition: background-color 0.2s;
        }
        .compact-list-item:hover { background-color: var(--border-faint); }

        /* --- FEED PANEL --- */
        .main-view { 
            grid-area: main;
            height: 100%;
            background-color: var(--bg-page);
            padding: 2rem; 
            overflow-y: auto; 
        }
        .main-view::-webkit-scrollbar { display: none; }
        
        .feed-content-inner {
            max-width: 1000px; 
            margin: 0 auto; 
            padding-bottom: 5rem; 
        }

        /* --- GRID & PHOTOS --- */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); 
            gap: 1.5rem; 
        }
        .photo-thumbnail {
            position: relative;
            overflow: hidden;
            border-radius: 1.25rem; 
            cursor: pointer;
            aspect-ratio: 1 / 1; 
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .photo-thumbnail:hover {
            transform: translateY(-4px);
            border-color: var(--accent-color);
        }
        .photo-thumbnail img {
            width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;
        }
        .photo-thumbnail:hover img { transform: scale(1.05); }
        
        .overlay-grad {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent 50%);
            pointer-events: none; 
        }
        .title-overlay {
            position: absolute; bottom: 0.75rem; left: 0.75rem; right: 0.75rem;
            color: white; font-size: 0.85rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            z-index: 10;
        }
        
        /* --- MODAL STYLES --- */
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            z-index: 8000; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-backdrop.open { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background-color: var(--bg-card); 
            border: 1px solid var(--border-main);
            border-radius: 1.25rem; 
            width: 90%; max-width: 1100px;
            height: 80vh; 
            display: flex; overflow: hidden;
            position: relative;
        }
        
        #photo-display-area {
            flex: 2;
            background-color: #000;
            display: flex; align-items: center; justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .photo-modal-img {
            width: 100%; height: 100%; object-fit: contain; 
        }

        #photo-info-panel {
            flex: 1;
            min-width: 350px;
            max-width: 400px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-main);
            display: flex; flex-direction: column;
            padding: 1.5rem;
        }

        #comments-section {
            flex-grow: 1;
            background-color: rgba(0,0,0,0.2); 
            border-radius: 1.25rem; 
            padding: 1rem;
            margin-bottom: 1rem;
            overflow-y: auto;
            border: 1px solid var(--border-main);
        }
        #comments-section::-webkit-scrollbar { display: none; }

        /* Custom Tooltip */
        #custom-tooltip {
            position: fixed; background-color: #000; border: 1px solid #333; color: #fff;
            padding: 0.4rem 0.8rem; border-radius: 14px; font-size: 0.75rem;
            pointer-events: none; z-index: 10000; opacity: 0; transition: opacity 0.15s ease;
            white-space: nowrap; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="custom-tooltip"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-scroll-content">
                
                <div class="mb-6 pb-4 border-b border-[var(--border-main)]">
                    <h2 class="text-lg mb-2">My Code</h2>
                    <div id="friend-code-display" class="p-3 text-center bg-black/20 border border-[var(--border-main)] rounded-[14px] font-mono text-[var(--accent-color)] tracking-widest select-all cursor-pointer" title="Click to Copy">LOADING</div>
                </div>

                <div class="mb-6 pb-4 border-b border-[var(--border-main)]">
                    <h2 class="text-lg mb-2">Add Friend</h2>
                    <form id="add-friend-form" class="flex gap-2">
                        <input type="text" id="friend-code-input" placeholder="CODE" maxlength="8" class="flex-grow p-3 bg-black/20 border border-[var(--border-main)] rounded-[14px] outline-none focus:border-[var(--accent-color)] text-center font-mono uppercase text-[var(--text-main)]">
                        <button type="submit" class="btn-icon" title="Send Request"><i class="fas fa-plus"></i></button>
                    </form>
                    <div id="add-friend-message" class="text-xs mt-2 min-h-[16px]"></div>
                </div>

                <!-- My Posts Section (With Images) -->
                <div id="daily-posts-section">
                    <h2 class="text-lg mb-2">My Posts</h2>
                    <p class="text-xs opacity-50 mb-3">5 slots / day</p>
                    <div id="daily-posts-container" class="space-y-2">
                        <!-- Post slots will be rendered here -->
                    </div>
                </div>

                <div id="friends-section-wrapper" class="hidden">
                    <h2 class="text-lg mb-2">Friends</h2>
                    <div id="friends-list-wrapper" class="compact-list-wrapper">
                        <div id="friends-list-items" class="compact-list-items"></div>
                    </div>
                </div>

                <div id="blocked-section" class="hidden">
                    <h2 class="text-lg mb-2">Blocked</h2>
                    <div id="blocked-list-wrapper" class="compact-list-wrapper">
                        <div id="blocked-list-items" class="compact-list-items"></div>
                    </div>
                </div>

            </div>

            <div class="sidebar-bottom-controls">
                <button id="sidebar-nav-posts" class="sidebar-control-btn active" title="My Posts"><i class="fas fa-images"></i></button>
                <button id="sidebar-nav-friends" class="sidebar-control-btn" title="Friends"><i class="fas fa-user-friends"></i></button>
                <button id="sidebar-nav-blocked" class="sidebar-control-btn" title="Blocked Users"><i class="fas fa-user-shield"></i></button>
            </div>
        </aside>

        <!-- Main View -->
        <main class="main-view">
            <div class="feed-content-inner">
                <div class="flex justify-between items-center mb-10">
                    <div>
                        <h1 class="text-4xl font-bold mb-2">Dailyphoto</h1>
                        <p id="feed-desc" class="opacity-60">Moments from people you follow.</p>
                    </div>
                    
                    <div class="flex gap-3">
                        <div class="inline-flex bg-[var(--bg-card)] border border-[var(--border-main)] rounded-2xl p-1">
                            <button id="feed-toggle-friends" class="px-4 py-2 rounded-xl text-sm transition-all active btn-primary-override">Friends</button>
                            <button id="feed-toggle-public" class="px-4 py-2 rounded-xl text-sm transition-all">Public</button>
                        </div>
                    </div>
                </div>
                
                <div id="photo-feed" class="photo-grid"></div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="photo-modal" class="modal-backdrop">
        <div id="modal-content-container" class="modal-content"></div>
    </div>

    <div id="upload-menu-modal" class="modal-backdrop">
        <div class="bg-[var(--bg-card)] border border-[var(--border-main)] rounded-[1.25rem] w-full max-w-sm p-8">
            <h3 class="text-2xl font-bold mb-6">Post Photo</h3>
            <input type="file" id="upload-file-input" class="hidden" accept="image/*">
            <label for="upload-file-input" class="bg-black/40 border-2 border-dashed border-[var(--border-main)] rounded-[22px] p-12 text-center cursor-pointer hover:border-[var(--accent-color)] transition-all block mb-6">
                <i class="fas fa-cloud-upload-alt text-5xl mb-4 opacity-20"></i>
                <span class="block font-medium opacity-60">Select Image</span>
            </label>
            <button id="upload-menu-close-btn" class="btn-toolbar-style w-full py-3">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, getDoc, setDoc, collection, query, where, getDocs, updateDoc, increment, arrayUnion, arrayRemove, writeBatch, limit, addDoc, deleteDoc, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from "/firebase-config.js";
        import { getAvatarHTML } from "/utils.js";

        if (!getApps().length) initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        let currentUser = null;
        let currentFriends = [];
        let blockedUsers = [];
        let feedMode = 'friends';
        let unsubPosts = () => {};
        let unsubModal = () => {};

        const DAILY_COLLECTION = collection(db, 'daily_photos');
        const USERS_COLLECTION = 'users';

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                initApp();
            } else {
                await signInAnonymously(auth);
            }
        });

        async function initApp() {
            setupSidebarNav();
            setupFeedToggles();
            listenToUser();
            handleFriendCodeLogic();
        }

        function listenToUser() {
            onSnapshot(doc(db, USERS_COLLECTION, currentUser.uid), async snap => {
                const data = snap.data() || {};
                currentFriends = data.friends || [];
                blockedUsers = data.blocked_users || [];
                renderMyPosts(data.dailySlotsUsed || []);
                setupFeed();
                if (!document.getElementById('friends-section-wrapper').classList.contains('hidden')) renderFriendsList();
                if (!document.getElementById('blocked-section').classList.contains('hidden')) renderBlockedList();
            });
        }

        async function renderMyPosts(usedSlots) {
            const container = document.getElementById('daily-posts-container');
            container.innerHTML = '';

            for (let i = 0; i < 5; i++) {
                const postId = usedSlots[i];
                const div = document.createElement('div');
                div.className = 'bg-[var(--bg-card)] border border-[var(--border-main)] rounded-2xl overflow-hidden flex items-center p-2 gap-3 transition-all hover:border-[var(--accent-color)]';
                
                if (postId && postId !== 'DELETED') {
                    const postSnap = await getDoc(doc(db, 'daily_photos', postId));
                    if (postSnap.exists()) {
                        const postData = postSnap.data();
                        div.innerHTML = `
                            <div class="w-12 h-12 rounded-xl overflow-hidden bg-black shrink-0">
                                <img src="${postData.imageBase64}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-grow min-w-0">
                                <p class="text-xs font-bold truncate">${postData.title}</p>
                                <p class="text-[10px] opacity-50">${new Date(postData.createdAt?.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                            </div>
                            <div class="flex gap-1 pr-1">
                                <button onclick="window.viewPost('${postId}')" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-white/5" title="View"><i class="fas fa-eye text-xs"></i></button>
                                <button onclick="window.deletePost('${postId}', ${i})" class="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-500/10 text-red-500/50 hover:text-red-500" title="Delete"><i class="fas fa-trash text-xs"></i></button>
                            </div>
                        `;
                    } else {
                        div.innerHTML = `<span class="text-xs opacity-30 p-3 italic">Post missing...</span><button onclick="window.fixSlot(${i})" class="text-[10px] bg-red-500/10 text-red-500 px-2 py-1 rounded-lg ml-auto mr-2">Fix</button>`;
                    }
                } else {
                    div.innerHTML = `
                        <div class="w-12 h-12 rounded-xl border border-dashed border-[var(--border-main)] flex items-center justify-center shrink-0 opacity-20"><i class="fas fa-plus text-xs"></i></div>
                        <span class="text-xs opacity-30 italic">Empty Slot ${i+1}</span>
                        <button onclick="window.openUpload(${i})" class="btn-icon w-8 h-8 rounded-lg ml-auto mr-1" title="Post Moment"><i class="fas fa-plus text-xs"></i></button>
                    `;
                }
                container.appendChild(div);
            }
        }

        function setupFeed() {
            unsubPosts();
            const grid = document.getElementById('photo-feed');
            grid.innerHTML = '<div class="col-span-full py-20 text-center"><i class="fas fa-spinner fa-spin opacity-20 text-3xl"></i></div>';

            const today = new Date(); today.setHours(0,0,0,0);
            let q;

            if (feedMode === 'public') {
                q = query(DAILY_COLLECTION, where('status', '==', 'active'), where('isPublic', '==', true), where('createdAt', '>=', today), orderBy('createdAt', 'desc'), limit(50));
            } else {
                const uids = [currentUser.uid, ...currentFriends].filter(id => !blockedUsers.includes(id)).slice(0, 10);
                if (uids.length === 0) { grid.innerHTML = '<p class="text-center col-span-full opacity-40 py-20">Follow friends to see their moments.</p>'; return; }
                q = query(DAILY_COLLECTION, where('status', '==', 'active'), where('creatorUid', 'in', uids), where('createdAt', '>=', today), orderBy('createdAt', 'desc'));
            }

            unsubPosts = onSnapshot(q, snap => {
                grid.innerHTML = '';
                if (snap.empty) { grid.innerHTML = '<p class="text-center col-span-full opacity-40 py-20">No moments yet today.</p>'; return; }
                
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (blockedUsers.includes(data.creatorUid)) return;
                    const el = document.createElement('div');
                    el.className = 'photo-thumbnail';
                    el.innerHTML = `
                        <img src="${data.imageBase64}" loading="lazy">
                        <div class="overlay-grad"></div>
                        <div class="absolute top-3 right-3 flex gap-2">
                            <span class="text-white text-[10px] bg-black/40 px-2 py-1 rounded-full backdrop-blur-md border border-white/10"><i class="fas fa-heart text-red-500 mr-1"></i> ${data.hearts?.length || 0}</span>
                            <span class="text-white text-[10px] bg-black/40 px-2 py-1 rounded-full backdrop-blur-md border border-white/10"><i class="fas fa-comment text-indigo-400 mr-1"></i> ${data.comments?.length || 0}</span>
                        </div>
                        <div class="title-overlay">
                            <p class="font-bold text-white">@${data.creatorUsername}</p>
                            <p class="text-[10px] opacity-80 truncate">${data.title}</p>
                        </div>
                    `;
                    el.onclick = () => window.viewPost(docSnap.id);
                    grid.appendChild(el);
                });
            });
        }

        window.viewPost = (postId) => {
            const modal = document.getElementById('photo-modal');
            const container = document.getElementById('modal-content-container');
            modal.classList.add('open');
            container.innerHTML = '<div class="w-full h-full flex items-center justify-center"><i class="fas fa-spinner fa-spin text-2xl"></i></div>';

            unsubModal();
            unsubModal = onSnapshot(doc(db, 'daily_photos', postId), async snap => {
                if (!snap.exists()) { modal.classList.remove('open'); return; }
                const data = snap.data();
                const isHearted = data.hearts?.includes(currentUser.uid);
                const isOwner = data.creatorUid === currentUser.uid;

                const authorSnap = await getDoc(doc(db, USERS_COLLECTION, data.creatorUid));
                const authorData = authorSnap.data() || {};

                container.innerHTML = `
                    <div id="photo-display-area">
                        <img src="${data.imageBase64}" class="photo-modal-img">
                        <button onclick="window.closeModal()" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-black/80 transition-colors"><i class="fas fa-times"></i></button>
                    </div>
                    <div id="photo-info-panel">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-12 h-12 rounded-2xl overflow-hidden bg-black/20">${getAvatarHTML(authorData, "w-12 h-12", false, currentUser)}</div>
                            <div class="min-w-0">
                                <p class="text-sm font-bold text-[var(--text-main)] truncate">@${data.creatorUsername}</p>
                                <p class="text-[10px] opacity-50 font-mono">${new Date(data.createdAt?.toDate()).toLocaleString()}</p>
                            </div>
                        </div>

                        <h3 class="text-lg font-bold mb-4">${data.title}</h3>

                        <div class="flex gap-4 mb-6 pb-6 border-b border-[var(--border-main)]">
                            <button id="modal-heart-btn" class="flex items-center gap-2 text-sm font-bold ${isHearted ? 'text-red-500' : 'opacity-50 hover:opacity-100'} transition-all">
                                <i class="fas fa-heart ${isHearted ? '' : 'far'}"></i> ${data.hearts?.length || 0}
                            </button>
                            <div class="flex items-center gap-2 text-sm font-bold opacity-50">
                                <i class="fas fa-comment"></i> ${data.comments?.length || 0}
                            </div>
                            <div class="ml-auto flex gap-2">
                                ${!isOwner ? `<button onclick="window.reportPost('${postId}')" class="text-xs opacity-30 hover:opacity-100 hover:text-red-500 transition-all" title="Report"><i class="fas fa-flag"></i></button>` : ''}
                                ${!isOwner ? `<button onclick="window.blockUser('${data.creatorUid}', '${data.creatorUsername}')" class="text-xs opacity-30 hover:opacity-100 hover:text-red-500 transition-all" title="Block"><i class="fas fa-ban"></i></button>` : ''}
                                ${isOwner ? `<button onclick="window.deletePost('${postId}')" class="text-xs opacity-30 hover:opacity-100 hover:text-red-500 transition-all" title="Delete"><i class="fas fa-trash"></i></button>` : ''}
                            </div>
                        </div>

                        <div id="comments-section">
                            ${(data.comments || []).map(c => `
                                <div class="mb-3 text-xs">
                                    <span class="font-bold text-[var(--accent-color)] mr-1">@${c.username}</span>
                                    <span class="opacity-80">${c.text}</span>
                                </div>
                            `).join('') || '<p class="text-center opacity-20 py-10 italic">No comments yet.</p>'}
                        </div>

                        <div class="mt-auto pt-4">
                            <div class="flex gap-2">
                                <input type="text" id="comment-input" placeholder="Say something..." class="flex-1 bg-black/20 border border-[var(--border-main)] rounded-xl p-3 text-xs outline-none focus:border-[var(--accent-color)]">
                                <button id="send-comment-btn" class="w-10 h-10 rounded-xl flex items-center justify-center bg-[var(--accent-color)] text-white shadow-lg shadow-indigo-500/20"><i class="fas fa-paper-plane text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                `;

                document.getElementById('modal-heart-btn').onclick = () => updateDoc(doc(db, 'daily_photos', postId), { hearts: isHearted ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid) });
                document.getElementById('send-comment-btn').onclick = async () => {
                    const input = document.getElementById('comment-input');
                    const text = input.value.trim();
                    if (!text) return;
                    const userSnap = await getDoc(doc(db, USERS_COLLECTION, currentUser.uid));
                    await updateDoc(doc(db, 'daily_photos', postId), { comments: arrayUnion({ uid: currentUser.uid, username: userSnap.data().username, text: text, timestamp: new Date() }) });
                    input.value = '';
                };
            });
        };

        window.openUpload = (slotIdx) => {
            const modal = document.getElementById('upload-menu-modal');
            const fileInput = document.getElementById('upload-file-input');
            modal.classList.add('open');
            fileInput.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                modal.classList.remove('open');
                
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    const title = prompt("Give your moment a title:", "Daily Moment");
                    if (title === null) return;
                    const isPublic = confirm("Make this moment public?");
                    
                    const postRef = await addDoc(collection(db, 'daily_photos'), {
                        creatorUid: currentUser.uid,
                        creatorUsername: (await getDoc(doc(db, USERS_COLLECTION, currentUser.uid))).data().username,
                        createdAt: serverTimestamp(),
                        imageBase64: evt.target.result,
                        title: title || "Daily Moment",
                        isPublic: isPublic,
                        status: 'active',
                        hearts: [],
                        comments: []
                    });

                    const userRef = doc(db, USERS_COLLECTION, currentUser.uid);
                    const userSnap = await getDoc(userRef);
                    const slots = userSnap.data().dailySlotsUsed || [];
                    while (slots.length <= slotIdx) slots.push(null);
                    slots[slotIdx] = postRef.id;
                    await updateDoc(userRef, { dailySlotsUsed: slots });
                };
                reader.readAsDataURL(file);
            };
        };

        window.deletePost = async (postId, idx) => {
            if (!confirm("Delete this moment?")) return;
            const userRef = doc(db, USERS_COLLECTION, currentUser.uid);
            const userSnap = await getDoc(userRef);
            const slots = [...(userSnap.data().dailySlotsUsed || [])];
            const slotIdx = idx !== undefined ? idx : slots.indexOf(postId);
            if (slotIdx > -1) slots[slotIdx] = 'DELETED';
            await deleteDoc(doc(db, 'daily_photos', postId));
            await updateDoc(userRef, { dailySlotsUsed: slots });
            if (idx === undefined) window.closeModal();
        };

        window.blockUser = async (uid, username) => {
            if (confirm(`Block @${username}? You won't see their posts anymore.`)) {
                await updateDoc(doc(db, USERS_COLLECTION, currentUser.uid), { 
                    blocked_users: arrayUnion(uid),
                    friends: arrayRemove(uid)
                });
                await updateDoc(doc(db, USERS_COLLECTION, uid), { friends: arrayRemove(currentUser.uid) });
                window.closeModal();
            }
        };

        window.reportPost = async (postId) => {
            if (confirm("Report this post for inappropriate content?")) {
                await addDoc(collection(db, 'reports'), { postId, reportedBy: currentUser.uid, timestamp: serverTimestamp(), type: 'daily_photo' });
                alert("Thank you. Our moderators will review this post.");
            }
        };

        window.closeModal = () => {
            document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('open'));
            unsubModal();
        };

        function setupSidebarNav() {
            const btns = { posts: 'sidebar-nav-posts', friends: 'sidebar-nav-friends', blocked: 'sidebar-nav-blocked' };
            const sections = { posts: 'daily-posts-section', friends: 'friends-section-wrapper', blocked: 'blocked-section' };
            
            Object.keys(btns).forEach(key => {
                document.getElementById(btns[key]).onclick = () => {
                    Object.values(btns).forEach(b => document.getElementById(b).classList.remove('active'));
                    Object.values(sections).forEach(s => document.getElementById(s).classList.add('hidden'));
                    document.getElementById(btns[key]).classList.add('active');
                    document.getElementById(sections[key]).classList.remove('hidden');
                    if (key === 'friends') renderFriendsList();
                    if (key === 'blocked') renderBlockedList();
                };
            });
        }

        function setupFeedToggles() {
            document.getElementById('feed-toggle-friends').onclick = () => {
                feedMode = 'friends';
                document.getElementById('feed-toggle-friends').classList.add('active', 'btn-primary-override');
                document.getElementById('feed-toggle-public').classList.remove('active', 'btn-primary-override');
                document.getElementById('feed-desc').textContent = 'Moments from people you follow.';
                setupFeed();
            };
            document.getElementById('feed-toggle-public').onclick = () => {
                if (!localStorage.getItem('daily_public_warning')) {
                    if (confirm("Notice: The public feed may contain inappropriate content. Report violations immediately. Continue?")) {
                        localStorage.setItem('daily_public_warning', 'true');
                    } else return;
                }
                feedMode = 'public';
                document.getElementById('feed-toggle-public').classList.add('active', 'btn-primary-override');
                document.getElementById('feed-toggle-friends').classList.remove('active', 'btn-primary-override');
                document.getElementById('feed-desc').textContent = 'Discover shared moments from across the network.';
                setupFeed();
            };
        }

        async function handleFriendCodeLogic() {
            const codeQ = query(collection(db, 'friend_codes'), where('userId', '==', currentUser.uid), limit(1));
            const codeSnap = await getDocs(codeQ);
            let code = codeSnap.empty ? null : codeSnap.docs[0].id;
            if (!code) {
                code = Math.random().toString(36).substring(2, 10).toUpperCase();
                await setDoc(doc(db, 'friend_codes', code), { userId: currentUser.uid, createdAt: serverTimestamp() });
            }
            document.getElementById('friend-code-display').textContent = code;
            document.getElementById('friend-code-display').onclick = () => {
                navigator.clipboard.writeText(code);
                alert("Code copied to clipboard!");
            };
        }

        document.getElementById('add-friend-form').onsubmit = async (e) => {
            e.preventDefault();
            const code = document.getElementById('friend-code-input').value.trim().toUpperCase();
            const msg = document.getElementById('add-friend-message');
            if (!code) return;
            
            const codeDoc = await getDoc(doc(db, 'friend_codes', code));
            if (!codeDoc.exists()) { msg.textContent = "Invalid code."; return; }
            const targetUid = codeDoc.data().userId;
            if (targetUid === currentUser.uid) { msg.textContent = "You can't add yourself."; return; }
            
            await updateDoc(doc(db, USERS_COLLECTION, targetUid), { pending_requests: arrayUnion(currentUser.uid) });
            msg.textContent = "Request sent!";
            document.getElementById('friend-code-input').value = '';
        };

        async function renderFriendsList() {
            const list = document.getElementById('friends-list-items');
            list.innerHTML = '<div class="p-4 text-center opacity-20"><i class="fas fa-spinner fa-spin"></i></div>';
            
            const userSnap = await getDoc(doc(db, USERS_COLLECTION, currentUser.uid));
            const pending = userSnap.data().pending_requests || [];
            
            list.innerHTML = '';
            
            if (pending.length > 0) {
                const header = document.createElement('div');
                header.className = 'p-2 text-[10px] font-bold opacity-40 uppercase tracking-widest border-b border-[var(--border-main)] mb-2';
                header.textContent = 'Requests';
                list.appendChild(header);
                for (const uid of pending) {
                    const snap = await getDoc(doc(db, USERS_COLLECTION, uid));
                    const div = document.createElement('div');
                    div.className = 'compact-list-item flex justify-between items-center bg-[var(--accent-color)]/5 border border-[var(--accent-color)]/20 mb-1';
                    div.innerHTML = `<span class="text-xs font-bold">@${snap.data().username}</span><div class="flex gap-1"><button onclick="window.handleRequest('${uid}', 'accept')" class="w-6 h-6 rounded-lg bg-green-500/20 text-green-500 flex items-center justify-center"><i class="fas fa-check text-[10px]"></i></button><button onclick="window.handleRequest('${uid}', 'deny')" class="w-6 h-6 rounded-lg bg-red-500/20 text-red-500 flex items-center justify-center"><i class="fas fa-times text-[10px]"></i></button></div>`;
                    list.appendChild(div);
                }
            }

            if (currentFriends.length > 0) {
                const header = document.createElement('div');
                header.className = 'p-2 text-[10px] font-bold opacity-40 uppercase tracking-widest border-b border-[var(--border-main)] my-2';
                header.textContent = 'Friends';
                list.appendChild(header);
                for (const uid of currentFriends) {
                    const snap = await getDoc(doc(db, USERS_COLLECTION, uid));
                    const div = document.createElement('div');
                    div.className = 'compact-list-item flex justify-between items-center';
                    div.innerHTML = `<span class="text-xs">@${snap.data().username}</span><button onclick="window.removeFriend('${uid}')" class="text-red-500/30 hover:text-red-500 transition-all"><i class="fas fa-minus-circle text-xs"></i></button>`;
                    list.appendChild(div);
                }
            }
            if (pending.length === 0 && currentFriends.length === 0) list.innerHTML = '<p class="text-xs opacity-20 p-4 italic">No friends yet.</p>';
        }

        async function renderBlockedList() {
            const list = document.getElementById('blocked-list-items');
            list.innerHTML = '';
            if (blockedUsers.length === 0) { list.innerHTML = '<p class="text-xs opacity-20 p-4 italic">No users blocked.</p>'; return; }
            for (const uid of blockedUsers) {
                const snap = await getDoc(doc(db, USERS_COLLECTION, uid));
                const div = document.createElement('div');
                div.className = 'compact-list-item flex justify-between items-center';
                div.innerHTML = `<span class="text-xs opacity-50">@${snap.data()?.username || 'Unknown'}</span><button onclick="window.unblock('${uid}')" class="text-[var(--accent-color)] text-[10px] border border-[var(--accent-color)]/20 px-2 py-1 rounded-lg hover:bg-[var(--accent-color)]/10">Unblock</button>`;
                list.appendChild(div);
            }
        }

        window.handleRequest = async (uid, action) => {
            const batch = writeBatch(db);
            batch.update(doc(db, USERS_COLLECTION, currentUser.uid), { pending_requests: arrayRemove(uid) });
            if (action === 'accept') {
                batch.update(doc(db, USERS_COLLECTION, currentUser.uid), { friends: arrayUnion(uid) });
                batch.update(doc(db, USERS_COLLECTION, uid), { friends: arrayUnion(currentUser.uid) });
            }
            await batch.commit();
        };

        window.removeFriend = async (uid) => {
            if (confirm("Unfriend this user?")) {
                const batch = writeBatch(db);
                batch.update(doc(db, USERS_COLLECTION, currentUser.uid), { friends: arrayRemove(uid) });
                batch.update(doc(db, USERS_COLLECTION, uid), { friends: arrayRemove(currentUser.uid) });
                await batch.commit();
            }
        };

        window.unblock = async (uid) => {
            await updateDoc(doc(db, USERS_COLLECTION, currentUser.uid), { blocked_users: arrayRemove(uid) });
        };

        window.fixSlot = async (idx) => {
            const userRef = doc(db, USERS_COLLECTION, currentUser.uid);
            const slots = (await getDoc(userRef)).data().dailySlotsUsed || [];
            slots[idx] = null;
            await updateDoc(userRef, { dailySlotsUsed: slots });
        };

        document.getElementById('upload-menu-close-btn').onclick = () => window.closeModal();
    </script>
</body>
</html>
