<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - Dailyphoto</title>
    <link rel="icon" href="/favicon.ico">
    <meta name="description" content="Share your daily moments on 4SP.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="../navigation.js" defer></script>
    <script src="../injector.js" defer></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#0d0d0d',
                        'accent-indigo': '#4f46e5',
                        'brand-border': '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: #000000; 
            color: #c0c0c0;
            font-weight: 300; 
            overflow: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 200 !important;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* --- Global Scrollbar --- */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .app-container {
            display: grid;
            grid-template-areas: "sidebar main";
            grid-template-columns: 280px 1fr;
            height: 100vh;
            width: 100%;
            background: #000000;
        }

        .sidebar {
            grid-area: sidebar;
            background: #000000;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 32px 0;
            overflow-y: auto;
        }

        .main-view {
            grid-area: main;
            background: #000000;
            overflow-y: auto;
            position: relative;
            padding: 32px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            color: #666;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 20px;
            margin: 0 16px;
            font-weight: 300;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-item.active {
            color: #4f46e5;
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(79, 70, 229, 0.15);
        }

        .photo-card {
            background: #050505;
            border: 1px solid #111;
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1/1;
        }

        .photo-card:hover {
            border-color: #4f46e5;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px rgba(79, 70, 229, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .overlay-grad {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
            display: flex; flex-direction: column; justify-content: flex-end;
            padding: 1.25rem; opacity: 0; transition: opacity 0.3s;
        }
        .photo-card:hover .overlay-grad { opacity: 1; }

        .search-box {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 12px; /* Reduced rounding */
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: #4f46e5;
            background: #111;
        }

        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            border-radius: 32px;
            width: 90%;
            max-width: 900px;
            height: 80vh;
            display: flex;
            overflow: hidden;
        }

        .slot-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 20px; border-radius: 16px;
            background: rgba(255,255,255,0.02); border: 1px solid transparent;
            margin: 0 16px 8px 16px; transition: all 0.2s;
        }
        .slot-item:hover { background: rgba(255,255,255,0.04); border-color: #333; }

        .btn-circle {
            width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
            color: #666; transition: all 0.2s;
        }
        .btn-circle:hover { background: #4f46e5; color: white; transform: scale(1.1); }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="px-8 mb-10">
                <div class="flex items-center gap-3">
                    <img src="../images/logo.png" class="w-8 h-8 object-contain">
                    <span class="text-xl font-bold tracking-tighter text-white">DAILYPHOTO</span>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto custom-scroll">
                <div class="nav-item active" data-mode="following">
                    <i class="fas fa-user-friends"></i>
                    <span>Following</span>
                </div>
                <div class="nav-item" data-mode="global">
                    <i class="fas fa-globe"></i>
                    <span>Global Pulse</span>
                </div>

                <div class="h-px bg-brand-border my-6 mx-8"></div>

                <div class="px-8 mb-4">
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Discover</span>
                </div>
                <div class="px-4 mb-6">
                    <div class="search-box">
                        <i class="fas fa-search text-gray-600 text-xs"></i>
                        <input type="text" id="user-search" placeholder="Search usernames..." class="bg-transparent border-none outline-none flex-1 text-xs text-white">
                    </div>
                    <div id="search-results" class="mt-4 space-y-1"></div>
                </div>

                <div class="h-px bg-brand-border my-6 mx-8"></div>

                <div class="px-8 mb-4">
                    <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Your Moments</span>
                </div>
                <div id="slots-container">
                    <!-- Slots -->
                </div>
            </nav>
        </aside>

        <!-- Main View -->
        <main class="main-view custom-scroll">
            <div class="max-w-6xl mx-auto">
                <header class="mb-10 flex justify-between items-end">
                    <div>
                        <h1 id="feed-title" class="text-4xl font-bold mb-2">Following</h1>
                        <p id="feed-desc" class="text-gray-500">Moments from people you follow.</p>
                    </div>
                </header>

                <div id="photo-feed" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
                    <!-- Feed items -->
                </div>
            </div>
        </main>
    </div>

    <!-- Upload Modal -->
    <div id="upload-modal" class="modal-overlay">
        <div class="modal-content max-w-md flex-col p-8 h-auto">
            <h2 class="text-2xl font-bold mb-6">Share a Moment</h2>
            <div id="upload-preview" class="aspect-square rounded-3xl bg-black border border-white/5 mb-6 overflow-hidden flex items-center justify-center cursor-pointer hover:border-indigo-500 transition-colors">
                <i class="fas fa-cloud-upload-alt text-4xl text-gray-800"></i>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*">
            
            <div class="space-y-4 mb-8">
                <div>
                    <label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2 block">Caption</label>
                    <input type="text" id="post-title" class="w-full bg-black border border-brand-border rounded-xl p-3 outline-none focus:border-indigo-500 text-white text-sm" placeholder="Give it a title...">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-xs text-gray-500">Public Visibility</span>
                    <input type="checkbox" id="post-public" class="w-5 h-5 accent-indigo-500">
                </div>
            </div>

            <div class="flex gap-3">
                <button onclick="closeModal('upload-modal')" class="flex-1 py-3 rounded-xl font-bold text-gray-500 hover:text-white transition-colors">Cancel</button>
                <button id="confirm-upload-btn" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-900/20 hover:bg-indigo-700 transition-all">Post Moment</button>
            </div>
        </div>
    </div>

    <!-- View Modal -->
    <div id="view-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex-1 bg-black flex items-center justify-center relative overflow-hidden">
                <img id="modal-img" class="w-full h-full object-contain">
                <button onclick="closeModal('view-modal')" class="absolute top-6 left-6 w-10 h-10 rounded-full bg-black/50 backdrop-blur-md border border-white/10 flex items-center justify-center text-white hover:bg-black/80 transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="w-80 border-l border-white/5 flex flex-col p-8">
                <div class="flex items-center gap-4 mb-8">
                    <div id="modal-author-avatar" class="w-12 h-12 rounded-2xl overflow-hidden bg-gray-900"></div>
                    <div class="min-w-0">
                        <p id="modal-author-name" class="text-sm font-bold text-white truncate"></p>
                        <p id="modal-post-date" class="text-[10px] text-gray-500 font-mono"></p>
                    </div>
                </div>
                
                <h3 id="modal-post-title" class="text-lg font-medium text-white mb-6"></h3>

                <div id="modal-comments" class="flex-1 overflow-y-auto custom-scroll space-y-4 mb-6">
                    <!-- Comments -->
                </div>

                <div class="mt-auto">
                    <div class="flex gap-2">
                        <input type="text" id="comment-input" placeholder="Add a comment..." class="flex-1 bg-black border border-white/5 rounded-xl p-3 text-xs outline-none focus:border-indigo-500 text-white">
                        <button id="send-comment-btn" class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white hover:bg-indigo-700 transition-colors">
                            <i class="fas fa-paper-plane text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from "/firebase-config.js";
        import { getAvatarHTML } from "/utils.js";

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let activeSlot = 0;
        let pendingImgData = null;
        let feedMode = 'following';

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                initUI();
            } else {
                window.location.href = '/authentication.html';
            }
        });

        function initUI() {
            loadSlots();
            setupSearch();
            setupFeed();
            setupNav();
        }

        function loadSlots() {
            const container = document.getElementById('slots-container');
            db.collection('users').doc(currentUser.uid).onSnapshot(snap => {
                const data = snap.data() || {};
                const slots = data.dailySlotsUsed || [];
                container.innerHTML = '';

                for (let i = 0; i < 5; i++) {
                    const postId = slots[i];
                    const div = document.createElement('div');
                    div.className = 'slot-item';

                    if (postId && postId !== 'DELETED') {
                        div.innerHTML = `
                            <span class="text-xs text-gray-500 truncate max-w-[140px]">Active Moment</span>
                            <div class="flex gap-1">
                                <button onclick="viewPost('${postId}')" class="btn-circle" title="View"><i class="fas fa-eye text-[10px]"></i></button>
                                <button onclick="deletePost('${postId}', ${i})" class="btn-circle text-red-500/50 hover:text-red-500" title="Delete"><i class="fas fa-trash text-[10px]"></i></button>
                            </div>
                        `;
                    } else {
                        div.innerHTML = `
                            <span class="text-xs text-gray-700 italic">Empty Slot</span>
                            <button onclick="openUploadModal(${i})" class="btn-circle" title="Post"><i class="fas fa-plus text-[10px]"></i></button>
                        `;
                    }
                    container.appendChild(div);
                }
            });
        }

        window.openUploadModal = (idx) => {
            activeSlot = idx;
            document.getElementById('upload-modal').classList.add('open');
        };

        document.getElementById('upload-preview').onclick = () => document.getElementById('file-input').click();

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                pendingImgData = evt.target.result;
                document.getElementById('upload-preview').innerHTML = `<img src="${pendingImgData}" class="w-full h-full object-cover">`;
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('confirm-upload-btn').onclick = async () => {
            const title = document.getElementById('post-title').value.trim();
            const isPublic = document.getElementById('post-public').checked;
            if (!pendingImgData) return alert("Select an image first!");

            const btn = document.getElementById('confirm-upload-btn');
            btn.disabled = true;
            btn.textContent = 'Sharing...';

            try {
                const userSnap = await db.collection('users').doc(currentUser.uid).get();
                const postRef = await db.collection('daily_photos').add({
                    creatorUid: currentUser.uid,
                    creatorUsername: userSnap.data().username,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    imageBase64: pendingImgData,
                    title: title || "Daily Moment",
                    isPublic: isPublic,
                    status: 'active',
                    hearts: [],
                    comments: []
                });

                let slots = userSnap.data().dailySlotsUsed || [];
                while (slots.length <= activeSlot) slots.push(null);
                slots[activeSlot] = postRef.id;
                await db.collection('users').doc(currentUser.uid).update({ dailySlotsUsed: slots });

                closeModal('upload-modal');
                // Clear fields
                document.getElementById('post-title').value = '';
                document.getElementById('upload-preview').innerHTML = '<i class="fas fa-cloud-upload-alt text-4xl text-gray-800"></i>';
                pendingImgData = null;
            } catch(e) { console.error(e); }
            btn.disabled = false;
            btn.textContent = 'Post Moment';
        };

        window.deletePost = async (postId, idx) => {
            if (!confirm("Remove this moment?")) return;
            const userRef = db.collection('users').doc(currentUser.uid);
            const slots = (await userRef.get()).data().dailySlotsUsed || [];
            slots[idx] = 'DELETED';
            await db.collection('daily_photos').doc(postId).delete();
            await userRef.update({ dailySlotsUsed: slots });
        };

        function setupSearch() {
            const input = document.getElementById('user-search');
            const results = document.getElementById('search-results');
            input.oninput = async (e) => {
                const term = e.target.value.trim().toLowerCase();
                if (term.length < 2) return results.innerHTML = '';
                
                const snap = await db.collection('users')
                    .where('username', '>=', term)
                    .where('username', '<=', term + '\uf8ff')
                    .limit(5).get();
                
                results.innerHTML = '';
                snap.forEach(doc => {
                    if (doc.id === currentUser.uid) return;
                    const d = doc.data();
                    const div = document.createElement('div');
                    div.className = 'nav-item !mx-0 !px-4 !py-2 hover:!bg-white/5';
                    div.innerHTML = `
                        <div class="w-6 h-6 rounded-lg overflow-hidden">${getAvatarHTML(d, "w-full h-full", false, currentUser)}</div>
                        <span class="text-[11px] text-gray-400">@${d.username}</span>
                    `;
                    div.onclick = () => window.location.href = `/logged-in/@${d.username}`;
                    results.appendChild(div);
                });
            };
        }

        let feedUnsub = () => {};
        function setupFeed() {
            feedUnsub();
            const grid = document.getElementById('photo-feed');
            grid.innerHTML = '<div class="col-span-full py-20 text-center"><i class="fas fa-spinner fa-spin text-indigo-500/20 text-2xl"></i></div>';

            const today = new Date(); today.setHours(0,0,0,0);
            let q = db.collection('daily_photos').where('status', '==', 'active').where('createdAt', '>=', today);

            if (feedMode === 'global') {
                q = q.where('isPublic', '==', true).orderBy('createdAt', 'desc').limit(50);
                feedUnsub = q.onSnapshot(renderFeedGrid);
            } else {
                db.collection('users').doc(currentUser.uid).collection('following').get().then(snap => {
                    const uids = [currentUser.uid, ...snap.docs.map(d => d.id)].slice(0, 10);
                    if (uids.length === 0) {
                        grid.innerHTML = '<p class="text-gray-700 col-span-full text-center py-20 text-sm">Follow users to see their moments here.</p>';
                        return;
                    }
                    q = q.where('creatorUid', 'in', uids).orderBy('createdAt', 'desc');
                    feedUnsub = q.onSnapshot(renderFeedGrid);
                });
            }
        }

        function renderFeedGrid(snap) {
            const grid = document.getElementById('photo-feed');
            grid.innerHTML = '';
            if (snap.empty) {
                grid.innerHTML = '<p class="text-gray-800 col-span-full text-center py-20 text-sm italic">No moments shared today yet.</p>';
                return;
            }
            snap.forEach(doc => {
                const data = doc.data();
                const div = document.createElement('div');
                div.className = 'photo-card';
                div.innerHTML = `
                    <img src="${data.imageBase64}" loading="lazy">
                    <div class="overlay-grad">
                        <p class="text-xs font-bold text-white">@${data.creatorUsername}</p>
                        <p class="text-[10px] text-gray-400 truncate">${data.title}</p>
                    </div>
                `;
                div.onclick = () => viewPost(doc.id);
                grid.appendChild(div);
            });
        }

        function setupNav() {
            document.querySelectorAll('.nav-item[data-mode]').forEach(btn => {
                btn.onclick = () => {
                    if (btn.classList.contains('active')) return;
                    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    feedMode = btn.dataset.mode;
                    document.getElementById('feed-title').textContent = feedMode === 'following' ? 'Following' : 'Global Pulse';
                    document.getElementById('feed-desc').textContent = feedMode === 'following' ? 'Moments from people you follow.' : 'Discover shared moments from across the network.';
                    setupFeed();
                };
            });
        }

        window.viewPost = async (postId) => {
            const snap = await db.collection('daily_photos').doc(postId).get();
            if (!snap.exists) return;
            const data = snap.data();
            
            document.getElementById('modal-img').src = data.imageBase64;
            document.getElementById('modal-post-title').textContent = data.title;
            document.getElementById('modal-author-name').textContent = `@${data.creatorUsername}`;
            document.getElementById('modal-post-date').textContent = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "Just now";
            
            const authorSnap = await db.collection('users').doc(data.creatorUid).get();
            document.getElementById('modal-author-avatar').innerHTML = getAvatarHTML(authorSnap.data(), "w-full h-full", false, currentUser);
            
            renderComments(data.comments || []);
            document.getElementById('view-modal').classList.add('open');

            document.getElementById('send-comment-btn').onclick = async () => {
                const input = document.getElementById('comment-input');
                const text = input.value.trim();
                if (!text) return;
                
                const userSnap = await db.collection('users').doc(currentUser.uid).get();
                const comment = {
                    uid: currentUser.uid,
                    username: userSnap.data().username,
                    text: text,
                    timestamp: new Date()
                };
                
                await db.collection('daily_photos').doc(postId).update({
                    comments: firebase.firestore.FieldValue.arrayUnion(comment)
                });
                input.value = '';
                const updatedSnap = await db.collection('daily_photos').doc(postId).get();
                renderComments(updatedSnap.data().comments);
            };
        };

        function renderComments(comments) {
            const container = document.getElementById('modal-comments');
            container.innerHTML = comments.map(c => `
                <div class="text-[11px] leading-relaxed">
                    <span class="font-bold text-indigo-400 mr-1">@${c.username}</span>
                    <span class="text-gray-400">${c.text}</span>
                </div>
            `).join('') || '<p class="text-[10px] text-gray-700 italic">No comments yet.</p>';
            container.scrollTop = container.scrollHeight;
        }

        window.closeModal = (id) => document.getElementById(id).classList.remove('open');
    </script>
</body>
</html>
