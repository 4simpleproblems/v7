<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - DAILYPHOTO (v6.7.2)</title>
    <meta name="description" content="A student-built moment sharing platform. Clean, fast, and local.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
    <script src="../injector.js"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
        }

        body { font-family: 'Geist', sans-serif; background-color: var(--bg-page); color: var(--text-main); font-weight: 300; overflow: hidden; min-height: 100vh; }
        .main-container { display: flex; height: 100vh; pt: 64px; }
        .sidebar { width: 320px; border-right: 1px solid var(--border-main); background: var(--bg-card); display: flex; flex-direction: column; overflow-y: auto; shrink-0; }
        .main-content { flex: 1; min-width: 0; background: var(--bg-page); display: flex; flex-direction: column; }
        .content-scroll { flex: 1; overflow-y: auto; padding: 3rem; }
        .photo-feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .photo-thumbnail { position: relative; aspect-ratio: 4/5; border-radius: 2rem; overflow: hidden; border: 1px solid var(--border-main); cursor: pointer; transition: all 0.4s; }
        .photo-thumbnail:hover { border-color: var(--accent-color); transform: translateY(-4px); }
        .photo-thumbnail img { width: 100%; height: 100%; object-cover: cover; }
        
        .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(20px); z-index: 10000; display: none; align-items: center; justify-content: center; }
        .modal-backdrop.open { display: flex; }
        .modal-container { background: #000; border: 1px solid var(--border-main); border-radius: 3rem; width: 95%; max-width: 1100px; height: 85vh; display: flex; overflow: hidden; position: relative; }
        
        #photo-display-area { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2rem; }
        .photo-modal-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #photo-info-panel { width: 400px; border-left: 1px solid var(--border-main); display: flex; flex-direction: column; padding: 2.5rem; overflow-y: auto; }
        
        .btn-toolbar-style { background: var(--bg-card); border: 1px solid var(--border-main); border-radius: 16px; padding: 0.6rem 1.25rem; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--text-muted); }
        .btn-primary-override { background-color: var(--accent-color) !important; color: #fff !important; border-color: var(--accent-color) !important; }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="main-container">
        <aside class="sidebar p-8">
            <div class="mb-10">
                <h3 class="text-xs font-black uppercase tracking-[0.2em] opacity-30 mb-6">Profile Statistics</h3>
                <div id="user-stat-card" class="bg-white/5 border border-white/5 rounded-[2rem] p-6 mb-4">
                    <!-- Stat loading -->
                </div>
                <button id="open-upload-modal" class="btn-toolbar-style btn-primary-override w-full py-4 shadow-2xl">
                    <i class="fas fa-plus mr-2"></i> Post Today
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-scroll">
                <header class="flex justify-between items-end mb-12">
                    <h1 class="text-4xl font-bold">Daily Photo</h1>
                    <div class="flex gap-2 p-1.5 bg-white/5 rounded-2xl border border-white/5">
                        <button id="feed-toggle-school" class="btn-toolbar-style active">School</button>
                        <button id="feed-toggle-district" class="btn-toolbar-style">District</button>
                    </div>
                </header>
                <div id="photo-feed" class="photo-feed-grid">
                    <!-- Thumbnails -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="photo-modal" class="modal-backdrop">
        <div class="modal-container" id="modal-content-container"></div>
    </div>

    <script type="module">
        import { getAvatarHTML } from "/utils.js";
        const supabase = window.supabase;

        let currentUser = null;
        let userData = {};
        let isAdmin = false;

        async function init() {
            if (!supabase) { setTimeout(init, 100); return; }
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) { window.location.href = '/authentication.html'; return; }
            
            currentUser = session.user;
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            userData = profile || {};
            isAdmin = profile?.is_admin || currentUser.email === '4simpleproblems@gmail.com';

            loadFeed();
        }

        async function loadFeed() {
            const { data: posts } = await supabase.from('daily_photos').select('*').order('created_at', { ascending: false }).limit(50);
            const grid = document.getElementById('photo-feed');
            grid.innerHTML = posts?.map(p => `
                <div class="photo-thumbnail" onclick="viewPost('${p.id}')">
                    <img src="${p.image_url}" loading="lazy">
                    <div class="absolute bottom-4 left-4 font-bold text-white text-sm">@${p.creator_username}</div>
                </div>
            `).join('') || '<p class="opacity-20 italic">No posts found.</p>';
        }

        window.viewPost = async (postId) => {
            const modal = document.getElementById('photo-modal');
            const container = document.getElementById('modal-content-container');
            modal.classList.add('open');
            
            const render = async () => {
                const { data: post } = await supabase.from('daily_photos').select('*').eq('id', postId).single();
                if (!post) return;

                const hearts = post.hearts || [];
                const comments = post.comments || [];
                const isHearted = hearts.includes(currentUser.id);

                container.innerHTML = `
                    <button onclick="window.closeModal()" class="absolute top-8 right-8 text-white text-2xl z-50"><i class="fas fa-times"></i></button>
                    <div id="photo-display-area"><img src="${post.image_url}" class="photo-modal-img rounded-2xl"></div>
                    <div id="photo-info-panel">
                        <div class="flex items-center justify-between mb-8">
                            <span class="font-bold text-lg">@${post.creator_username}</span>
                            <div class="flex gap-2">
                                <button id="heart-btn" class="btn-toolbar-style ${isHearted ? 'text-red-500 border-red-500/50 bg-red-500/5' : ''}">
                                    <i class="${isHearted ? 'fas' : 'far'} fa-heart"></i> ${hearts.length}
                                </button>
                            </div>
                        </div>
                        <div id="comments-list" class="flex-1 overflow-y-auto pr-2 space-y-4 mb-6">
                            ${comments.map(c => `<div class="text-xs"><b>@${c.username}</b>: ${c.text}</div>`).join('') || '<p class="opacity-20 italic text-center py-10">No comments yet.</p>'}
                        </div>
                        <div class="flex gap-2">
                            <input id="comment-in" type="text" placeholder="Add comment..." class="flex-1 bg-white/5 border border-white/10 rounded-xl p-3 text-xs outline-none focus:border-indigo-500 text-white">
                            <button id="send-comment" class="w-10 h-10 rounded-xl bg-indigo-600 text-white"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                `;

                document.getElementById('heart-btn').onclick = async () => {
                    await supabase.rpc('like_photo', { photo_id: postId });
                    render();
                };

                document.getElementById('send-comment').onclick = async () => {
                    const text = document.getElementById('comment-in').value.trim();
                    if (text) {
                        await supabase.rpc('comment_on_photo', { photo_id: postId, comment_text: text });
                        render();
                    }
                };
            };
            render();
        };

        window.closeModal = () => document.getElementById('photo-modal').classList.remove('open');

        init();
    </script>
</body>
</html>
