<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - LEADERBOARD</title>
    <base href="/">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/injector.js"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        * { box-sizing: border-box; }

        body { 
            font-family: 'Manrope', sans-serif; 
            color: var(--text-main);
            background-color: var(--bg-page);
            font-weight: 300;
            overflow: hidden;
        }

        /* Subtle dot grid */
        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
            transition: background 0.8s ease;
        }

        body.streak-mode #dynamic-background {
            background: radial-gradient(circle at 50% 20%, rgba(249, 115, 22, 0.4), transparent 65%);
        }

        .dual-pfp {
            display: flex;
            align-items: center;
            margin-left: -0.5rem;
        }
        .dual-pfp .pfp-slot {
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            border: 3px solid var(--bg-card);
            overflow: hidden;
            background: #000;
            margin-left: -1rem;
            transition: transform 0.3s ease;
        }
        .dual-pfp .pfp-slot:first-child { margin-left: 0; z-index: 2; }
        .dual-pfp .pfp-slot:last-child { z-index: 1; }
        .leader-item:hover .dual-pfp .pfp-slot:first-child { transform: translateX(-4px); }
        .leader-item:hover .dual-pfp .pfp-slot:last-child { transform: translateX(4px); }

        .streak-fire-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.2);
            color: #f97316;
            font-weight: 900;
            font-size: 0.875rem;
        }

        .feature-card {
            border-radius: 2rem;
            border: 1px solid var(--border-main);
            background: var(--bg-card);
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5);
        }

        /* ------------------------------------------------------------------ */
        /* BUTTONS                                                             */
        /* ------------------------------------------------------------------ */
        .btn-toolbar-style {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            outline: 1px solid transparent;
        }
        .btn-toolbar-style:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            background: var(--btn-bg);
            outline: 1px solid var(--accent-glow);
        }
        .btn-primary-override {
            background-color: var(--btn-bg) !important;
            border: 1px solid var(--accent-color) !important;
            color: var(--accent-color) !important;
            outline: 1px solid var(--accent-glow);
        }
        .btn-primary-override:hover {
            background-color: var(--accent-color) !important;
            color: #fff !important;
            transform: scale(1.02);
            outline: 1px solid rgba(255,255,255,0.2);
        }

        /* ------------------------------------------------------------------ */
        /* LEADERBOARD LIST                                                    */
        /* ------------------------------------------------------------------ */
        .leader-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1.25rem 2rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-main);
            border-radius: 24px;
            margin-bottom: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .leader-item:hover { 
            background: var(--bg-card);
            border-color: var(--accent-color);
            transform: scale(1.01) translateX(8px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        .rank-num { font-size: 1.5rem; font-weight: 800; width: 50px; color: var(--text-muted); opacity: 0.2; }
        .rank-1-text { color: #fbbf24; opacity: 1; text-shadow: 0 0 20px rgba(251, 191, 36, 0.3); }
        .rank-2-text { color: #cbd5e1; opacity: 1; }
        .rank-3-text { color: #d97706; opacity: 1; }

        .follow-btn {
            padding: 0.6rem 1.25rem;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 700;
            transition: all 0.2s;
            border: 1px solid var(--border-main);
            color: var(--accent-color);
            background: var(--btn-bg);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .follow-btn:hover {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }
        .follow-btn.following {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .nav-link-box {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 1.25rem;
            border-radius: 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .nav-link-box i { width: 1.25rem; text-align: center; font-size: 1rem; }
        .nav-link-box:hover {
            background: var(--btn-bg);
            color: var(--accent-color);
            border-color: var(--accent-glow);
        }

        .custom-scroll::-webkit-scrollbar { width: 0; }
    </style>
</head>

<body class="grid-bg min-h-screen relative">
    <div id="dynamic-background"></div>
    <div id="navbar-container"></div>

    <main id="leaderboard-page-container" class="invisible flex h-screen">
        
        <!-- SIDEBAR (Sticky, Full Height) -->
        <aside class="w-[400px] shrink-0 border-r border-[var(--border-main)] bg-[var(--bg-card)] sticky top-0 h-screen overflow-y-auto custom-scroll">
            <div class="p-10 pt-12 flex flex-col items-center min-h-full">
                
                <div class="w-full flex justify-between items-center mb-12 shrink-0">
                    <div class="flex items-center gap-3 px-4 py-2.5 rounded-2xl bg-white/5 border border-white/10">
                        <i class="fas fa-trophy text-xs text-indigo-400"></i>
                        <span class="text-[10px] font-black uppercase tracking-[0.2em]">Global Rankings</span>
                    </div>
                </div>

                <div class="text-center w-full mb-12">
                    <h1 class="text-5xl font-light tracking-tight mb-2" style="color: var(--text-main);">Hall of Fame</h1>
                    <p class="text-sm opacity-40 leading-relaxed italic" style="color: var(--text-muted);">The definitive hierarchy of 4SP activity.</p>
                </div>

                <!-- CHAMPION WIDGET (Sidebar Anchor) -->
                <div id="top-user-section" class="w-full p-8 rounded-[32px] border border-indigo-500/20 bg-indigo-500/5 mb-12 relative overflow-hidden group">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl group-hover:bg-indigo-500/20 transition-all"></div>
                    
                    <div class="flex flex-col items-center text-center relative z-10">
                        <div class="mb-6 relative">
                            <div id="champion-avatar" class="w-32 h-32 rounded-[40px] border-4 border-indigo-500/30 overflow-hidden bg-black/40 shadow-2xl">
                                <i class="fas fa-crown text-4xl text-indigo-400 mt-10"></i>
                            </div>
                            <div class="absolute -bottom-3 -right-3 w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center border-4 border-[var(--bg-card)] shadow-lg">
                                <span class="text-white font-black text-sm">#1</span>
                            </div>
                        </div>
                        
                        <p class="text-[10px] font-black uppercase tracking-[0.3em] text-indigo-400 mb-2">Current Champion</p>
                        <h2 id="champion-name" class="text-3xl font-medium text-white truncate w-full px-2">---</h2>
                        <p id="champion-time" class="text-xs font-mono opacity-50 mt-2">0h 0m total</p>
                    </div>
                </div>

                <!-- Quick Navigation -->
                <div class="w-full flex flex-col gap-1 mb-8">
                    <p class="text-[10px] font-black uppercase tracking-[0.2em] opacity-30 mb-4 px-2">Navigation</p>
                    <a href="/logged-in/dailyphoto.html" class="nav-link-box">
                        <i class="fa-solid fa-camera-retro"></i> Social Feed
                    </a>
                    <a href="/logged-in/dashboard.html" class="nav-link-box">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </div>

                <!-- Final Action (Profile) -->
                <div class="mt-auto w-full pb-4">
                    <a href="/logged-in/profile.html" class="btn-toolbar-style btn-primary-override w-full py-4 text-[10px] font-black uppercase tracking-[0.25em]">
                        View My Standings
                    </a>
                </div>
            </div>
        </aside>

        <!-- MAIN RANKINGS -->
        <section class="flex-1 min-w-0 p-16 pt-12 overflow-y-auto">
            <div class="max-w-[1000px] mx-auto">
                
                <!-- Rankings Header -->
                <div class="flex justify-between items-end mb-16">
                    <div>
                        <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 mb-2">Active Roster</p>
                        <h2 id="leaderboard-title" class="text-6xl font-light tracking-tight" style="color: var(--text-main);">Top 50 Users</h2>
                        <p id="leaderboard-desc" class="text-lg mt-3" style="color: var(--text-muted); opacity: 0.5;">Synchronized real-time network activity rankings.</p>
                    </div>
                    <div class="flex gap-2 p-1.5 bg-white/5 border border-white/10 rounded-2xl">
                        <button id="mode-time" class="btn-toolbar-style active px-6">By Time</button>
                        <button id="mode-streaks" class="btn-toolbar-style px-6">Top Streaks</button>
                    </div>
                </div>

                <!-- Rankings List -->
                <div id="rankings-list" class="flex flex-col">
                    <!-- Loading State -->
                    <div class="py-20 flex flex-col items-center justify-center opacity-20">
                        <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                        <p class="text-xs font-black uppercase tracking-[0.2em]">Synchronizing Network</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc, increment, limit, orderBy, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from '/firebase-config.js';
        import { supabaseConfig } from '/supabase-config.js';
        import { getAvatarHTML } from "/utils.js";

        // Initialize primary app
        if (!getApps().length) initializeApp(firebaseConfig);
        const app = getApp();
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Supabase Client
        const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        window.supabase = supabase;

        window.__PAGE_KEY = 'leaderboard';
        let leaderboardMode = 'time';

        async function initLeaderboard() {
            onAuthStateChanged(auth, async (user) => {
                let uid = user ? (user.uid || user.id) : null;
                if (!uid && window.supabase) {
                    const { data: { session } } = await supabase.auth.getSession();
                    if (session) uid = session.user.id;
                }

                if (uid) {
                    loadUserRankings(uid);
                    setupModeToggles(uid);
                } else if (!window._LOCAL_MODE) {
                    window.location.replace('/authentication.html');
                }
            });
            
            document.getElementById('leaderboard-page-container').classList.remove('invisible');
        }

        function setupModeToggles(uid) {
            document.getElementById('mode-time').onclick = () => {
                leaderboardMode = 'time';
                document.body.classList.remove('streak-mode');
                document.getElementById('mode-time').classList.add('active', 'btn-primary-override');
                document.getElementById('mode-streaks').classList.remove('active', 'btn-primary-override');
                document.getElementById('leaderboard-title').textContent = 'Top 50 Users';
                document.getElementById('leaderboard-desc').textContent = 'Synchronized real-time network activity rankings.';
                loadUserRankings(uid);
            };
            document.getElementById('mode-streaks').onclick = () => {
                leaderboardMode = 'streaks';
                document.body.classList.add('streak-mode');
                document.getElementById('mode-streaks').classList.add('active', 'btn-primary-override');
                document.getElementById('mode-time').classList.remove('active', 'btn-primary-override');
                document.getElementById('leaderboard-title').textContent = 'Elite Streaks';
                document.getElementById('leaderboard-desc').textContent = 'The most dedicated DailyPhoto duos in the network.';
                loadUserRankings(uid);
            };
        }

        async function loadUserRankings(currentUid) {
            const rankingsEl = document.getElementById('rankings-list');
            rankingsEl.innerHTML = '<div class="py-20 flex flex-col items-center justify-center opacity-20"><i class="fas fa-spinner fa-spin text-4xl mb-4"></i><p class="text-xs font-black uppercase tracking-[0.2em]">Synchronizing Network</p></div>';
            
            // Sidebar loading state
            document.getElementById('champion-name').textContent = '---';
            document.getElementById('champion-time').textContent = 'Synchronizing...';
            const champAvatarContainer = document.getElementById('champion-avatar');
            champAvatarContainer.innerHTML = '<i class="fas fa-spinner fa-spin text-2xl text-indigo-400 opacity-20"></i>';
            champAvatarContainer.classList.add('flex', 'items-center', 'justify-center');
            champAvatarContainer.classList.remove('no-hover');
            champAvatarContainer.style.background = '';
            champAvatarContainer.style.border = '';
            champAvatarContainer.style.boxShadow = '';

            try {
                let rankedItems = [];
                let error = null;

                if (leaderboardMode === 'time') {
                    const res = await supabase
                        .from('profiles')
                        .select('*')
                        .order('total_v7_time', { ascending: false })
                        .limit(50);
                    rankedItems = res.data;
                    error = res.error;
                } else {
                    const res = await supabase.rpc('get_top_friend_streaks');
                    rankedItems = res.data;
                    error = res.error;
                }

                if (error) throw error;

                if (!rankedItems || rankedItems.length === 0) {
                    rankingsEl.innerHTML = '<p class="text-center opacity-30 italic py-20">No rankings found.</p>';
                    return;
                }
                
                let following = new Set();
                try {
                    const { data: followRecords } = await supabase.from('follows').select('following_id').eq('follower_id', currentUid);
                    (followRecords || []).forEach(f => following.add(f.following_id));
                } catch (e) { console.warn("Could not fetch follows."); }

                rankingsEl.innerHTML = '';
                
                let myRank = 0;
                rankedItems.forEach((data, index) => {
                    const i = index + 1;
                    const item = document.createElement('div');
                    item.className = 'leader-item';
                    
                    const rankClass = i === 1 ? 'rank-1-text' : (i === 2 ? 'rank-2-text' : (i === 3 ? 'rank-3-text' : ''));

                    if (leaderboardMode === 'time') {
                        const uid = data.id;
                        if (uid === currentUid) myRank = i;
                        if (i === 1) updateChampion(data);

                        const hours = Math.floor((data.total_v7_time || 0) / 3600);
                        const minutes = Math.floor(((data.total_v7_time || 0) % 3600) / 60);
                        const isFollowing = following.has(uid);

                        item.innerHTML = `
                            <div class="rank-num ${rankClass}">${i}</div>
                            ${getAvatarHTML({ ...data, displayName: data.display_name, pfpType: data.pfp_type, customPfp: data.avatar_url }, "w-12 h-12", false, null, "rounded-xl")}
                            <div class="flex-grow ml-4 min-w-0">
                                <div class="text-base font-bold truncate" style="color: var(--text-main);">${data.display_name || data.username || "Anonymous"}</div>
                                <div class="text-xs opacity-40 font-mono" style="color: var(--text-muted);">${hours}h ${minutes}m activity</div>
                            </div>
                            ${uid !== currentUid ? `
                                <button class="follow-btn ${isFollowing ? 'following' : ''}" data-uid="${uid}">
                                    ${isFollowing ? 'Following' : 'Follow'}
                                </button>
                            ` : '<span class="text-[10px] opacity-40 font-black uppercase tracking-[0.2em]">Me</span>'}
                        `;
                        item.onclick = (e) => {
                            if (e.target.closest('.follow-btn')) return;
                            if (data.username) window.location.href = `/logged-in/@${data.username}`;
                        };
                    } else {
                        // Streak Pair Mode
                        const isPart = (data.user1_id === currentUid || data.user2_id === currentUid);
                        if (isPart) myRank = i;
                        if (i === 1) updateChampionStreak(data, currentUid);

                        const user1IsHidden = data.user1_hide_streaks && data.user1_id !== currentUid;
                        const user2IsHidden = data.user2_hide_streaks && data.user2_id !== currentUid;

                        const user1DisplayName = user1IsHidden ? 'Someone' : (data.user1_display_name || data.user1_username);
                        const user2DisplayName = user2IsHidden ? 'Someone' : (data.user2_display_name || data.user2_username);
                        
                        const user1Username = user1IsHidden ? 'someone' : data.user1_username;
                        const user2Username = user2IsHidden ? 'someone' : data.user2_username;

                        const dummyUser = { display_name: 'Someone', pfp_type: 'letter', pfp_letter_bg: '#333333', pfp_letter_char: '?' };

                        const pfp1 = getAvatarHTML(user1IsHidden ? dummyUser : { id: data.user1_id, username: data.user1_username, display_name: data.user1_display_name, pfp_type: data.user1_pfp_type, avatar_url: data.user1_avatar_url }, "w-full h-full", false, null, "rounded-xl");
                        const pfp2 = getAvatarHTML(user2IsHidden ? dummyUser : { id: data.user2_id, username: data.user2_username, display_name: data.user2_display_name, pfp_type: data.user2_pfp_type, avatar_url: data.user2_avatar_url }, "w-full h-full", false, null, "rounded-xl");

                        item.innerHTML = `
                            <div class="rank-num ${rankClass}">${i}</div>
                            <div class="dual-pfp shrink-0">
                                <div class="pfp-slot">${pfp1}</div>
                                <div class="pfp-slot">${pfp2}</div>
                            </div>
                            <div class="flex-grow ml-4 min-w-0">
                                <div class="text-sm font-bold truncate text-white">@${user1Username} <span class="text-xs opacity-40 mx-1">&</span> @${user2Username}</div>
                                <div class="text-[10px] opacity-40 uppercase tracking-widest font-black mt-1">Shared DailyPhoto Duo</div>
                            </div>
                            <div class="streak-fire-badge">
                                <i class="fas fa-fire animate-pulse"></i>
                                <span>${data.streak_count}</span>
                            </div>
                        `;
                    }

                    rankingsEl.appendChild(item);
                    if (leaderboardMode === 'time') {
                        const fBtn = item.querySelector('.follow-btn');
                        if (fBtn) fBtn.onclick = () => toggleFollow(fBtn, data.id, currentUid);
                    }
                });

                if (myRank > 0 && leaderboardMode === 'time') updateGlobalNavRank(myRank);
            } catch (e) {
                console.error("Leaderboard error:", e);
                rankingsEl.innerHTML = '<p class="text-center text-red-400 italic py-20">Error synchronizing ranking data.</p>';
            }
        }

        function updateChampionStreak(data, currentUid) {
            const user1IsHidden = data.user1_hide_streaks && data.user1_id !== currentUid;
            const user2IsHidden = data.user2_hide_streaks && data.user2_id !== currentUid;

            const user1Username = user1IsHidden ? 'someone' : data.user1_username;
            const user2Username = user2IsHidden ? 'someone' : data.user2_username;

            document.getElementById('champion-name').textContent = `@${user1Username} & @${user2Username}`;
            document.getElementById('champion-time').textContent = `Shared streak of ${data.streak_count} days`;
            
            const dummyUser = { display_name: 'Someone', pfp_type: 'letter', pfp_letter_bg: '#333333', pfp_letter_char: '?' };
            const champAvatarContainer = document.getElementById('champion-avatar');
            const pfp1 = getAvatarHTML(user1IsHidden ? dummyUser : { id: data.user1_id, username: data.user1_username, display_name: data.user1_display_name, pfp_type: data.user1_pfp_type, avatar_url: data.user1_avatar_url }, "w-full h-full", false, null, "rounded-xl");
            const pfp2 = getAvatarHTML(user2IsHidden ? dummyUser : { id: data.user2_id, username: data.user2_username, display_name: data.user2_display_name, pfp_type: data.user2_pfp_type, avatar_url: data.user2_avatar_url }, "w-full h-full", false, null, "rounded-xl");
            
            champAvatarContainer.classList.add('no-hover', 'flex', 'justify-center', 'items-center');
            champAvatarContainer.style.background = 'transparent';
            champAvatarContainer.style.border = 'none';
            champAvatarContainer.style.boxShadow = 'none';
            champAvatarContainer.innerHTML = `
                <div class="dual-pfp scale-[1.8] transform translate-x-2">
                    <div class="pfp-slot" style="width: 3.5rem; height: 3.5rem; border-radius: 1.25rem; border-width: 2px;">${pfp1}</div>
                    <div class="pfp-slot" style="width: 3.5rem; height: 3.5rem; border-radius: 1.25rem; border-width: 2px;">${pfp2}</div>
                </div>
            `;
            
            const championSection = document.getElementById('top-user-section');
            championSection.onclick = null;
        }

        function updateGlobalNavRank(rank) {
            // Wait for navigation to finish rendering
            setTimeout(() => {
                const navTabs = window.parent.document.querySelectorAll('.nav-tab') || document.querySelectorAll('.nav-tab');
                const leaderboardTab = Array.from(navTabs).find(tab => tab.textContent.includes('Leaderboard'));
                
                if (leaderboardTab) {
                    if (rank <= 3) {
                        const colors = { 1: '#fbbf24', 2: '#cbd5e1', 3: '#d97706' };
                        const color = colors[rank];
                        
                        leaderboardTab.style.position = 'relative';
                        leaderboardTab.innerHTML += `
                            <span class="absolute top-1 right-1 w-4 h-4 bg-[${color}] rounded-full flex items-center justify-center border-2 border-black animate-pulse shadow-[0_0_10px_${color}]">
                                <span class="text-[8px] font-black text-black">#${rank}</span>
                            </span>
                        `;
                        
                        // Add glow animation
                        const styleId = 'top-3-rank-style';
                        if (!document.getElementById(styleId)) {
                            const style = document.createElement('style');
                            style.id = styleId;
                            style.innerHTML = `
                                @keyframes rank-glow {
                                    0% { box-shadow: 0 0 5px ${color}; }
                                    50% { box-shadow: 0 0 20px ${color}; }
                                    100% { box-shadow: 0 0 5px ${color}; }
                                }
                                .rank-top-3 { animation: rank-glow 2s infinite ease-in-out; border-color: ${color} !important; }
                            `;
                            document.head.appendChild(style);
                        }
                        leaderboardTab.classList.add('rank-top-3');
                    }
                }
            }, 1000);
        }

        async function toggleFollow(btn, targetUid, currentUid) {
            if (!currentUid) return;
            const isFollowing = btn.classList.contains('following');
            btn.disabled = true;

            try {
                if (isFollowing) {
                    await supabase.from('follows').delete().eq('follower_id', currentUid).eq('following_id', targetUid);
                    btn.classList.remove('following');
                    btn.textContent = 'Follow';
                } else {
                    await supabase.from('follows').insert({ follower_id: currentUid, following_id: targetUid });
                    btn.classList.add('following');
                    btn.textContent = 'Following';
                }
            } catch (e) { console.error("Follow toggle failed", e); }
            btn.disabled = false;
        }

        function updateChampion(data) {
            const champAvatarContainer = document.getElementById('champion-avatar');
            champAvatarContainer.classList.remove('no-hover', 'flex', 'justify-center', 'items-center');
            champAvatarContainer.style.background = '';
            champAvatarContainer.style.border = '';
            champAvatarContainer.style.boxShadow = '';
            
            document.getElementById('champion-name').textContent = data.display_name || data.username || "Anonymous";
            const hours = Math.floor((data.total_v7_time || 0) / 3600);
            const minutes = Math.floor(((data.total_v7_time || 0) % 3600) / 60);
            document.getElementById('champion-time').textContent = `${hours}h ${minutes}m total activity`;
            
            champAvatarContainer.innerHTML = getAvatarHTML({ ...data, displayName: data.display_name, pfpType: data.pfp_type, customPfp: data.avatar_url }, "w-full h-full", false, null, "rounded-[36px]");
            
            const championSection = document.getElementById('top-user-section');
            championSection.style.cursor = 'pointer';
            championSection.onclick = () => {
                if (data.username) window.location.href = `/logged-in/@${data.username}`;
            };
        }

        initLeaderboard();
    </script>
</body>
