<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - LEADERBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-container: var(--bg-secondary, #080808);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page);
            color: var(--text-main);
            font-weight: 300;
            min-height: 100vh;
            padding: 2.5rem;
        }

        .leaderboard-container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-card {
            background: var(--bg-container);
            border: 1px solid var(--border-main);
            border-radius: 28px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .label-tiny { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); opacity: 0.5; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem; }
        .section-title { font-size: 2rem; font-weight: 200; letter-spacing: -0.02em; margin-bottom: 1.5rem; color: var(--text-main); }

        .leader-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border-faint);
            transition: all 0.2s;
        }
        .leader-item:hover { background: var(--border-faint); }
        .leader-item:last-child { border-bottom: none; }

        .rank-num { font-size: 1.25rem; font-weight: 500; width: 40px; color: var(--text-muted); opacity: 0.4; }
        .rank-1 { color: #fbbf24; font-size: 2rem; opacity: 1; }
        .rank-2 { color: #cbd5e1; font-size: 1.5rem; opacity: 1; }
        .rank-3 { color: #d97706; font-size: 1.25rem; opacity: 1; }

        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-main);
        }

        .follow-btn {
            padding: 0.5rem 1rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            background: transparent;
        }
        .follow-btn:hover {
            background: var(--btn-bg);
        }
        .follow-btn.following {
            background: var(--accent-color);
            color: white;
        }

        .page-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .page-stat-item {
            background: var(--border-faint);
            border: 1px solid var(--border-main);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .highlight-card {
            background: linear-gradient(135deg, var(--accent-glow) 0%, var(--bg-page) 100%);
            border-color: var(--accent-color);
            text-align: center;
            padding: 3rem;
        }
    </style>
</head>

<body>
    <div class="leaderboard-container">
        <header class="mb-12">
            <h1 class="text-5xl font-light tracking-tighter mb-2 text-[var(--text-main)]">V6 Leaderboard</h1>
            <p class="text-[var(--text-muted)] opacity-60 text-lg font-light">The global rankings of 4SP's most active users.</p>
        </header>

        <!-- TOP 1 SECTION -->
        <div id="top-user-section" class="section-card highlight-card">
            <div class="label-tiny">Global Champion</div>
            <div id="champion-avatar" class="user-avatar w-24 h-24 mx-auto mb-4 border-2 border-indigo-500/50">
                <i class="fas fa-user text-3xl text-gray-700"></i>
            </div>
            <h2 id="champion-name" class="text-4xl font-light mb-1">---</h2>
            <p id="champion-time" class="text-indigo-400 font-mono">0h 0m total experience</p>
        </div>

        <!-- TOP PAGES -->
        <div class="section-card">
            <div class="label-tiny">System Pulse</div>
            <h2 class="section-title text-[var(--text-main)]">Most Used Pages</h2>
            <div id="top-pages-list" class="page-stat-grid">
                <p class="text-[var(--text-muted)] opacity-40 italic">Calculating activity metrics...</p>
            </div>
        </div>

        <!-- GLOBAL RANKINGS -->
        <div class="section-card">
            <div class="label-tiny">Active Roster</div>
            <h2 class="section-title text-[var(--text-main)]">Top 50 Users</h2>
            <div id="rankings-list">
                <p class="text-[var(--text-muted)] opacity-40 italic p-4">Synchronizing ranking data...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, getDoc, collection, query, where, getDocs, updateDoc, increment, limit, orderBy, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from '../firebase-config.js';

        if (!getApps().length) initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        async function initLeaderboard() {
            onAuthStateChanged(auth, async (user) => {
                if (!user && !window._LOCAL_MODE) {
                    window.location.replace('../index.html');
                    return;
                }
                
                loadUserRankings(user ? user.uid : null);
                loadPageStats();
            });
        }

        async function loadUserRankings(currentUid) {
            const rankingsEl = document.getElementById('rankings-list');
            
            // Get current user's following list
            let following = new Set();
            if (currentUid) {
                const followSnap = await getDocs(collection(db, 'users', currentUid, 'following'));
                followSnap.forEach(docSnap => following.add(docSnap.id));
            }

            const q = query(
                collection(db, 'users'),
                where('leaderboardAccepted', '==', true),
                where('leaderboardOptOut', '==', false),
                orderBy('totalV6Time', 'desc'),
                limit(50)
            );
            
            const snap = await getDocs(q);
            
            if (snap.empty) {
                rankingsEl.innerHTML = '<p class="text-gray-600 italic p-4">No users have joined the leaderboard yet.</p>';
                return;
            }

            rankingsEl.innerHTML = '';
            let i = 1;
            
            snap.forEach(docSnap => {
                const data = docSnap.data();
                const uid = docSnap.id;
                const hours = Math.floor((data.totalV6Time || 0) / 3600);
                const minutes = Math.floor(((data.totalV6Time || 0) % 3600) / 60);

                if (i === 1) {
                    updateChampion(data);
                }

                const item = document.createElement('div');
                item.className = 'leader-item';
                
                const isFollowing = following.has(uid);

                item.innerHTML = `
                    <div class="rank-num ${i <= 3 ? 'rank-'+i : ''}">${i}</div>
                    <div class="user-avatar" id="avatar-${uid}">
                        <i class="fas fa-user text-[var(--text-muted)] opacity-40"></i>
                    </div>
                    <div class="flex-grow">
                        <div class="text-lg font-medium text-[var(--text-main)]">${data.displayName || data.username || "Anonymous"}</div>
                        <div class="text-xs text-[var(--text-muted)] opacity-60 font-mono">${hours}h ${minutes}m</div>
                    </div>
                    ${uid !== currentUid ? `
                        <button class="follow-btn ${isFollowing ? 'following' : ''}" data-uid="${uid}">
                            ${isFollowing ? 'Following' : 'Follow'}
                        </button>
                    ` : '<span class="text-[10px] text-[var(--text-muted)] opacity-60 uppercase tracking-widest font-bold">You</span>'}
                `;

                rankingsEl.appendChild(item);
                renderAvatar(data, `avatar-${uid}`);

                const fBtn = item.querySelector('.follow-btn');
                if (fBtn) {
                    fBtn.onclick = () => toggleFollow(fBtn, uid, currentUid);
                }

                i++;
            });
        }

        async function toggleFollow(btn, targetUid, currentUid) {
            if (!currentUid) return;
            const isFollowing = btn.classList.contains('following');

            try {
                const batch = writeBatch(db);
                const meRef = doc(db, 'users', currentUid);
                const ownerRef = doc(db, 'users', targetUid);
                const myFollowRef = doc(db, 'users', currentUid, 'following', targetUid);
                const theirFollowerRef = doc(db, 'users', targetUid, 'followers', currentUid);

                if (isFollowing) {
                    batch.delete(myFollowRef);
                    batch.delete(theirFollowerRef);
                    batch.update(meRef, { followingCount: increment(-1) });
                    batch.update(ownerRef, { followerCount: increment(-1) });
                } else {
                    batch.set(myFollowRef, { timestamp: serverTimestamp() });
                    batch.set(theirFollowerRef, { timestamp: serverTimestamp() });
                    batch.update(meRef, { followingCount: increment(1) });
                    batch.update(ownerRef, { followerCount: increment(1) });
                }
                await batch.commit();
                btn.classList.toggle('following');
                btn.textContent = isFollowing ? 'Follow' : 'Following';
            } catch (e) { console.error("Follow toggle failed", e); }
        }

        function updateChampion(data) {
            document.getElementById('champion-name').textContent = data.displayName || data.username || "Anonymous";
            const hours = Math.floor((data.totalV6Time || 0) / 3600);
            const minutes = Math.floor(((data.totalV6Time || 0) % 3600) / 60);
            document.getElementById('champion-time').textContent = `${hours}h ${minutes}m total experience`;
            renderAvatar(data, 'champion-avatar');
        }

        function renderAvatar(userData, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const initial = (userData.username || userData.displayName || '?').charAt(0).toUpperCase();
            const pfpType = userData.pfpType || 'google';

            let avatarHtml = '';

            if (pfpType === 'custom' && userData.customPfp) {
                avatarHtml = `<img src="${userData.customPfp}" class="w-full h-full object-cover">`;
            } else if (pfpType === 'mibi' && userData.mibiConfig) {
                const { eyes, mouths, hats, bgColor } = userData.mibiConfig || {};
                avatarHtml = `
                    <div class="relative w-full h-full" style="background-color: ${bgColor || '#3B82F6'};">
                        <img src="/mibi-avatars/head.png" class="absolute inset-0 w-full h-full object-contain">
                        ${eyes ? `<img src="/mibi-avatars/eyes/${eyes}" class="absolute inset-0 w-full h-full object-contain">` : ''}
                        ${mouths ? `<img src="/mibi-avatars/mouths/${mouths}" class="absolute inset-0 w-full h-full object-contain">` : ''}
                        ${hats ? `<img src="/mibi-avatars/hats/${hats}" class="absolute inset-0 w-full h-full object-contain">` : ''}
                    </div>
                `;
            } else if (pfpType === 'letter') {
                const bg = userData.pfpLetterBg || '#333';
                avatarHtml = `<div class="w-full h-full flex items-center justify-center font-bold text-white" style="background: ${bg};">${initial}</div>`;
            } else {
                if (userData.photoURL) {
                    avatarHtml = `<img src="${userData.photoURL}" class="w-full h-full object-cover">`;
                } else {
                    avatarHtml = `<div class="w-full h-full bg-indigo-600 flex items-center justify-center font-bold text-white">${initial}</div>`;
                }
            }

            container.innerHTML = avatarHtml;
        }

        async function loadPageStats() {
            const q = query(
                collection(db, 'analytics'),
                where('version', '==', 'project_niobium')
            );
            const snap = await getDocs(q);
            
            let pageMap = {};
            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.visitedPages) {
                    data.visitedPages.forEach(p => {
                        const path = p.path || p.url;
                        if (!path || path.includes('srcdoc')) return;
                        const title = p.title || path;
                        if (!pageMap[path]) pageMap[path] = { title, count: 0 };
                        pageMap[path].count++;
                    });
                }
            });

            const sorted = Object.entries(pageMap).sort((a,b) => b[1].count - a[1].count).slice(0, 6);
            const listEl = document.getElementById('top-pages-list');
            listEl.innerHTML = '';

            sorted.forEach(([path, data]) => {
                const item = document.createElement('div');
                item.className = 'page-stat-item';
                item.innerHTML = `
                    <div>
                        <div class="text-sm font-medium text-[var(--text-main)]">${data.title}</div>
                        <div class="text-[10px] text-[var(--text-muted)] opacity-40 uppercase tracking-widest">${path}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-light" style="color: var(--accent-color);">${data.count}</div>
                        <div class="text-[10px] text-[var(--text-muted)] opacity-40 uppercase">Sessions</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        initLeaderboard();
    </script>
</body>
</html>
