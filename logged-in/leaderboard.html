<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - LEADERBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-container: var(--bg-secondary, #080808);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page);
            color: var(--text-main);
            font-weight: 300;
            min-height: 100vh;
            padding: 4rem 2.5rem;
        }

        .leaderboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-card {
            background: var(--bg-container);
            border: 1px solid var(--border-faint);
            border-radius: 28px;
            padding: 1.5rem 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .label-tiny { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); opacity: 0.5; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 0.5rem; }
        .section-title { font-size: 2rem; font-weight: 200; letter-spacing: -0.02em; margin-bottom: 2rem; color: var(--text-main); }

        .champion-widget {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .leader-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.01);
            border: 1px solid var(--border-faint);
            border-radius: 24px;
            margin-bottom: 0.75rem;
            transition: all 0.3s ease;
        }
        .leader-item:hover { 
            background: var(--bg-secondary);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .rank-num { font-size: 1.25rem; font-weight: 600; width: 40px; color: var(--text-muted); opacity: 0.3; }
        .rank-1-text { color: var(--accent-color); font-size: 2.5rem; opacity: 1; font-weight: 800; }
        .rank-1 { color: #fbbf24; opacity: 1; }
        .rank-2 { color: #cbd5e1; opacity: 1; }
        .rank-3 { color: #d97706; opacity: 1; }

        .user-avatar {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--border-faint);
        }

        .follow-btn {
            padding: 0.5rem 1.25rem;
            border-radius: 14px;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid var(--border-faint);
            color: var(--accent-color);
            background: var(--btn-bg);
            cursor: pointer;
        }
        .follow-btn:hover {
            border-color: var(--accent-color);
            transform: scale(1.05);
        }
        .follow-btn.following {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .page-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.25rem;
        }
        .page-stat-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border-faint);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .page-stat-item:hover {
            border-color: var(--accent-color);
            background: var(--bg-secondary);
        }

        .highlight-card {
            background: var(--bg-container);
            border-color: var(--accent-color);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        /* Stale data notice */
        .stale-notice {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(251, 191, 36, 0.08);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: #fbbf24;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <div class="leaderboard-container">
        <header class="mb-16">
            <h1 class="text-6xl font-light tracking-tighter mb-4" style="color: var(--text-main);">Global Rankings</h1>
            <p style="color: var(--text-muted);" class="opacity-60 text-xl font-light">The definitive hierarchy of Project Niobium activity.</p>
        </header>

        <!-- CHAMPION SECTION -->
        <div id="top-user-section" class="section-card highlight-card champion-widget">
            <div class="flex flex-col justify-center border-r border-white/5 pr-12 h-full">
                <div class="label-tiny">Champion Status</div>
                <div class="rank-1-text">#1</div>
                <div class="text-[12px] opacity-60 mt-1 uppercase tracking-widest font-bold" style="color: var(--text-muted);">Global Rank</div>
            </div>

            <div class="flex-grow flex items-center gap-12 px-8">
                <div id="champion-avatar" class="w-24 h-24 rounded-[32px] flex items-center justify-center overflow-hidden flex-shrink-0" style="background: var(--button-bg); border: 1px solid var(--border-faint);">
                    <i class="fas fa-crown text-3xl" style="color: var(--accent-color);"></i>
                </div>
                <div class="min-w-0">
                    <div class="label-tiny">Global Champion</div>
                    <div id="champion-name" class="text-5xl font-semibold truncate mt-1" style="color: var(--text-primary);">---</div>
                    <div id="champion-time" class="text-base font-mono mt-1 opacity-70" style="color: var(--text-secondary);">0h 0m total</div>
                </div>
            </div>
            
            <div class="flex flex-col gap-2">
                <div class="px-8 py-4 bg-white/5 rounded-3xl border border-white/5 text-center">
                    <div class="label-tiny">Activity Score</div>
                    <div class="text-2xl font-bold text-white">Legendary</div>
                </div>
            </div>
        </div>

        <!-- GLOBAL RANKINGS -->
        <div>
            <div class="label-tiny">Active Roster</div>
            <h2 class="section-title" style="color: var(--text-main);">Top 50 Users</h2>
            <div id="rankings-list">
                <p style="color: var(--text-muted);" class="opacity-40 italic p-4">Synchronizing ranking data...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, updateDoc, increment, limit, orderBy, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { firebaseConfig } from '../firebase-config.js';
        import { firebaseConfig2 } from '../firebase-config-2.js';
        import { supabaseConfig } from '../supabase-config.js';
        import { getAvatarHTML } from "../utils.js";

        // Initialize primary app
        if (!getApps().length) initializeApp(firebaseConfig);
        const app = getApp();
        
        // Initialize secondary app for offloading data
        let app2;
        try {
            app2 = getApp("secondary");
        } catch (e) {
            app2 = initializeApp(firebaseConfig2, "secondary");
        }

        const auth = getAuth(app);
        const db = getFirestore(app);
        const db2 = getFirestore(app2); // Secondary DB for logs/pageviews

        // Initialize Supabase (Reuse global instance if available)
        let supabase = window.supabase;
        if (!supabase) {
            const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm");
            supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        }

        async function initLeaderboard() {
            // Supabase session check
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                loadUserRankings(session.user.id);
            }

            // Firebase fallback
            onAuthStateChanged(auth, async (user) => {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) {
                    if (!user && !window._LOCAL_MODE) {
                        window.location.replace('../index.html');
                        return;
                    }
                    loadUserRankings(user ? (user.uid || user.id) : null);
                }
            });
        }

        async function loadUserRankings(currentUid) {
            const rankingsEl = document.getElementById('rankings-list');
            
            try {
                // Fetch rankings from Supabase profiles table
                const { data: rankedUsers, error } = await supabase
                    .from('profiles')
                    .select('*')
                    .order('total_v6_time', { ascending: false })
                    .limit(50);

                if (error) throw error;

                if (!rankedUsers || rankedUsers.length === 0) {
                    rankingsEl.innerHTML = '<p class="text-gray-600 italic p-4">No users have joined the leaderboard yet.</p>';
                    return;
                }
                
                // Fetch current user's following list and all banned users in parallel (Primary DB for legacy)
                let following = new Set();
                let bannedUids = new Set();

                if (currentUid) {
                    try {
                        const [followSnap, banSnap] = await Promise.all([
                            getDocs(collection(db, 'users', currentUid, 'following')),
                            getDocs(collection(db, 'bans'))
                        ]);
                        followSnap.forEach(docSnap => following.add(docSnap.id));
                        banSnap.forEach(docSnap => bannedUids.add(docSnap.id));
                    } catch (e) {
                        console.warn("Leaderboard: Could not fetch following or ban lists from Firestore. Proceeding without them.", e.message);
                    }
                }

                rankingsEl.innerHTML = '';
                
                rankedUsers.forEach((data, index) => {
                    const uid = data.id;
                    if (bannedUids.has(uid)) return;

                    const i = index + 1;
                    const hours = Math.floor((data.total_v6_time || 0) / 3600);
                    const minutes = Math.floor(((data.total_v6_time || 0) % 3600) / 60);

                    if (i === 1) updateChampion(data);

                    const item = document.createElement('div');
                    item.className = 'leader-item cursor-pointer';
                    
                    const isFollowing = following.has(uid);

                    item.innerHTML = `
                        <div class="rank-num ${i <= 3 ? 'rank-'+i : ''}">${i}</div>
                        ${getAvatarHTML({ ...data, displayName: data.display_name, pfpType: data.pfp_type, customPfp: data.avatar_url }, "w-12 h-12", false, null, "rounded-xl")}
                        <div class="flex-grow ml-4">
                            <div class="text-sm font-medium" style="color: var(--text-main);">${data.display_name || data.username || "Anonymous"}</div>
                            <div class="text-[10px] opacity-60 font-mono" style="color: var(--text-muted);">${hours}h ${minutes}m</div>
                        </div>
                        ${uid !== currentUid ? `
                            <button class="follow-btn ${isFollowing ? 'following' : ''}" data-uid="${uid}">
                                ${isFollowing ? 'Following' : 'Follow'}
                            </button>
                        ` : '<span class="text-[10px] opacity-60 uppercase tracking-widest font-bold" style="color: var(--text-muted);">You</span>'}
                    `;

                    item.onclick = (e) => {
                        if (e.target.closest('.follow-btn')) return;
                        if (data.username) window.location.href = `/logged-in/@${data.username}`;
                    };

                    rankingsEl.appendChild(item);

                    const fBtn = item.querySelector('.follow-btn');
                    if (fBtn) fBtn.onclick = () => toggleFollow(fBtn, uid, currentUid);
                });
            } catch (e) {
                console.error("Leaderboard: Failed to load Supabase rankings", e);
                rankingsEl.innerHTML = '<p class="text-red-500 italic p-4">Error loading rankings. Please try again later.</p>';
            }
        }

        async function toggleFollow(btn, targetUid, currentUid) {
            if (!currentUid) return;
            const isFollowing = btn.classList.contains('following');

            try {
                const batch = writeBatch(db);
                const meRef = doc(db, 'users', currentUid);
                const ownerRef = doc(db, 'users', targetUid);
                const myFollowRef = doc(db, 'users', currentUid, 'following', targetUid);
                const theirFollowerRef = doc(db, 'users', targetUid, 'followers', currentUid);

                if (isFollowing) {
                    batch.delete(myFollowRef);
                    batch.delete(theirFollowerRef);
                    batch.update(meRef, { followingCount: increment(-1) });
                    batch.update(ownerRef, { followerCount: increment(-1) });
                } else {
                    batch.set(myFollowRef, { timestamp: serverTimestamp() });
                    batch.set(theirFollowerRef, { timestamp: serverTimestamp() });
                    batch.update(meRef, { followingCount: increment(1) });
                    batch.update(ownerRef, { followerCount: increment(1) });
                }
                await batch.commit();
                btn.classList.toggle('following');
                btn.textContent = isFollowing ? 'Follow' : 'Following';
            } catch (e) { console.error("Follow toggle failed", e); }
        }

        function updateChampion(data) {
            document.getElementById('champion-name').textContent = data.display_name || data.username || "Anonymous";
            const hours = Math.floor((data.total_v6_time || 0) / 3600);
            const minutes = Math.floor(((data.total_v6_time || 0) % 3600) / 60);
            document.getElementById('champion-time').textContent = `${hours}h ${minutes}m total`;
            
            const champAvatarContainer = document.getElementById('champion-avatar');
            champAvatarContainer.innerHTML = getAvatarHTML({ ...data, displayName: data.display_name, pfpType: data.pfp_type, customPfp: data.avatar_url }, "w-24 h-24", false, null, "rounded-[32px]");
            
            const championSection = document.getElementById('top-user-section');
            championSection.classList.add('cursor-pointer');
            championSection.onclick = () => {
                if (data.username) window.location.href = `/logged-in/@${data.username}`;
            };
        }

        // -----------------------------------------------------------------------
        // FIX 3 APPLIED: loadPageStats now reads a single pre-aggregated document
        // (`analytics_summary/pages`) instead of scanning the entire analytics
        // collection. The aggregation is done server-side by the Cloud Function
        // `aggregateAnalytics` which runs on a schedule (every hour).
        //
        // Falls back to a "data not yet available" message if the summary doc
        // doesn't exist yet (e.g., first deploy before the function has run).
        // -----------------------------------------------------------------------
        async function loadPageStats() {
            const listEl = document.getElementById('top-pages-list');
            const staleNotice = document.getElementById('pages-stale-notice');

            try {
                const summarySnap = await getDoc(doc(db2, 'analytics_summary', 'pages'));

                if (!summarySnap.exists()) {
                    listEl.innerHTML = '<p class="opacity-30 italic text-sm col-span-full">Page stats are being compiled. Check back soon.</p>';
                    return;
                }

                const summaryData = summarySnap.data();
                const pages = summaryData.pages || {}; // { '/path': { title, count } }
                const lastUpdated = summaryData.lastUpdated?.toDate();

                // Show stale notice with last-updated time
                if (lastUpdated) {
                    staleNotice.classList.remove('hidden');
                    const diff = Math.round((Date.now() - lastUpdated.getTime()) / 60000);
                    staleNotice.querySelector('span').textContent = diff < 2
                        ? 'Stats updated just now'
                        : `Stats updated ${diff}m ago`;
                }

                const sorted = Object.entries(pages)
                    .sort((a, b) => b[1].count - a[1].count)
                    .slice(0, 6);

                listEl.innerHTML = '';
                sorted.forEach(([path, data]) => {
                    const item = document.createElement('div');
                    item.className = 'page-stat-item';
                    item.innerHTML = `
                        <div>
                            <div class="text-sm font-medium" style="color: var(--text-main);">${data.title}</div>
                            <div class="text-[10px] opacity-40 uppercase tracking-widest" style="color: var(--text-muted);">${path}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-light" style="color: var(--accent-color);">${data.count.toLocaleString()}</div>
                            <div class="text-[10px] opacity-40 uppercase" style="color: var(--text-muted);">Sessions</div>
                        </div>
                    `;
                    listEl.appendChild(item);
                });

            } catch (e) {
                console.error("loadPageStats error:", e);
                listEl.innerHTML = '<p class="opacity-30 italic text-sm col-span-full">Unable to load page stats.</p>';
            }
        }

        initLeaderboard();
    </script>
</body>
</html>
