<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script src="/VORA_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VORA_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VORA_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VORA_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const connection = new BareMux.BareMuxConnection("/VORA_PLUS/VERN_SYSTEM/baremux/worker.js");
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VORA_PLUS/VERN_SYSTEM/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Vora Plus: BareMux Transport Active");
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Vora Plus: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("Proxy Register Error", e); }
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - VORA PLUS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#0d0d0d',
                        'accent-purple': '#a855f7',

                    },

    <style>
        :root {
            --bg-page: #050505;
            --bg-card: #0d0d0d;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --border-main: #1a1a1a;
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .hero-section {
            height: 85vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 0 4rem 6rem 4rem;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #050505 0%, rgba(5,5,5,0.8) 20%, rgba(5,5,5,0) 60%),
                        linear-gradient(to right, #050505 0%, rgba(5,5,5,0.4) 30%, rgba(5,5,5,0) 100%);
        }

        .hero-content {
            position: relative;
            z-index: 10;
            max-width: 800px;
        }

        .nav-glass {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 4rem;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            transition: background 0.3s;
        }

        .nav-glass.scrolled {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-main);
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding: 1rem 0 2rem 0;
            scroll-behavior: smooth;
        }

        .media-card {
            flex: 0 0 220px;
            aspect-ratio: 2/3;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .media-card:hover {
            transform: scale(1.08);
            z-index: 50;
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .media-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-info-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .media-card:hover .media-info-overlay {
            opacity: 1;
        }

        .play-btn-large {
            background: white;
            color: black;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }

        .play-btn-large:hover {
            opacity: 0.8;
        }

        .info-btn-large {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: background 0.2s;
        }

        .info-btn-large:hover {
            background: rgba(255,255,255,0.3);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            padding-left: 4rem;
        }

        /* Player Styles */
        #player-container {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: black;
            display: none;
        }

        #player-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-player {
            position: absolute;
            top: 2rem;
            right: 2rem;
            z-index: 2100;
            background: rgba(255,255,255,0.1);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .close-player:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="custom-scroll">
    <!-- Navbar -->
    <nav class="nav-glass" id="navbar">
        <div class="flex items-center gap-8 w-full">
            <div class="flex items-center gap-3">
                <img src="../images/logo.png" class="w-10 h-10 object-contain navbar-logo">
                <span class="text-2xl font-black tracking-tighter text-white">VORA<span class="text-accent-purple ml-1">PLUS</span></span>
            </div>
            <div class="flex items-center gap-6 ml-8">
                <a href="#" class="text-sm font-medium text-white hover:text-gray-300 transition" onclick="switchView('index')">Home</a>
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition" onclick="switchView('movies')">Movies</a>
                <a href="#" class="text-sm font-medium text-gray-400 hover:text-gray-300 transition" onclick="switchView('series')">Series</a>
            </div>
            <div class="ml-auto flex items-center gap-6">
                <div class="relative">
                    <i class="fas fa-search text-gray-400 absolute left-3 top-1/2 -translate-y-1/2 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="Titles, people, genres" 
                           class="bg-black/40 border border-white/20 rounded-full py-1.5 pl-9 pr-4 text-xs focus:outline-none focus:border-white/40 w-64 transition-all">
                </div>
                <i class="fas fa-bell text-white cursor-pointer opacity-80 hover:opacity-100"></i>
                <div class="w-8 h-8 rounded bg-accent-purple flex items-center justify-center font-bold text-xs">A</div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section" id="hero-banner">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="flex items-center gap-2 mb-4">
                <img src="../images/logo.png" class="w-6 h-6">
                <span class="text-xs font-bold tracking-widest uppercase opacity-60">Featured on Vora Plus</span>
            </div>
            <h1 id="hero-title" class="text-7xl font-black mb-4 tracking-tighter leading-none">Loading...</h1>
            <p id="hero-desc" class="text-lg text-gray-300 mb-8 line-clamp-3 max-w-2xl font-medium">...</p>
            <div class="flex items-center gap-4">
                <button id="hero-play-btn" class="play-btn-large">
                    <i class="fas fa-play"></i> Play
                </button>
                <button id="hero-info-btn" class="info-btn-large">
                    <i class="fas fa-info-circle"></i> More Info
                </button>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="relative z-20 pb-20 -mt-20">
        <!-- Trending Movies -->
        <div class="mb-12">
            <h2 class="category-title">Trending Movies</h2>
            <div id="moviesGrid" class="horizontal-scroll px-16">
                <!-- Data will be injected here -->
            </div>
        </div>

        <!-- Trending Series -->
        <div class="mb-12">
            <h2 class="category-title">Trending TV Shows</h2>
            <div id="seriesGrid" class="horizontal-scroll px-16">
                <!-- Data will be injected here -->
            </div>
        </div>

        <!-- Search Results (hidden by default) -->
        <div id="search-results-section" class="hidden mb-12">
            <h2 class="category-title">Search Results</h2>
            <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-6 px-16">
                <!-- Data will be injected here -->
            </div>
        </div>
    </main>

    <!-- Video Player -->
    <div id="player-container">
        <div class="close-player" id="close-player">
            <i class="fas fa-times"></i>
        </div>
        <iframe id="player-frame" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe>
    </div>

    <!-- Scripts -->
    <script src="/VORA_PLUS/cachedFetch.js"></script>
    <script src="/VORA_PLUS/utils.js"></script>
    <script src="/VORA_PLUS/load/embeds.js?v=6.1"></script>
    <script src="/injector.js"></script>

    <script>
        // UI Logic for Vora Plus
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        // Override default rendering to match horizontal scroll
        const originalThemedb = window.themoviedb;
        
        // Custom rendering for Vora Plus rows
        function renderRow(containerId, data) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${item.poster_path}" alt="${item.title || item.name}">
                    <div class="media-info-overlay">
                        <h3 class="font-bold text-sm truncate">${item.title || item.name}</h3>
                        <div class="flex items-center gap-2 text-[10px] opacity-80 mt-1">
                            <span>${(item.release_date || item.first_air_date || '').split('-')[0]}</span>
                            <span class="border border-white/40 px-1 rounded-sm">${item.vote_average.toFixed(1)}</span>
                        </div>
                    </div>
                `;
                card.onclick = () => window.playVideo(item);
                container.appendChild(card);
            });

            // Update Hero Banner if it's the first movie row and we're on index
            if (containerId === 'moviesGrid' && data.length > 0 && window.VORA_CONFIG.currentView === 'index') {
                updateHero(data[0]);
            }
        }

        function updateHero(item) {
            const banner = document.getElementById('hero-banner');
            const title = document.getElementById('hero-title');
            const desc = document.getElementById('hero-desc');
            const playBtn = document.getElementById('hero-play-btn');
            
            banner.style.backgroundImage = `url(https://image.tmdb.org/t/p/original${item.backdrop_path})`;
            title.textContent = item.title || item.name;
            desc.textContent = item.overview;
            playBtn.onclick = () => window.playVideo(item);
        }

        // Custom switchView for Vora Plus
        window.switchView = function(view) {
            window.VORA_CONFIG.currentView = view;
            
            const hero = document.getElementById('hero-banner');
            const moviesRow = document.getElementById('moviesGrid').parentElement;
            const seriesRow = document.getElementById('seriesGrid').parentElement;
            const searchSection = document.getElementById('search-results-section');

            if (view === 'index') {
                hero.style.display = 'flex';
                moviesRow.style.display = 'block';
                seriesRow.style.display = 'block';
                searchSection.classList.add('hidden');
                
                // Fetch fresh trending data
                fetchTrending();
            } else {
                hero.style.display = 'none';
                moviesRow.style.display = 'none';
                seriesRow.style.display = 'none';
                searchSection.classList.remove('hidden');
                
                // Fetch based on view
                if (view === 'movies') {
                    window.themoviedb(`discover/movie`, { 
                        params: { 
                            sort_by: 'popularity.desc', 
                            'primary_release_date.lte': new Date().toISOString().split('T')[0], 
                            with_original_language: 'en', 
                            page: 1 
                        } 
                    });
                } else if (view === 'series') {
                    window.themoviedb(`discover/tv`, { 
                        params: { 
                            sort_by: 'popularity.desc', 
                            'first_air_date.lte': new Date().toISOString().split('T')[0], 
                            with_original_language: 'en', 
                            page: 1 
                        } 
                    });
                }
            }
        };

        async function fetchTrending() {
            try {
                const movieData = await window.themoviedb(`trending/movie/week?page=1`);
                if (movieData && movieData.results) renderRow('moviesGrid', movieData.results);
                
                const tvData = await window.themoviedb(`trending/tv/week?page=1`);
                if (tvData && tvData.results) renderRow('seriesGrid', tvData.results);
            } catch (e) {
                console.error("Trending fetch error", e);
            }
        }

        // Intercept playVideo to show our custom player
        window.playVideo = function(videoData) {
            const container = document.getElementById('player-container');
            const frame = document.getElementById('player-frame');
            
            // Get ID and type
            const id = videoData.id;
            const type = videoData.media_type || (videoData.title ? 'movie' : 'tv');
            
            // Default to first provider (vidrock)
            let embedUrl = `https://vidrock.net/${type}/${id}`;
            if (type === 'tv') {
                embedUrl += "/1/1"; // Default to S1E1 for series
            }
            
            // Route through Vora Plus proxy
            const encoded = Ultraviolet.codec.xor.encode(embedUrl);
            frame.src = __uv$config.prefix + encoded;
            
            container.style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        document.getElementById('close-player').onclick = () => {
            const container = document.getElementById('player-container');
            const frame = document.getElementById('player-frame');
            frame.src = 'about:blank';
            container.style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        // Initial Load
        window.addEventListener('DOMContentLoaded', () => {
            fetchTrending();
        });

        // Handle search
        document.getElementById('searchInput').onkeypress = (e) => {
            if (e.key === 'Enter') {
                const query = e.target.value;
                if (!query) return;
                
                window.switchView('search');
                window.themoviedb(`search/multi`, { params: { query: query, page: 1 } });
            }
        };
    </script>
</body>
