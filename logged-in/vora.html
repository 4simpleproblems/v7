<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <script src="/VORA/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/VORA/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VORA/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VORA/VERN_SYSTEM/baremux/index.js"></script>
    <script>
        window.checkBare = async () => {
            const connection = new BareMux.BareMuxConnection("/VORA/VERN_SYSTEM/baremux/worker.js");
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VORA/VERN_SYSTEM/libcurl/index.mjs";
            
            try {
                const transport = await connection.getTransport();
                if (!transport || transport.path !== transportPath) {
                    await connection.setTransport(transportPath, [
                        { websocket: wispUrl },
                        { websocket: "wss://ruby.rubynetwork.xyz/wisp/" }
                    ]);
                }
            } catch (e) {
                await connection.setTransport(transportPath, [
                    { websocket: wispUrl },
                    { websocket: "wss://ruby.rubynetwork.xyz/wisp/" }
                ]);
            }
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/VORA/VERN_SYSTEM/sw.js", {
                        scope: "/VORA/VERN_SYSTEM/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - VORA</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-black': '#000000',
                        'card-dark': '#0d0d0d',
                        'accent-purple': '#a855f7',
                        'brand-border': '#1a1a1a',
                    },
                    fontFamily: {
                        sans: ['Geist', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: #000000; 
            color: #c0c0c0;
            font-weight: 300; 
            overflow: hidden;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 200 !important;
            color: #ffffff;
            letter-spacing: -0.02em;
        }

        /* --- Global Scrollbar --- */
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .app-container {
            display: grid;
            grid-template-areas: 
                "sidebar main"
                "bottombar bottombar";
            grid-template-columns: 280px 1fr;
            grid-template-rows: 1fr 80px;
            height: 100vh;
            width: 100%;
            background: #000000;
        }

        .sidebar {
            grid-area: sidebar;
            background: #000000;
            border-right: 1px solid #1a1a1a;
            display: flex;
            flex-direction: column;
            padding: 32px 0;
            overflow-y: auto;
        }

        .main-view {
            grid-area: main;
            background: #000000;
            overflow-y: auto;
            position: relative;
            padding: 32px;
        }

        .bottom-bar {
            grid-area: bottombar;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            padding: 0 32px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px 24px;
            color: #666;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 18px; /* 2px less than 20px */
            margin: 0 16px;
            font-weight: 300;
        }

        .nav-item:hover, .nav-item.active {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.03);
        }

        .nav-item.active {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
        }

        .video-card {
            background: #050505;
            border: 1px solid #111;
            border-radius: 22px; /* 2px less than 24px */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            aspect-ratio: 2/3;
        }

        .video-card:hover {
            border-color: #a855f7;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px rgba(168, 85, 247, 0.4);
        }

        .video-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            border-radius: 22px; /* Matching card radius */
        }

        .video-card:hover img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .search-box {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 498px; /* 2px less than 500px */
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 600px;
            transition: all 0.3s;
        }

        .search-box:focus-within {
            border-color: #a855f7;
            background: #111;
            box-shadow: 0 0 0 4px rgba(168, 85, 247, 0.1);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 10px; }

        .see-all-btn {
            font-size: 0.75rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: color 0.2s;
        }
        .see-all-btn:hover { color: #ffffff; }
    </style>
    
    <script>
        window.VORA_CONFIG = { currentView: 'index' };
        document.addEventListener('DOMContentLoaded', () => {
            if (window.switchView) switchView(window.VORA_CONFIG.currentView, false);
        });
    </script>
    <script src="/VORA/cachedFetch.js"></script>
    <script src="/VORA/utils.js"></script>
    <script src="/VORA/load/embeds.js"></script>
    <script src="/injector.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="px-8 mb-10">
                <div class="flex items-center gap-3">
                    <img src="../images/logo.png" class="w-10 h-10 object-contain">
                    <span class="text-xl font-bold tracking-tighter text-white">VORA</span>
                </div>
            </div>

            <nav class="flex-1">
                <div class="nav-item active" onclick="switchView('index')" id="nav-index">
                    <i class="fas fa-house"></i>
                    <span>Dashboard</span>
                </div>
                <div class="nav-item" onclick="switchView('movies')" id="nav-movies">
                    <i class="fas fa-film"></i>
                    <span>Movies</span>
                </div>
                <div class="nav-item" onclick="switchView('series')" id="nav-series">
                    <i class="fas fa-tv"></i>
                    <span>Series</span>
                </div>

                <div class="h-px bg-brand-border my-6 mx-8"></div>

                <div class="mt-auto pt-6">
                    <a href="https://discord.com/invite/zcADhddGQz" target="_blank" class="nav-item !bg-transparent !border-none">
                        <i class="fab fa-discord"></i>
                        <span>Discord</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main View -->
        <main class="main-view custom-scroll">
            <div class="max-w-6xl mx-auto">
                <header class="mb-12 flex flex-col items-center">
                    <h1 class="text-5xl font-black mb-8 tracking-tighter">Find your next favorite.</h1>
                    <div class="search-box">
                        <i class="fas fa-search text-gray-500"></i>
                        <input type="text" id="searchInput" placeholder="Search movies or series..." class="bg-transparent border-none outline-none flex-1 text-white">
                    </div>
                </header>

                <main>
                    <section id="favorites-section" class="mb-12 hidden">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-star text-yellow-500 text-sm"></i> Liked Media</h2>
                        <div id="favoritesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
                        <div class="h-px bg-brand-border my-12"></div>
                    </section>

                    <section id="movies-section" class="mb-12">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-ticket text-purple-500 text-sm"></i> Featured Movies</h2>
                            <span class="see-all-btn" onclick="switchView('movies')">See All</span>
                        </div>
                        <div id="moviesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
                    </section>

                    <section id="series-section" class="mb-12">
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-bold flex items-center gap-2"><i class="fas fa-tv text-purple-500 text-sm"></i> Popular Series</h2>
                            <span class="see-all-btn" onclick="switchView('series')">See All</span>
                        </div>
                        <div id="seriesGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
                    </section>

                    <section id="dynamic-section" class="hidden">
                        <h2 id="dynamic-title" class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fas fa-search text-purple-500 text-sm"></i> Results</h2>
                        <div id="videoGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
                    </section>
                </main>

                <footer class="mt-24 pt-12 border-t border-brand-border text-center text-xs text-gray-600">
                    <p class="mb-4">Content provided by non-affiliated third parties. Modified by 4SP.</p>
                    <div class="flex justify-center gap-6">
                        <a href="https://discord.gg/VDA8Ngx38Z" class="hover:text-purple-500 transition-colors">Discord</a>
                        <a href="#" class="hover:text-purple-500 transition-colors">Back to top</a>
                    </div>
                </footer>
            </div>
        </main>

        <!-- Translucent Bottom Bar -->
        <footer class="bottom-bar">
            <div class="flex items-center gap-4">
                <img src="../images/logo.png" class="w-8 h-8 opacity-20 grayscale">
                <div class="flex flex-col">
                    <span class="text-[10px] font-bold text-gray-600 uppercase tracking-widest">Powered by VORA Engine</span>
                    <span class="text-[9px] text-gray-700">Encrypted streaming node active</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Update switchView to handle sidebar active state -->
    <script>
        const originalSwitchView = window.switchView;
        window.switchView = function(view, push = true) {
            if (typeof originalSwitchView === 'function') {
                originalSwitchView(view, push);
            }
            // Update sidebar UI
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const activeNav = document.getElementById('nav-' + view);
            if (activeNav) activeNav.classList.add('active');
        };
    </script>
</body>
</html>
