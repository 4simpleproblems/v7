<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - URL TESTER</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- V6 Universal Injector -->
    <script src="/injector.js"></script>

    <!-- VERN Proxy Scripts -->
    <script src="/logged-in/uv/uv.bundle.js"></script>
    <script>
        const basePath = "/logged-in/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: basePath + "sw.js",
        };
    </script>
    <script src="/logged-in/baremux/index.js"></script>
    <script>
        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/logged-in/"
                    });
                } catch (e) {
                    console.error("SW Register Failed", e);
                }
            }
            try {
                const connection = new BareMux.BareMuxConnection(window.location.origin + "/logged-in/baremux/worker.js");
                const wispUrl = "wss://wisp.mercurywork.shop/";
                await connection.setTransport("/logged-in/libcurl/index.mjs", [
                    { websocket: wispUrl }
                ]);
            } catch (e) {
                console.error("BareMux Init Failed", e);
            }
        })();

        function getProxyUrl(url) {
            if (window.__uv$config && window.__uv$config.prefix && window.__uv$config.encodeUrl) {
                return window.__uv$config.prefix + window.Ultraviolet.codec.xor.encode(url);
            }
            if (window.Ultraviolet && window.Ultraviolet.codec && window.Ultraviolet.codec.xor) {
                 return "/logged-in/uv/service/" + window.Ultraviolet.codec.xor.encode(url);
            }
            return url;
        }
    </script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #040404);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-muted); 
            font-weight: 300; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .btn-toolbar-style {
            background: var(--bg-page);
            border: 1px solid var(--border-main);
            border-radius: 14px;
            color: var(--text-muted);
            padding: 0.75rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-toolbar-style:hover {
            border-color: var(--text-main);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        .btn-primary-override {
            background-color: var(--btn-bg);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
        }

        .input-text-style {
            width: 100%; 
            padding: 0.75rem; 
            border: 1px solid var(--border-main); 
            background-color: var(--bg-page); 
            border-radius: 14px;
            color: var(--text-main); 
            transition: all 0.2s;
            outline: none;
        }
        .input-text-style:focus { 
            border-color: var(--accent-color); 
        }

        .card-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .status-box {
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        .status-info { background: rgba(79, 70, 229, 0.1); color: #818cf8; border: 1px solid rgba(79, 70, 229, 0.2); }
        .status-allowed { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .status-blocked { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-6 md:p-12 items-center justify-center">

    <div class="max-w-xl w-full flex flex-col gap-6">
        
        <div class="flex items-center justify-between mb-2">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight">URL Tester</h1>
                <p class="text-xs text-gray-500">Check if a site is restricted by Securly in real-time.</p>
            </div>
            <a href="/logged-in/dashboard.html" class="btn-toolbar-style">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>

        <div class="card-box flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label class="text-[10px] uppercase font-black tracking-widest text-indigo-400">Target URL</label>
                <input id="url-input" type="text" class="input-text-style" placeholder="example.com" autofocus>
            </div>

            <div class="flex flex-col gap-1.5 opacity-50 pointer-events-none" id="email-container">
                <label class="text-[10px] uppercase font-black tracking-widest text-indigo-400">Authenticated Email</label>
                <input id="email-input" type="text" class="input-text-style" readonly placeholder="Detecting user...">
            </div>

            <button id="check-btn" class="btn-toolbar-style btn-primary-override w-full py-4 mt-2 font-black text-xs uppercase tracking-widest">
                <i class="fa-solid fa-search"></i> Check Status
            </button>

            <div id="result-box" class="hidden status-box"></div>
        </div>

        <div class="px-4">
            <p class="text-[10px] text-center text-gray-600 leading-relaxed uppercase tracking-widest font-bold">
                This tool simulates a Securly broker request using your current session identity.
            </p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { firebaseConfig } from "/firebase-config.js";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const emailInput = document.getElementById('email-input');
        const urlInput = document.getElementById('url-input');
        const checkBtn = document.getElementById('check-btn');
        const resultBox = document.getElementById('result-box');
        const SECURLY_SERVER = 'https://www.securly.com';

        const handleUser = (user) => {
            if (user && user.email) {
                emailInput.value = user.email;
                document.getElementById('email-container').classList.remove('opacity-50');
            }
        };

        const runAuth = async () => {
            const waitForSupabase = () => {
                return new Promise((resolve) => {
                    if (window.supabase) resolve(window.supabase);
                    const interval = setInterval(() => {
                        if (window.supabase) {
                            clearInterval(interval);
                            resolve(window.supabase);
                        }
                    }, 50);
                });
            };

            const supabase = await waitForSupabase();
            const { data: { session } } = await supabase.auth.getSession();
            
            if (session) {
                handleUser(session.user);
            } else {
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        handleUser(user);
                    } else {
                        // Dashboard-style check: only if BOTH fail
                        const { data: { session: s2 } } = await supabase.auth.getSession();
                        if (!s2) {
                            console.warn("Securly Tester: No session found, but navigation.js handles redirect.");
                        }
                    }
                });
            }
        };

        runAuth();

        async function checkStatus() {
            const rawUrl = urlInput.value.trim();
            const userEmail = emailInput.value.trim();

            if (!rawUrl) { alert("Please enter a URL."); return; }
            if (!userEmail || userEmail.includes('...')) { alert("Identity detection failed. Please log in."); return; }
            
            let targetUrl = rawUrl;
            if (!targetUrl.startsWith('http')) targetUrl = 'https://' + targetUrl;
            urlInput.value = targetUrl;

            checkBtn.disabled = true;
            checkBtn.innerHTML = '<i class="fa-solid fa-spinner loading-spinner"></i> Checking...';
            resultBox.classList.remove('hidden');
            resultBox.className = 'status-box status-info';
            resultBox.innerHTML = 'Connecting to Securly...';

            try {
                let hostname;
                try { hostname = new URL(targetUrl).hostname; } catch(e) { hostname = targetUrl; }

                const securlyUrl = `${SECURLY_SERVER}/crextn/broker?useremail=${encodeURIComponent(userEmail)}&reason=crextn&host=${encodeURIComponent(hostname)}&url=${btoa(targetUrl)}&msg=&ver=2.97.13&cu=${encodeURIComponent(SECURLY_SERVER + "/crextn")}&uf=1&cf=1`;
                const proxyUrl = getProxyUrl(securlyUrl);

                const response = await fetch(proxyUrl);
                const text = await response.text();

                if (text.includes('DENY')) {
                    resultBox.className = 'status-box status-blocked';
                    resultBox.innerHTML = '<i class="fa-solid fa-ban mr-2"></i> BLOCKED (DENY)';
                } else {
                    resultBox.className = 'status-box status-allowed';
                    resultBox.innerHTML = '<i class="fa-solid fa-check-circle mr-2"></i> ALLOWED';
                }
            } catch (err) {
                console.error(err);
                resultBox.className = 'status-box status-blocked';
                resultBox.innerHTML = '<i class="fa-solid fa-exclamation-triangle mr-2"></i> NETWORK ERROR';
            } finally {
                checkBtn.disabled = false;
                checkBtn.innerHTML = '<i class="fa-solid fa-search"></i> Check Status';
            }
        }

        checkBtn.onclick = checkStatus;
        urlInput.onkeypress = (e) => { if (e.key === 'Enter') checkStatus(); };
    </script>
</body>
</html>
