<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - VERN</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../injector.js"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #000);
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: var(--bg-page);
        }
        
        /* The injector/navigation adds padding-top: 64px to body.
           We need to ensure the page content fills the remaining space. */
        
        body {
            display: flex;
            flex-direction: column;
        }

        #page-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div id="page-content" style="display: none;">
        <iframe id="proxy-frame" src="../VERN/vern.html" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { checkAdminStatus } from "../utils.js";

        const pageContent = document.getElementById('page-content');
        const proxyFrame = document.getElementById('proxy-frame');

        // Handle URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const targetUrl = urlParams.get('url') || urlParams.get('q');
        if (targetUrl) {
            proxyFrame.src = `../VERN/vern.html?url=${encodeURIComponent(targetUrl)}`;
        }

        async function checkSession() {
            if (!window.supabase) {
                console.warn("Vern: Supabase not ready, waiting...");
                setTimeout(checkSession, 100);
                return;
            }

            pageContent.style.display = 'flex';
        }

        // Listen for auth changes
        if (window.supabase) {
            window.supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    window.location.href = '../authentication.html';
                } else if (session) {
                    pageContent.style.display = 'flex';
                }
            });
        }

        checkSession();
    </script>
</body>
</html>
