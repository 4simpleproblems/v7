<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - VELIUM</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="../injector.js"></script>

    <style>
        :root {
            --bg-page: var(--bg-primary, #000);
        }
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: var(--bg-page);
        }
        
        /* The injector/navigation adds padding-top: 64px to body.
           We need to ensure the page content fills the remaining space. */
        
        body {
            display: flex;
            flex-direction: column;
        }

        #page-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div id="page-content" style="display: none;">
        <iframe src="../VELIUM/index.html" allowfullscreen></iframe>
    </div>

    <script type="module">
        import { checkAdminStatus } from "../utils.js";

        // Supabase client is initialized by injector.js and available as window.supabase
        const pageContent = document.getElementById('page-content');

        async function checkSession() {
            if (!window.supabase) {
                console.warn("Velium: Supabase not ready, waiting...");
                setTimeout(checkSession, 100);
                return;
            }

            const { data: { session } } = await window.supabase.auth.getSession();
            
            if (session) {
                pageContent.style.display = 'flex';
            } else {
                window.location.href = '../authentication.html';
            }
        }

        // Listen for auth changes
        if (window.supabase) {
            window.supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_OUT') {
                    window.location.href = '../authentication.html';
                } else if (session) {
                    pageContent.style.display = 'flex';
                }
            });
        }

        checkSession();
    </script>
</body>
</html>
