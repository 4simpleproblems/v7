<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIOBIUM - ANALYTICS V2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #050505;
            --bg-card: #0a0a0a;
            --accent: #4f46e5;
            --border: #1a1a1a;
        }
        body { 
            font-family: 'Geist', sans-serif; 
            background: var(--bg-page); 
            color: #fff; 
            font-size: 13px;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Layout Containers */
        #list-view { display: block; }
        #grid-view { display: none; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        
        /* Dense Table Style */
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { 
            text-align: left; padding: 8px; border-bottom: 1px solid var(--border);
            text-transform: uppercase; font-size: 10px; letter-spacing: 0.1em; color: #444;
        }
        .data-table td { padding: 6px 8px; border-bottom: 1px solid #0f0f0f; vertical-align: middle; }
        .data-table tr:hover { background: rgba(255,255,255,0.02); }

        /* Grid Card Style */
        .grid-card {
            background: #0d0d0d; border: 1px solid var(--border); border-radius: 12px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
            transition: all 0.2s;
        }
        .grid-card:hover { border-color: #333; transform: translateY(-2px); }

        /* Visual Table Connections */
        .schema-viz {
            display: flex; gap: 40px; padding: 20px; overflow-x: auto;
            background: radial-gradient(circle at 50% 50%, #111 0%, #050505 100%);
            border-bottom: 1px solid var(--border);
        }
        .table-node {
            background: #0f0f0f; border: 1px solid #333; border-radius: 8px;
            width: 180px; flex-shrink: 0; position: relative; z-index: 2;
        }
        .node-header { background: #1a1a1a; padding: 6px 10px; font-weight: bold; font-size: 11px; border-radius: 8px 8px 0 0; }
        .node-field { padding: 4px 10px; font-size: 10px; color: #888; display: flex; justify-content: space-between; }
        .connector {
            position: absolute; width: 40px; height: 1px; background: var(--accent);
            right: -40px; top: 50%; opacity: 0.4; z-index: 1;
        }

        /* Search & Controls */
        .search-container {
            background: #0d0d0d; border: 1px solid var(--border);
            border-radius: 12px; padding: 8px 16px; display: flex; align-items: center; gap: 12px;
        }
        .search-input { background: transparent; border: none; outline: none; width: 100%; color: #fff; font-size: 14px; }
        
        .btn-niobium {
            background: #0d0d0d; border: 1px solid var(--border); border-radius: 8px;
            color: #888; padding: 6px 12px; cursor: pointer; transition: all 0.2s;
        }
        .btn-niobium:hover, .btn-niobium.active { border-color: var(--accent); color: #fff; }

        .pfp-micro { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; }
        .pfp-medium { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); object-fit: cover; }
        
        .status-badge { padding: 2px 6px; border-radius: 99px; font-size: 8px; font-weight: 800; letter-spacing: 0.05em; }
        .badge-admin { background: rgba(79,70,229,0.2); color: #818cf8; border: 1px solid rgba(79,70,229,0.3); }
        .badge-user { background: rgba(255,255,255,0.05); color: #888; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="custom-scroll">

    <div class="grid grid-cols-5 gap-0 border-b border-[#1a1a1a]">
        <div class="p-4 border-r border-[#1a1a1a]">
            <p class="text-[9px] uppercase tracking-widest text-gray-500">Total Network Time</p>
            <h4 id="stat-total-time" class="text-xl font-light mono">0h</h4>
        </div>
        <div class="p-4 border-r border-[#1a1a1a]">
            <p class="text-[9px] uppercase tracking-widest text-gray-500">Average Session</p>
            <h4 id="stat-avg-time" class="text-xl font-light mono">0m</h4>
        </div>
        <div class="p-4 border-r border-[#1a1a1a]">
            <p class="text-[9px] uppercase tracking-widest text-gray-500">Most Followed</p>
            <h4 id="stat-most-followed" class="text-xl font-light text-indigo-400">---</h4>
        </div>
        <div class="p-4 border-r border-[#1a1a1a]">
            <p class="text-[9px] uppercase tracking-widest text-gray-500">First Citizen</p>
            <h4 id="stat-first-user" class="text-xl font-light text-gray-300">---</h4>
        </div>
        <div class="p-4 relative">
            <p class="text-[9px] uppercase tracking-widest text-gray-500">Global Roster</p>
            <h4 id="stat-count" class="text-xl font-light mono">0</h4>
            <div id="loading-spinner" class="absolute top-4 right-4 text-indigo-500 hidden">
                <i class="fas fa-spinner fa-spin"></i>
            </div>
        </div>
    </div>

    <div class="schema-viz">
        <div class="table-node">
            <div class="node-header text-indigo-400">profiles</div>
            <div class="node-field">id <span class="mono">uuid</span></div>
            <div class="node-field">username <span class="mono">text</span></div>
            <div class="node-field">total_v6_time <span class="mono">int</span></div>
            <div class="connector"></div>
        </div>
        <div class="table-node">
            <div class="node-header text-orange-400">daily_photos</div>
            <div class="node-field">id <span class="mono">uuid</span></div>
            <div class="node-field">creator_uid <span class="mono">uuid</span></div>
            <div class="node-field">hearts <span class="mono">uuid[]</span></div>
            <div class="connector" style="width: 20px; right: -20px;"></div>
        </div>
        <div class="table-node">
            <div class="node-header text-green-400">follows</div>
            <div class="node-field">follower_id <span class="mono">uuid</span></div>
            <div class="node-field">following_id <span class="mono">uuid</span></div>
        </div>
    </div>

    <div class="p-6">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div class="search-container w-full md:w-1/2">
                <i class="fas fa-search text-gray-600"></i>
                <input type="text" id="master-search" class="search-input" placeholder="Search... try 'is:admin', 'is:following', or 'time>1000'">
            </div>
            <div class="flex gap-2">
                <button id="btn-grid" onclick="setLayout('grid')" class="btn-niobium"><i class="fas fa-th-large"></i></button>
                <button id="btn-list" onclick="setLayout('list')" class="btn-niobium active"><i class="fas fa-list"></i></button>
            </div>
        </div>

        <div id="list-view" class="overflow-x-auto border border-[#1a1a1a] rounded-xl bg-[#0a0a0a]">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>UID</th>
                        <th>Time</th>
                        <th>Role</th>
                        <th>Joined</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="user-rows"></tbody>
            </table>
        </div>

        <div id="grid-view" class="grid"></div>
    </div>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";
        import { supabaseConfig } from '/supabase-config.js';

        const supabase = createClient(supabaseConfig.url, supabaseConfig.anonKey);
        
        let allUsers = [];
        let currentFilteredUsers = [];
        let myFollowing = new Set();
        let currentLayout = 'list';

        async function init() {
            document.getElementById('loading-spinner').classList.remove('hidden');

            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return alert("Must be logged in.");

            const { data: profile } = await supabase.from('profiles').select('is_admin, email').eq('id', user.id).single();
            
            if (profile?.email !== '4simpleproblems@gmail.com' && !profile?.is_admin) {
                document.body.innerHTML = "<div class='p-20 text-center text-red-500 font-mono text-xl'>UNAUTHORIZED ACCESS: SECURITY EXCEPTION</div>";
                return;
            }

            // Fetch who the admin follows for the "is:following" search tag
            const { data: follows } = await supabase.from('follows').select('following_id').eq('follower_id', user.id);
            if (follows) follows.forEach(f => myFollowing.add(f.following_id));

            await loadStats();
            await loadUsers();
            
            document.getElementById('loading-spinner').classList.add('hidden');
        }

        async function loadStats() {
            const { data } = await supabase.from('analytics_v2_summary').select('*').single();
            if (data) {
                document.getElementById('stat-total-time').innerText = Math.floor((data.global_total_time || 0) / 3600) + 'h';
                document.getElementById('stat-avg-time').innerText = Math.floor((data.global_avg_time || 0) / 60) + 'm';
                document.getElementById('stat-most-followed').innerText = data.most_followed_user ? '@' + data.most_followed_user : '---';
                document.getElementById('stat-first-user').innerText = data.first_user ? '@' + data.first_user : '---';
                document.getElementById('stat-count').innerText = data.total_user_count || 0;
            }
        }

        async function loadUsers() {
            const { data } = await supabase.from('profiles').select('*').order('created_at', { ascending: false });
            allUsers = data || [];
            currentFilteredUsers = [...allUsers];
            render();
        }

        function getAvatar(u) {
            if (u.avatar_url) return u.avatar_url;
            return `https://ui-avatars.com/api/?name=${u.username || 'U'}&background=${(u.pfp_letter_bg || '#333').replace('#','')}&color=fff`;
        }

        function render() {
            if (currentLayout === 'list') {
                document.getElementById('list-view').style.display = 'block';
                document.getElementById('grid-view').style.display = 'none';
                
                const tbody = document.getElementById('user-rows');
                tbody.innerHTML = currentFilteredUsers.map(u => `
                    <tr>
                        <td>
                            <div class="flex items-center gap-3">
                                <img src="${getAvatar(u)}" class="pfp-micro">
                                <span class="font-medium">${u.display_name || u.username}</span>
                                <span class="text-[10px] text-gray-500 mono">@${u.username}</span>
                            </div>
                        </td>
                        <td class="mono text-[10px] text-gray-500">${u.id.substring(0,8)}...</td>
                        <td class="mono">${u.total_v6_time || 0}s</td>
                        <td>
                            <span class="status-badge ${u.is_admin ? 'badge-admin' : 'badge-user'}">
                                ${u.is_admin ? 'ADMIN' : 'USER'}
                            </span>
                        </td>
                        <td class="text-gray-500 text-[10px]">${new Date(u.created_at).toLocaleDateString()}</td>
                        <td>
                            <button class="text-gray-600 hover:text-white" onclick="window.open('/logged-in/@${u.username}', '_blank')">
                                <i class="fas fa-external-link-alt"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            } else {
                document.getElementById('list-view').style.display = 'none';
                document.getElementById('grid-view').style.display = 'grid';
                
                const grid = document.getElementById('grid-view');
                grid.innerHTML = currentFilteredUsers.map(u => `
                    <div class="grid-card">
                        <div class="flex justify-between items-start">
                            <img src="${getAvatar(u)}" class="pfp-medium">
                            <span class="status-badge ${u.is_admin ? 'badge-admin' : 'badge-user'}">
                                ${u.is_admin ? 'ADMIN' : 'USER'}
                            </span>
                        </div>
                        <div class="mt-2">
                            <p class="font-bold truncate">${u.display_name || u.username}</p>
                            <p class="text-[10px] text-gray-500 mono truncate">@${u.username}</p>
                        </div>
                        <div class="mt-auto pt-3 border-t border-[#1a1a1a] flex justify-between text-[10px] mono text-gray-400">
                            <span><i class="fas fa-clock mr-1"></i>${Math.floor((u.total_v6_time||0)/60)}m</span>
                            <button onclick="window.open('/logged-in/@${u.username}', '_blank')" class="hover:text-white"><i class="fas fa-arrow-right"></i></button>
                        </div>
                    </div>
                `).join('');
            }
        }

        window.setLayout = (mode) => {
            currentLayout = mode;
            document.getElementById('btn-grid').classList.toggle('active', mode === 'grid');
            document.getElementById('btn-list').classList.toggle('active', mode === 'list');
            render();
        };

        // Custom Query Parser
        document.getElementById('master-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            
            currentFilteredUsers = allUsers.filter(u => {
                let match = true;
                
                // Parse commands
                if (term.includes('is:admin') && !u.is_admin) match = false;
                if (term.includes('is:following') && !myFollowing.has(u.id)) match = false;
                
                // Parse time logic (e.g. time>3600)
                const timeMatch = term.match(/time>(\d+)/);
                if (timeMatch && (u.total_v6_time || 0) <= parseInt(timeMatch[1])) match = false;

                // Strip commands to check text
                const textOnly = term.replace(/is:\w+/g, '').replace(/time>\d+/g, '').trim();
                
                if (textOnly && match) {
                    const searchStr = `${u.username} ${u.display_name} ${u.id}`.toLowerCase();
                    if (!searchStr.includes(textOnly)) match = false;
                }
                
                return match;
            });
            render();
        });

        init();
    </script>
</body>
</html>
