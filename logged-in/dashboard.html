<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - DASHBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: #040404;
            --bg-container: #0a0a0a;
            --border-color: rgba(255,255,255,0.08);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --accent-color: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.3);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- BENTO GRID LAYOUT --- */
        #page-content {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 1.25rem;
            padding: 2rem 1.5rem; /* Reduced padding, removed side limits */
            width: 100%;
            height: calc(100vh - 64px);
            box-sizing: border-box;
        }

        .bento-card {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.25rem;
            position: relative;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bento-card:hover {
            border-color: rgba(255,255,255,0.15);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* --- SPECIFIC SLOTS --- */
        #hero-slot {
            grid-column: span 7;
            grid-row: span 5;
            background: transparent;
            border: none;
            padding-left: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #hero-slot:hover { transform: none; box-shadow: none; }

        #weather-slot {
            grid-column: span 5;
            grid-row: span 5;
            background: linear-gradient(135deg, rgba(20,20,20,0.8) 0%, rgba(10,10,10,0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #stats-slot-1 { grid-column: span 3; grid-row: span 3; }
        #stats-slot-2 { grid-column: span 4; grid-row: span 3; }
        
        #quick-access-slot {
            grid-column: span 5;
            grid-row: span 7;
            display: flex;
            flex-direction: column;
        }

        #analytics-summary-slot {
            grid-column: span 7;
            grid-row: span 4;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        /* --- TYPOGRAPHY --- */
        .time-text {
            font-size: 5rem;
            font-weight: 200;
            line-height: 1;
            letter-spacing: -0.02em;
            color: #fff;
        }
        .date-text {
            font-size: 1.1rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 0.5rem;
        }
        .welcome-text {
            font-size: 1.75rem;
            font-weight: 300;
            margin-top: 1.5rem;
        }

        .card-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            font-weight: 600;
        }

        .stat-huge {
            font-size: 2.25rem;
            font-weight: 500;
            color: #fff;
            line-height: 1.1;
        }

        /* --- RECENT PAGES --- */
        .recent-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 0.75rem;
        }
        .recent-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            transition: all 0.2s;
            margin-bottom: 0.5rem;
            cursor: pointer;
        }
        .recent-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-color);
            transform: translateX(4px);
        }
        .recent-item.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        .recent-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        /* --- WEATHER --- */
        .weather-temp-main { font-size: 3rem; font-weight: 500; color: #fff; }
        .weather-info-box { text-align: right; }
        
        #weather-loader {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            color: var(--accent-color);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #weather-loader.loading { opacity: 1; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>

<body>
    <div id="page-content">
        <!-- HERO SLOT -->
        <div id="hero-slot" class="bento-card">
            <div id="clock-date" class="date-text">--------</div>
            <div id="clock-time" class="time-text">00:00</div>
            <h2 class="welcome-text">Hey, <span id="user-name-display" class="text-indigo-400 font-medium">User</span>.</h2>
            <p class="text-gray-500 mt-1 text-sm font-normal">Welcome to 4SP V6.</p>
        </div>

        <!-- WEATHER SLOT -->
        <div id="weather-slot" class="bento-card">
            <div id="weather-loader"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
            <div class="flex flex-col">
                <div class="card-label">Local Weather</div>
                <div id="w-temp" class="weather-temp-main">--°</div>
                <div id="w-desc" class="text-sm text-gray-400 capitalize">Loading...</div>
            </div>
            <div class="weather-info-box">
                <div id="w-icon" class="text-5xl text-gray-300 mb-2"><i class="fa-solid fa-cloud"></i></div>
                <div class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                    H: <span id="w-high">--°</span> | L: <span id="w-low">--°</span>
                </div>
            </div>
        </div>

        <!-- STATS 1 -->
        <div id="stats-slot-1" class="bento-card flex flex-col justify-between">
            <div class="card-label">Total Time</div>
            <div id="stat-total-time" class="stat-huge">0h 0m</div>
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">Active in V6</div>
        </div>

        <!-- STATS 2 -->
        <div id="stats-slot-2" class="bento-card flex flex-col justify-between">
            <div class="card-label">Sessions</div>
            <div id="stat-sessions" class="stat-huge">0</div>
            <div class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">Total Logins</div>
        </div>

        <!-- QUICK ACCESS -->
        <div id="quick-access-slot" class="bento-card">
            <div class="flex justify-between items-center mb-2">
                <div class="card-label mb-0">Recently Viewed (V6)</div>
                <i class="fa-solid fa-clock-rotate-left text-gray-700 text-xs"></i>
            </div>
            <div id="recent-pages-list" class="recent-list custom-scroll">
                <div class="py-10 text-center text-gray-600 italic text-sm">Waiting for data...</div>
            </div>
        </div>

        <!-- ANALYTICS SUMMARY -->
        <div id="analytics-summary-slot" class="bento-card bg-indigo-500/5 border-indigo-500/20">
            <div class="flex flex-col justify-center border-r border-white/5 pr-4">
                <div class="card-label text-indigo-400">Top Page</div>
                <div id="stat-most-viewed" class="text-lg font-medium text-white truncate">None yet</div>
                <div id="stat-browser" class="text-[9px] text-indigo-300/40 mt-1 uppercase tracking-tighter">Unknown Browser</div>
            </div>
            <div class="flex flex-col justify-center border-r border-white/5 px-4">
                <div class="card-label text-indigo-400">Page Views</div>
                <div id="stat-pageviews" class="text-3xl font-medium text-white">0</div>
                <div id="stat-os" class="text-[9px] text-indigo-300/40 mt-1 uppercase tracking-tighter">Unknown OS</div>
            </div>
            <div class="flex flex-col justify-center pl-4">
                <div class="card-label text-indigo-400">Device Origin</div>
                <div id="stat-device" class="text-sm font-medium text-white truncate">Detecting...</div>
                <div class="text-[9px] text-indigo-300/40 mt-1 uppercase tracking-tighter">Project Niobium</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from '../firebase-config.js';

        const PAGE_NAME_LOOKUP = {
            'dashboard.html': 'Dashboard',
            'soundboard.html': 'Soundboard',
            'notes.html': 'Notes',
            'dailyphoto.html': 'Dailyphoto',
            'countdowns.html': 'Countdowns',
            'weather.html': 'Weather',
            'dictionary.html': 'Dictionary',
            'schedule.html': 'Schedule',
            'messenger-tutorial.html': 'Messenger',
            'games.html': 'Games',
            'vana.html': 'Vana',
            'vora.html': 'Vora',
            'vern.html': 'Vern',
            'velium.html': 'Velium',
            'securly-tester.html': 'Securly Tester',
            'settings.html': 'Settings',
            'profile.html': 'Profile'
        };

        const getCleanTitle = (path, originalTitle) => {
            const fileName = path.split('/').pop().split('?')[0];
            if (PAGE_NAME_LOOKUP[fileName]) return PAGE_NAME_LOOKUP[fileName];
            if (originalTitle && !originalTitle.includes('VERSION 5 CLIENT')) return originalTitle;
            return fileName.replace('.html', '').charAt(0).toUpperCase() + fileName.replace('.html', '').slice(1);
        };

        const parseUA = (ua) => {
            if (!ua) return { browser: 'Unknown', os: 'Unknown' };
            let browser = 'Other', os = 'Other';
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac OS')) os = 'macOS';
            else if (ua.includes('CrOS')) os = 'ChromeOS';
            else if (ua.includes('Linux')) os = 'Linux';
            return { browser, os };
        };

        const checkFirebase = setInterval(() => {
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                clearInterval(checkFirebase);
                initDashboard();
            }
        }, 100);

        async function initDashboard() {
            const db = firebase.firestore();
            const auth = firebase.auth();

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        document.getElementById('user-name-display').textContent = userDoc.data().displayName || userDoc.data().username || "User";
                    }
                    loadAnalytics(user.uid);
                } else if (!window._LOCAL_MODE) {
                    window.location.replace('../index.html');
                }
            });

            startClock();
            loadWeather();
        }

        async function loadAnalytics(uid) {
            const db = firebase.firestore();
            // Filter by Project Niobium version tag
            const snap = await db.collection('analytics')
                .where('userId', '==', uid)
                .where('version', '==', 'project_niobium')
                .get();
            
            if (snap.empty) return;

            let totalTime = 0;
            let totalPageViews = 0;
            let pageMap = {}; 
            let browsers = {};
            let systems = {};

            snap.forEach(doc => {
                const data = doc.data();
                totalTime += (data.duration || 0);
                totalPageViews += (data.pageCount || 0);
                
                const ua = parseUA(data.userAgent);
                browsers[ua.browser] = (browsers[ua.browser] || 0) + 1;
                systems[ua.os] = (systems[ua.os] || 0) + 1;

                if (data.visitedPages) {
                    data.visitedPages.forEach(p => {
                        const path = p.path || p.url;
                        if (!path || path === 'about:srcdoc') return;
                        
                        // Filter for V6 pages only (those in our lookup or starting with /logged-in)
                        const fileName = path.split('/').pop().split('?')[0];
                        const isV6 = PAGE_NAME_LOOKUP[fileName] || path.includes('/logged-in/');
                        if (!isV6) return;

                        const cleanTitle = getCleanTitle(path, p.title);
                        if (!pageMap[path]) pageMap[path] = { title: cleanTitle, count: 0 };
                        pageMap[path].count++;
                    });
                }
            });

            const sortedPages = Object.entries(pageMap).sort((a, b) => b[1].count - a[1].count);
            if (sortedPages.length > 0) {
                document.getElementById('stat-most-viewed').textContent = sortedPages[0][1].title;
            }

            const topBrowser = Object.entries(browsers).sort((a,b) => b[1]-a[1])[0]?.[0] || 'Unknown';
            const topOS = Object.entries(systems).sort((a,b) => b[1]-a[1])[0]?.[0] || 'Unknown';
            document.getElementById('stat-browser').textContent = topBrowser;
            document.getElementById('stat-os').textContent = topOS;
            document.getElementById('stat-device').textContent = window._LOCAL_MODE ? 'Version 5 Client' : 'Web Browser';

            const hours = Math.floor(totalTime / 3600);
            const minutes = Math.floor((totalTime % 3600) / 60);
            document.getElementById('stat-total-time').textContent = `${hours}h ${minutes}m`;
            document.getElementById('stat-sessions').textContent = snap.size;
            document.getElementById('stat-pageviews').textContent = totalPageViews;

            const listEl = document.getElementById('recent-pages-list');
            listEl.innerHTML = '';
            
            const isLocalClient = window._LOCAL_MODE;
            const currentOrigin = window.location.origin;

            sortedPages.slice(0, 10).forEach(([path, data]) => {
                const item = document.createElement('div');
                item.className = 'recent-item';
                
                const isLocalPath = path.startsWith('file://') || (path.startsWith('/') && !path.startsWith('/logged-in') && !path.includes('.vercel.app')) || path.includes('4simpleproblems_v5_latest.html');

                let isClickable = true;
                if (isLocalPath) {
                    if (!isLocalClient || !currentOrigin.includes('file')) isClickable = false;
                }

                if (!isClickable) item.classList.add('disabled');

                item.innerHTML = `
                    <div class="recent-icon">
                        <i class="fa-solid fa-${isLocalPath ? 'hdd' : 'file-alt'}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate">${data.title}</p>
                        <p class="text-[9px] text-gray-500 uppercase tracking-widest">${data.count} views</p>
                    </div>
                `;

                if (isClickable) {
                    item.onclick = () => {
                        if (isLocalPath) {
                            let target = path;
                            if (!target.startsWith('file://')) target = 'file://' + target;
                            window.location.href = target;
                        } else if (window.parent && window.parent.loadPage) {
                            window.parent.loadPage(path);
                        } else if (window.loadPage) {
                            window.loadPage(path);
                        } else {
                            window.location.href = path;
                        }
                    };
                }

                listEl.appendChild(item);
            });
        }

        function startClock() {
            const update = () => {
                const now = new Date();
                document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            };
            update();
            setInterval(update, 1000);
        }

        async function loadWeather() {
            const loader = document.getElementById('weather-loader');
            loader.classList.add('loading');
            try {
                const locRes = await fetch('https://ipwho.is/');
                const locData = await locRes.json();
                const lat = locData.latitude;
                const lon = locData.longitude;

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('w-temp').textContent = `${Math.round(data.current.temperature_2m)}°`;
                document.getElementById('w-high').textContent = `${Math.round(data.daily.temperature_2m_max[0])}°`;
                document.getElementById('w-low').textContent = `${Math.round(data.daily.temperature_2m_min[0])}°`;
                
                const code = data.current.weather_code;
                let icon = 'fa-cloud';
                let desc = 'Cloudy';
                if (code === 0) { icon = 'fa-sun'; desc = 'Clear Sky'; }
                else if (code < 3) { icon = 'fa-cloud-sun'; desc = 'Partly Cloudy'; }
                else if (code < 50) { icon = 'fa-cloud'; desc = 'Overcast'; }
                else if (code < 70) { icon = 'fa-cloud-rain'; desc = 'Rain'; }
                else if (code < 80) { icon = 'fa-snowflake'; desc = 'Snow'; }
                
                document.getElementById('w-icon').innerHTML = `<i class="fa-solid ${icon}"></i>`;
                document.getElementById('w-desc').textContent = desc;

            } catch(e) { console.error("Weather load fail", e); }
            loader.classList.remove('loading');
        }
    </script>
</body>
</html>
