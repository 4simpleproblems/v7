<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - DASHBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: #040404;
            --bg-container: #000000;
            --border-color: #333;
            --text-primary: #c0c0c0;
            --text-light-grey: #d1d5db;
            --accent-color: #6366f1;
            --text-link: #888;
            --spinner-color: #666666;
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1, h2, h3, .font-bold, .font-semibold, strong, .tracking-widest {
            font-weight: 400 !important;
        }

        #page-content {
            flex-grow: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1.5rem;
            padding: 3rem;
            position: relative;
        }

        .dashboard-widget {
            border: 1px solid var(--border-color);
            background-color: var(--bg-container);
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            border-radius: 28px;
            position: relative;
            overflow: hidden;
        }

        #main-widget {
            border: none !important;
            background: transparent !important;
            box-shadow: none !important;
            padding-left: 0 !important;
        }

        .dashboard-widget:not(#main-widget):hover {
            border-color: #505050;
            transform: translateY(-2px);
        }

        /* --- CLOCK STYLES --- */
        .time-display {
            font-size: 4rem; 
            color: var(--text-light-grey);
            white-space: nowrap;
            line-height: 1;
        }
        .date-display {
            font-size: 1rem;
            color: var(--text-link);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .analytics-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-color);
            margin-bottom: 0.75rem;
            font-weight: 600 !important;
        }

        .stat-label { font-size: 0.75rem; color: #666; }
        .stat-value { font-size: 1.1rem; color: #fff; font-weight: 500 !important; }

        .page-link-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid #1a1a1a;
            border-radius: 14px;
            transition: all 0.2s;
            cursor: pointer;
            margin-bottom: 0.4rem;
        }
        .page-link-item:hover {
            background: rgba(255,255,255,0.06);
            border-color: var(--accent-color);
        }
        .page-link-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        #weather-loader {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: var(--spinner-color); 
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #weather-loader.loading { opacity: 1; }
    </style>
</head>

<body>
    <div id="page-content">
        <!-- TOP LEFT: Main Widget (Clock + Welcome) -->
        <div id="main-widget" class="dashboard-widget flex flex-col justify-center">
            <div id="clock-time" class="time-display">--:--</div>
            <div id="clock-date" class="date-display">--------</div>
            <div class="mt-6">
                <h2 class="text-2xl text-white font-light">Welcome back, <span id="user-name-display" class="text-indigo-400">User</span></h2>
                <p class="text-sm text-gray-500 mt-1">4SP V6 — Your Personal Workspace</p>
            </div>
        </div>

        <!-- TOP RIGHT: Weather -->
        <div id="weather-widget" class="dashboard-widget flex flex-col justify-center">
            <div class="flex items-center gap-6">
                <div id="w-icon" class="text-5xl text-gray-400"><i class="fa-solid fa-cloud"></i></div>
                <div>
                    <div id="w-temp" class="text-5xl text-white">--°</div>
                    <div class="stat-label uppercase tracking-widest mt-1">Current Weather</div>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4 mt-6">
                <div>
                    <p class="stat-label">High / Low</p>
                    <p class="text-sm"><span id="w-high">--°</span> / <span id="w-low">--°</span></p>
                </div>
                <div>
                    <p class="stat-label">Wind Speed</p>
                    <p id="w-wind-speed" class="text-sm">-- mph</p>
                </div>
            </div>
            <div id="weather-loader"><i class="fa-solid fa-circle-notch fa-spin"></i></div>
        </div>

        <!-- BOTTOM LEFT: Analytics -->
        <div id="analytics-widget" class="dashboard-widget">
            <h3 class="analytics-title">User Analytics</h3>
            <div class="space-y-4">
                <div>
                    <p class="stat-label">Most Viewed Page</p>
                    <p id="stat-most-viewed" class="stat-value">Loading...</p>
                </div>
                <div>
                    <p class="stat-label">Total Time Spent</p>
                    <p id="stat-total-time" class="stat-value">--h --m</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <p class="stat-label">Sessions</p>
                        <p id="stat-sessions" class="text-white">--</p>
                    </div>
                    <div>
                        <p class="stat-label">Page Views</p>
                        <p id="stat-pageviews" class="text-white">--</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM RIGHT: Quick Access -->
        <div id="quick-access-widget" class="dashboard-widget overflow-y-auto custom-scroll">
            <h3 class="analytics-title">Recently Viewed</h3>
            <div id="recent-pages-list" class="flex flex-col gap-2">
                <p class="text-sm text-gray-600 italic">No activity data found yet.</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from '../firebase-config.js';

        const PAGE_NAME_LOOKUP = {
            'dashboard.html': 'Dashboard',
            'soundboard.html': 'Soundboard',
            'notes.html': 'Notes',
            'dailyphoto.html': 'Dailyphoto',
            'countdowns.html': 'Countdowns',
            'weather.html': 'Weather',
            'dictionary.html': 'Dictionary',
            'schedule.html': 'Schedule',
            'messenger-tutorial.html': 'Messenger',
            'games.html': 'Games',
            'vana.html': 'Vana',
            'vora.html': 'Vora',
            'vern.html': 'Vern',
            'velium.html': 'Velium',
            'securly-tester.html': 'Securly Tester',
            'settings.html': 'Settings'
        };

        const getCleanTitle = (path, originalTitle) => {
            const fileName = path.split('/').pop().split('?')[0];
            if (PAGE_NAME_LOOKUP[fileName]) return PAGE_NAME_LOOKUP[fileName];
            if (originalTitle && !originalTitle.includes('VERSION 5 CLIENT')) return originalTitle;
            return fileName.replace('.html', '').charAt(0).toUpperCase() + fileName.replace('.html', '').slice(1);
        };

        const checkFirebase = setInterval(() => {
            if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                clearInterval(checkFirebase);
                initDashboard();
            }
        }, 100);

        async function initDashboard() {
            const db = firebase.firestore();
            const auth = firebase.auth();

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        document.getElementById('user-name-display').textContent = userDoc.data().displayName || userDoc.data().username || "User";
                    }
                    loadAnalytics(user.uid);
                } else if (!window._LOCAL_MODE) {
                    window.location.replace('../index.html');
                }
            });

            startClock();
            loadWeather();
        }

        async function loadAnalytics(uid) {
            const db = firebase.firestore();
            const snap = await db.collection('analytics').where('userId', '==', uid).get();
            
            if (snap.empty) return;

            let totalTime = 0;
            let totalPageViews = 0;
            let pageMap = {}; 

            snap.forEach(doc => {
                const data = doc.data();
                totalTime += (data.duration || 0);
                totalPageViews += (data.pageCount || 0);
                
                if (data.visitedPages) {
                    data.visitedPages.forEach(p => {
                        const path = p.path || p.url;
                        if (!path) return;
                        const cleanTitle = getCleanTitle(path, p.title);
                        if (!pageMap[path]) pageMap[path] = { title: cleanTitle, count: 0 };
                        pageMap[path].count++;
                    });
                }
            });

            const sortedPages = Object.entries(pageMap).sort((a, b) => b[1].count - a[1].count);
            if (sortedPages.length > 0) {
                document.getElementById('stat-most-viewed').textContent = sortedPages[0][1].title;
            }

            const hours = Math.floor(totalTime / 3600);
            const minutes = Math.floor((totalTime % 3600) / 60);
            document.getElementById('stat-total-time').textContent = `${hours}h ${minutes}m`;
            document.getElementById('stat-sessions').textContent = snap.size;
            document.getElementById('stat-pageviews').textContent = totalPageViews;

            const listEl = document.getElementById('recent-pages-list');
            listEl.innerHTML = '';
            
            const isLocalClient = window._LOCAL_MODE;
            const currentOrigin = window.location.origin;

            sortedPages.slice(0, 6).forEach(([path, data]) => {
                const item = document.createElement('div');
                item.className = 'page-link-item';
                
                const isLocalPath = path.startsWith('file://') || (path.startsWith('/') && !path.startsWith('/logged-in') && !path.includes('.vercel.app'));

                let isClickable = true;
                if (isLocalPath) {
                    if (!isLocalClient || !currentOrigin.includes('file')) isClickable = false;
                }

                if (!isClickable) item.classList.add('disabled');

                item.innerHTML = `
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 flex items-center justify-center text-indigo-400">
                        <i class="fa-solid fa-${isLocalPath ? 'hdd' : 'file-alt'}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate">${data.title}</p>
                        <p class="text-[10px] text-gray-500 uppercase tracking-widest">${data.count} views</p>
                    </div>
                `;

                if (isClickable) {
                    item.onclick = () => {
                        if (isLocalPath) {
                            let target = path;
                            if (!target.startsWith('file://')) target = 'file://' + target;
                            window.location.href = target;
                        } else if (window.parent && window.parent.loadPage) {
                            window.parent.loadPage(path);
                        } else if (window.loadPage) {
                            window.loadPage(path);
                        } else {
                            window.location.href = path;
                        }
                    };
                } else {
                    item.title = "Access restricted to original device";
                }

                listEl.appendChild(item);
            });
        }

        function startClock() {
            const update = () => {
                const now = new Date();
                document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            };
            update();
            setInterval(update, 1000);
        }

        async function loadWeather() {
            const loader = document.getElementById('weather-loader');
            loader.classList.add('loading');
            try {
                const locRes = await fetch('https://freeipapi.com/api/json');
                const locData = await locRes.json();
                const lat = locData.latitude;
                const lon = locData.longitude;

                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('w-temp').textContent = `${Math.round(data.current.temperature_2m)}°`;
                document.getElementById('w-high').textContent = `${Math.round(data.daily.temperature_2m_max[0])}°`;
                document.getElementById('w-low').textContent = `${Math.round(data.daily.temperature_2m_min[0])}°`;
                
                const code = data.current.weather_code;
                let icon = 'fa-cloud';
                if (code === 0) icon = 'fa-sun';
                else if (code < 3) icon = 'fa-cloud-sun';
                else if (code < 50) icon = 'fa-cloud';
                else if (code < 70) icon = 'fa-cloud-rain';
                document.getElementById('w-icon').innerHTML = `<i class="fa-solid ${icon}"></i>`;

            } catch(e) { console.error("Weather load fail", e); }
            loader.classList.remove('loading');
        }
    </script>
</body>
</html>
