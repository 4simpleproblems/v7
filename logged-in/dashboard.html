<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SP - DASHBOARD</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="../injector.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-page: #040404;
            --bg-container: #080808;
            --border-color: rgba(255,255,255,0.05);
            --accent-color: #4f46e5;
            --accent-glow: rgba(79, 70, 229, 0.4);
        }

        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page);
            color: #fff;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #page-content {
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(12, 1fr);
            gap: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            height: calc(100vh - 64px);
            box-sizing: border-box;
        }

        .dashboard-card {
            background: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 1.75rem;
            position: relative;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dashboard-card:hover:not(.no-hover) {
            border-color: rgba(255,255,255,0.1);
            background: #0c0c0c;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* --- LAYOUT SLOTS --- */
        #welcome-section {
            grid-column: span 12;
            grid-row: span 5;
            background: transparent;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 0;
        }

        #analytics-left {
            grid-column: span 4;
            grid-row: span 7;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: transparent;
            border: none;
            padding: 0;
        }

        #quick-access-section {
            grid-column: span 8;
            grid-row: span 7;
            display: flex;
            flex-direction: column;
        }

        /* --- COMPONENTS --- */
        .time-display { font-size: 5.5rem; font-weight: 200; line-height: 1; letter-spacing: -0.04em; }
        .date-display { font-size: 1.2rem; color: #666; text-transform: uppercase; letter-spacing: 0.2em; margin-bottom: 0.5rem; }
        .welcome-msg { font-size: 2rem; font-weight: 300; margin-top: 1.5rem; color: #aaa; }

        .stat-card {
            background: #0a0a0a;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.25rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .label-tiny { font-size: 0.65rem; font-weight: 700; color: #444; text-transform: uppercase; letter-spacing: 0.15em; }
        .val-big { font-size: 1.75rem; font-weight: 500; color: #fff; margin-top: 0.25rem; }
        .val-sub { font-size: 0.7rem; color: #555; margin-top: 0.25rem; }

        .page-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-top: 1rem;
            /* Hide scrollbars and allow overflow for hover effects */
            overflow: visible;
        }

        .page-btn {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 18px;
            transition: all 0.2s;
            cursor: pointer;
            /* Ensure the button stays above others during animation */
            position: relative;
            z-index: 1;
        }
        .page-btn:hover {
            background: rgba(79, 70, 229, 0.05);
            border-color: var(--accent-color);
            transform: scale(1.05);
            z-index: 10;
        }
        .page-btn.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

        .icon-box {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 1.2rem;
        }

        .weather-row { display: flex; align-items: flex-end; justify-content: space-between; }
        .temp-text { font-size: 4rem; font-weight: 500; line-height: 1; }
        
        #weather-loader { position: absolute; top: 1.5rem; right: 1.75rem; color: var(--accent-color); opacity: 0; }
        #weather-loader.loading { opacity: 1; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>

<body>
    <div id="page-content">
        <!-- WELCOME SECTION -->
        <div id="welcome-section" class="dashboard-card no-hover">
            <div id="clock-date" class="date-display">--------</div>
            <div id="clock-time" class="time-display">00:00</div>
            <h2 class="welcome-msg">Good day, <span id="user-name-display" class="text-indigo-500">User</span>.</h2>
        </div>

        <!-- ANALYTICS LEFT -->
        <div id="analytics-left" class="dashboard-card no-hover">
            <div class="stat-card">
                <div>
                    <div class="label-tiny">Experience Time</div>
                    <div id="stat-total-time" class="val-big">0h 0m</div>
                </div>
                <div class="val-sub">Total session duration in V6</div>
            </div>
            <div class="stat-card">
                <div>
                    <div class="label-tiny">System Analytics</div>
                    <div id="stat-browser" class="text-sm font-medium text-indigo-400">Loading...</div>
                    <div id="stat-os" class="text-xs text-gray-500 mt-1">Detecting OS</div>
                </div>
                <div id="stat-device" class="text-[10px] text-gray-700 uppercase font-bold tracking-widest">Project Niobium</div>
            </div>
        </div>

        <!-- QUICK ACCESS SECTION -->
        <div id="quick-access-section" class="dashboard-card">
            <div class="flex justify-between items-center">
                <div>
                    <div class="label-tiny">Recently Accessed</div>
                    <h3 class="text-xl font-medium text-white/80 mt-1">Your V6 Pulse</h3>
                </div>
                <div id="stat-pageviews" class="text-3xl font-light text-white/20">0</div>
            </div>
            
            <div id="recent-pages-list" class="page-grid flex-grow">
                <div class="col-span-2 py-20 text-center text-gray-700 italic text-sm">Synchronizing analytics...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { firebaseConfig } from '../firebase-config.js';

        const V6_PAGES = {
            'dashboard.html': 'Dashboard',
            'soundboard.html': 'Soundboard',
            'notes.html': 'Notes',
            'dailyphoto.html': 'Dailyphoto',
            'dictionary.html': 'Dictionary',
            'schedule.html': 'Schedule',
            'messenger-tutorial.html': 'Messenger',
            'games.html': 'Games',
            'vana.html': 'Vana',
            'vora.html': 'Vora',
            'vern.html': 'Vern',
            'velium.html': 'Velium',
            'securly-tester.html': 'Securly Tester',
            'settings.html': 'Settings',
            'profile.html': 'Profile'
        };

        const getCleanTitle = (path, originalTitle) => {
            const fileName = path.split('/').pop().split('?')[0];
            if (V6_PAGES[fileName]) return V6_PAGES[fileName];
            if (originalTitle && !originalTitle.includes('VERSION 5 CLIENT')) return originalTitle;
            return fileName.replace('.html', '').charAt(0).toUpperCase() + fileName.replace('.html', '').slice(1);
        };

        const parseUA = (ua) => {
            if (!ua) return { browser: 'Browser', os: 'Operating System' };
            let browser = 'Other', os = 'Other';
            if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Safari')) browser = 'Safari';
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac OS')) os = 'macOS';
            else if (ua.includes('CrOS')) os = 'ChromeOS';
            else if (ua.includes('Linux')) os = 'Linux';
            return { browser, os };
        };

        const checkFirebase = setInterval(() => {
            if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0) {
                clearInterval(checkFirebase);
                initDashboard();
            }
        }, 100);

        async function initDashboard() {
            const db = firebase.firestore();
            const auth = firebase.auth();

            // Load page identification config
            let pageConfig = {};
            try {
                const response = await fetch('../page-identification.json');
                pageConfig = await response.json();
            } catch (e) {
                console.error("Failed to load page identification config", e);
            }

            auth.onAuthStateChanged(async (user) => {
                if (user) {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        document.getElementById('user-name-display').textContent = userDoc.data().displayName || userDoc.data().username || "User";
                    }
                    loadAnalytics(user.uid, pageConfig);
                } else if (!window._LOCAL_MODE) {
                    window.location.replace('../index.html');
                }
            });

            startClock();
        }

        async function loadAnalytics(uid, pageConfig = {}) {
            const db = firebase.firestore();
            const snap = await db.collection('analytics')
                .where('userId', '==', uid)
                .where('version', '==', 'project_niobium')
                .get();
            
            if (snap.empty) return;

            let totalTime = 0;
            let totalPageViews = 0;
            let pageMap = {}; 
            let latestUA = "";

            // Create a helper to find config by path
            const findConfigByPath = (path) => {
                const clean = (p) => p.toLowerCase().replace(/^(..\/|logged-in\/)/, '').replace('.html', '');
                const target = clean(path);
                
                for (const key in pageConfig) {
                    const page = pageConfig[key];
                    if (clean(page.url) === target) return page;
                    if (page.aliases) {
                        for (const alias of page.aliases) {
                            if (clean(alias) === target) return page;
                        }
                    }
                }
                return null;
            };

            snap.forEach(doc => {
                const data = doc.data();
                totalTime += (data.duration || 0);
                totalPageViews += (data.pageCount || 0);
                if (data.userAgent) latestUA = data.userAgent;

                if (data.visitedPages) {
                    data.visitedPages.forEach(p => {
                        const path = p.path || p.url;
                        if (!path || path.includes('srcdoc')) return;
                        
                        // Check if page exists in config
                        const config = findConfigByPath(path);
                        if (!config) return;

                        const cleanTitle = config.name;
                        const icon = config.icon || 'fa-solid fa-file-alt';
                        
                        if (!pageMap[path]) pageMap[path] = { title: cleanTitle, icon: icon, count: 0 };
                        pageMap[path].count++;
                    });
                }
            });

            const sortedPages = Object.entries(pageMap).sort((a, b) => b[1].count - a[1].count);
            
            const uaInfo = parseUA(latestUA);
            document.getElementById('stat-browser').textContent = uaInfo.browser;
            document.getElementById('stat-os').textContent = uaInfo.os;
            document.getElementById('stat-device').textContent = window._LOCAL_MODE ? 'Version 5 Client' : 'Cloud Access';

            const hours = Math.floor(totalTime / 3600);
            const minutes = Math.floor((totalTime % 3600) / 60);
            document.getElementById('stat-total-time').textContent = `${hours}h ${minutes}m`;
            document.getElementById('stat-pageviews').textContent = totalPageViews;

            const listEl = document.getElementById('recent-pages-list');
            listEl.innerHTML = '';
            
            const currentOrigin = window.location.origin;

            // Only show top 6
            sortedPages.slice(0, 6).forEach(([path, data]) => {
                const item = document.createElement('div');
                item.className = 'page-btn';
                
                item.innerHTML = `
                    <div class="icon-box">
                        <i class="${data.icon}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm font-medium text-white truncate">${data.title}</p>
                        <p class="text-[10px] text-gray-600 uppercase tracking-widest font-bold">${data.count} Sessions</p>
                    </div>
                `;

                item.onclick = () => {
                    if (window.parent && window.parent.loadPage) {
                        window.parent.loadPage(path);
                    } else if (window.loadPage) {
                        window.loadPage(path);
                    } else {
                        window.location.href = path;
                    }
                };

                listEl.appendChild(item);
            });
        }

        function startClock() {
            const update = () => {
                const now = new Date();
                document.getElementById('clock-time').textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
                document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
            };
            update();
            setInterval(update, 1000);
        }

        // --- JSONP HELPER FOR ip-api.com ---
        window.handleIpApiResponse = function(response) {
            if (response.status === "success") {
                const lat = response.lat;
                const lon = response.lon;
                document.getElementById('w-location').textContent = response.city || 'Local Node';
                fetchWeatherData(lat, lon);
            } else {
                console.error("IP API Error", response);
                fallbackLocation();
            }
        };

        async function loadWeather() {
            const loader = document.getElementById('weather-loader');
            loader.classList.add('loading');
            
            // ip-api.com via JSONP script injection
            const script = document.createElement('script');
            script.src = 'https://extreme-ip-lookup.com/json/?callback=handleIpApiResponse'; // Using another reliable one
            // Wait, extreme-ip needs keys. Let's stick to ip-api but handle protocol.
            // Since it's HTTP, we can't use it on Vercel. 
            // Let's use ipapi.co with a fallback.
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                handleIpApiResponse({ status: 'success', lat: data.latitude, lon: data.longitude, city: data.city });
            } catch (e) {
                fallbackLocation();
            }
        }

        function fallbackLocation() {
            // Default to NYC or something stable
            fetchWeatherData(40.7128, -74.0060);
            document.getElementById('w-location').textContent = 'Global Relay';
        }

        async function fetchWeatherData(lat, lon) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`;
                const res = await fetch(url);
                const data = await res.json();

                document.getElementById('w-temp').textContent = `${Math.round(data.current.temperature_2m)}°`;
                document.getElementById('w-high').textContent = `${Math.round(data.daily.temperature_2m_max[0])}°`;
                document.getElementById('w-low').textContent = `${Math.round(data.daily.temperature_2m_min[0])}°`;
                
                const code = data.current.weather_code;
                let icon = 'fa-cloud';
                let desc = 'Cloudy';
                if (code === 0) { icon = 'fa-sun'; desc = 'Clear Sky'; }
                else if (code < 3) { icon = 'fa-cloud-sun'; desc = 'Partly Cloudy'; }
                else if (code < 50) { icon = 'fa-cloud'; desc = 'Overcast'; }
                else if (code < 70) { icon = 'fa-cloud-rain'; desc = 'Rain'; }
                else if (code < 80) { icon = 'fa-snowflake'; desc = 'Snow'; }
                
                document.getElementById('w-icon').innerHTML = `<i class="fa-solid ${icon}"></i>`;
                document.getElementById('w-desc').textContent = desc;
            } catch(e) { console.error("Final weather fetch fail", e); }
            document.getElementById('weather-loader').classList.remove('loading');
        }
    </script>
</body>
</html>
