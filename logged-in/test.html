<html lang="en" class="dark custom-scroll"> 
<head>
    <title>4SP - GAMES</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Base styles */
        :root {
            --bg-page: var(--bg-primary, #000000);
            --bg-card: var(--bg-secondary, #0d0d0d);
            --text-main: var(--text-primary, #ffffff);
            --text-muted: var(--text-secondary, #c0c0c0);
            --accent-color: var(--accent-primary, #4f46e5);
            --accent-glow: var(--accent-secondary, rgba(79, 70, 229, 0.4));
            --border-main: var(--border-primary, #1a1a1a);
            --border-faint: var(--border-secondary, rgba(255,255,255,0.05));
            --btn-bg: var(--button-bg, rgba(79, 70, 229, 0.1));
            --btn-text: var(--button-text, #4f46e5);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Geist', sans-serif;
            font-weight: 300;
            background-color: var(--bg-page);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .grid-bg {
            background-image: radial-gradient(var(--border-faint) 1px, transparent 0);
            background-size: 24px 24px;
        }

        #dynamic-background {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, var(--accent-glow), transparent 65%);
            pointer-events: none;
            z-index: -1;
        }
        
        h1, h2, h3, .font-medium, .font-semibold, strong {
            font-weight: 300 !important;
        }

        /* --- Toolbar Button Style (Global) --- */
        .btn-toolbar-style {
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 16px;
            color: var(--text-muted);
            padding: 0.6rem 1.25rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.85rem;
            outline: 1px solid transparent;
        }
        .btn-toolbar-style:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
            background: var(--btn-bg);
            outline: 1px solid var(--accent-glow);
        }

        /* --- Card Action Buttons --- */
        .btn-card-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.25rem;
            height: 2.25rem;
            border-radius: 12px;
            background-color: rgba(0,0,0,0.5) !important;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1) !important;
            color: #ffffff !important;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .btn-card-action:hover {
            background-color: var(--accent-color) !important;
            border-color: var(--accent-color) !important;
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--accent-glow);
        }
        
        /* Favorite Button Logic */
        .btn-card-action.fav-action .fa-solid-star { display: none; }
        .btn-card-action.fav-action .fa-regular-star { display: inline-block; }
        
        .btn-card-action.fav-action.favorited .fa-solid-star { display: inline-block; color: #facc15 !important; }
        .btn-card-action.fav-action.favorited .fa-regular-star { display: none; }
        
        .btn-card-action.fav-action:not(.favorited):hover .fa-regular-star { color: #facc15 !important; }

        /* Card Hover Effects (Matches Dashboard Feature Cards) */
        .zone-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .zone-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
            z-index: 10;
        }
        
        .other-zone-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 2rem;
            min-height: 280px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1; 
        }
        .other-zone-item:hover {
            border-color: var(--accent-color);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.6);
            z-index: 20; 
        }
        .other-zone-item .image-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0) 100%);
            transition: background 0.4s;
        }
        .other-zone-item:hover .image-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.1) 100%);
        }

        /* --- Animations --- */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-fade-out { animation: fadeOut 0.3s ease-out forwards; }

        .fade-out-card {
            animation: fadeOut 0.3s ease-out forwards;
            pointer-events: none;
        }

        /* Search Bar & Results */
        #bottom-fixed-bar {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            background-color: rgba(13, 13, 13, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-main);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
        }
        #bottom-fixed-bar:focus-within {
            transform: translateY(-5px);
            border-color: var(--accent-color);
            box-shadow: 0 30px 60px -12px var(--accent-glow);
        }

        .search-results-container {
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: none;
            transition: opacity 0.3s ease;
        }
        .search-results-container::-webkit-scrollbar { display: none; }
        
        .search-item {
            display: flex;
            cursor: pointer;
            transition: all 0.2s;
            padding: 12px 16px;
            border-radius: 1rem;
            margin: 4px 8px;
            background: rgba(255,255,255,0.02);
            border: 1px solid transparent;
        }
        .search-item:hover { 
            background-color: var(--bg-card); 
            border-color: var(--accent-color);
            transform: translateX(4px);
        }

        .smart-text {
            color: var(--text-main);
            transition: color 0.3s;
        }
        
        .smart-text-inverse {
            color: var(--bg-page);
        }

        .category-badge {
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 700;
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Polyfill for aspect-ratio */
        .aspect-w-3 { position: relative; padding-bottom: 66.666667%; }
        .aspect-h-2 { }
        .aspect-w-3 > * { position: absolute; height: 100%; width: 100%; top: 0; right: 0; bottom: 0; left: 0; }
        
        /* --- Game Viewer Modal --- */
        #zoneViewer { 
            display: none; position: fixed; 
            inset: 0;
            background-color: var(--bg-page); z-index: 100000; flex-direction: column; 
            opacity: 0;
        }
        #zoneViewer.active { display: flex; opacity: 1; }

        #zoneViewer .zone-header {
            background-color: rgba(0,0,0,0.8);
            backdrop-filter: blur(16px);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-main);
            flex-shrink: 0;
            z-index: 10;
        }
        #zoneViewer .zone-header .zone-title h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text-main);
            font-family: 'Geist', sans-serif;
            font-weight: 300;
            letter-spacing: 0.05em;
        }
        #zoneViewer .zone-header .zone-controls { display: flex; align-items: center; gap: 12px; }
        
        #zoneViewer .zone-header .zone-controls button,
        #zoneViewer .zone-header .zone-controls a {
            margin: 0;
            width: 40px;
            height: 40px;
            background-color: rgba(255,255,255,0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }
        #zoneViewer .zone-header .zone-controls button:hover,
        #zoneViewer .zone-header .zone-controls a:hover { 
            background-color: var(--accent-color); 
            border-color: var(--accent-color);
            color: #fff;
            transform: scale(1.1);
        }
        #zoneViewer iframe { flex-grow: 1; border: none; background-color: var(--bg-page); }
        .hidden { display: none !important; }

        /* --- Dropdown --- */
        .eagler-dropdown {
            display: none;
            position: absolute;
            bottom: 120%;
            right: 0;
            margin-bottom: 8px;
            background-color: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-main);
            border-radius: 1rem;
            padding: 0.5rem;
            z-index: 1000;
            min-width: 200px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transform-origin: bottom right;
        }
        .eagler-dropdown.show { display: block; animation: fadeInUp 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(10px) scale(0.95); } 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .eagler-dropdown-link {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.75rem;
            transition: all 0.2s;
            font-weight: 500;
            white-space: nowrap;
            font-size: 0.85rem;
            margin-bottom: 2px;
        }
        .eagler-dropdown-link:hover { background-color: rgba(255,255,255,0.05); color: var(--text-main); }

        /* Modal Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 0; }

        @keyframes popOut {
            0% { transform: scale(1); opacity: 1; }
            40% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0; }
        }
        .animate-pop-out { animation: popOut 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 10000;
            animation: particle-fly 0.6s ease-out forwards;
        }
        @keyframes particle-fly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }

        /* --- Fullscreen Credits Styles --- */
        #creditsModal {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: var(--bg-page);
            display: none;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        #creditsModal.active { display: flex; opacity: 1; }

        .credits-scroll-container {
            flex-grow: 1;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .credits-scroll-container::-webkit-scrollbar { display: none; }

        .credit-section {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            position: relative;
            background-size: cover;
            background-position: center;
        }
        
        .credit-content-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 6rem;
            max-width: 1400px;
            width: 100%;
            z-index: 10;
        }

        .credit-text-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 1.5rem;
        }

        .credit-title {
            font-size: 6rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            line-height: 1;
            background: linear-gradient(to right, #fff, #999);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s ease-out forwards 0.2s;
        }

        .credit-desc {
            font-size: 1.25rem;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 600px;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s ease-out forwards 0.4s;
            font-weight: 300;
        }

        .credit-links {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s ease-out forwards 0.6s;
        }

        .credit-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 0.75rem 1.5rem;
            border-radius: 1rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            font-weight: 500;
        }
        .credit-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .credit-img-col {
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transform: scale(0.95);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.4s;
        }
        .credit-logo {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1/1;
            object-fit: contain;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.5));
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        #closeCreditsFixed {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 10000;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            width: 3rem;
            height: 3rem;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        #closeCreditsFixed i { font-size: 1.2rem; }
        #closeCreditsFixed:hover {
            background: var(--bg-card);
            border-color: var(--accent-color);
            transform: rotate(90deg);
        }

        .credits-nav-bar {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            gap: 1rem;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(16px);
            padding: 0.5rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .credits-nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            width: 3rem;
            height: 3rem;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .credits-nav-btn:hover:not(:disabled) {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .credits-nav-btn:disabled {
            opacity: 0.2;
            cursor: default;
        }
    </style>
</head>

<body class="grid-bg relative min-h-screen">
    <div id="dynamic-background"></div>
    <div id="navbar-container"></div>

    <main class="flex min-h-screen">
        <section class="flex-1 min-w-0 p-8 md:p-16 pt-12 pb-32">
            <div class="max-w-[1400px] mx-auto relative">
                
                <button id="creditsBtn" class="absolute top-0 right-0 z-20 btn-toolbar-style border-indigo-500/30 text-indigo-400 hover:bg-indigo-500/10">
                    <i class="fa-solid fa-users mr-2"></i>Credits
                </button>

                <div id="favoritesSection" class="mb-16 mt-4" style="display: none;">            
                    <div id="favoritesHeader" style="display: none;">
                        <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-40 mb-2 text-indigo-400">Your Collection</p>
                        <h2 class="text-5xl font-light tracking-tight mb-8" style="color: var(--text-main);">Favorites</h2>
                    </div>
                    <div class="games-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6" id="favoritesGameList" style="display: none;"></div>
                </div>

                <div id="category-viewer" class="w-full mt-12 border-t border-white/5 pt-12">
                    <div id="category-slider-container" class="relative flex items-center justify-center w-full mx-auto mb-10">
                        <button id="prev-category" class="absolute left-0 top-1/2 -translate-y-1/2 text-xl w-12 h-12 flex items-center justify-center rounded-2xl border border-white/10 bg-black/40 text-gray-400 hover:text-white hover:border-indigo-500 hover:bg-indigo-500/10 transition-all z-10 disabled:opacity-20 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div class="overflow-hidden w-full max-w-lg text-center">
                            <div id="category-slider" class="flex transition-transform duration-500 ease-in-out items-center">
                                </div>
                        </div>
                        <button id="next-category" class="absolute right-0 top-1/2 -translate-y-1/2 text-xl w-12 h-12 flex items-center justify-center rounded-2xl border border-white/10 bg-black/40 text-gray-400 hover:text-white hover:border-indigo-500 hover:bg-indigo-500/10 transition-all z-10 disabled:opacity-20 disabled:cursor-not-allowed">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                    
                    <div id="games-grid-container" class="games-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 transition-opacity duration-300 ease-in-out">
                        </div>
                </div>
            </div>
        </section>
    </main>

    <div class="fixed bottom-8 left-0 w-full flex justify-center z-50 pointer-events-none px-4">
        <div id="bottom-fixed-bar" class="w-full max-w-lg pointer-events-auto transition-all duration-300 flex flex-col">
            <div id="searchResults" class="search-results-container w-full pt-2" style="display: none;"></div>
            
            <div id="searchDivider" class="w-full h-[1px] bg-[var(--border-main)] my-1" style="display: none;"></div>

            <div class="flex items-center w-full p-2">
                <div class="pl-4 pr-3 text-[var(--text-muted)] opacity-60 text-lg">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input type="text" id="searchInput" placeholder="Search the catalog..." autocomplete="off" class="w-full py-3 pr-4 bg-transparent placeholder-[var(--text-muted)] opacity-80 focus:outline-none focus:ring-0 text-base font-medium text-white" />
            </div>
        </div>
    </div>
    
    <div id="zoneViewer" aria-modal="true" role="dialog">
        <div class="zone-header">
             <div class="zone-title">
                <h2 id="zoneNameEl">Game Title</h2>
             </div>
             <div class="zone-controls">
                <button id="fullscreenBtnZone" title="Fullscreen"><i class="fas fa-expand"></i></button>
                <a id="downloadBtnZone" title="Download" class="hidden" href="#"><i class="fas fa-download"></i></a>
                <button id="closeBtnZone" title="Close"><i class="fas fa-times"></i></button>
             </div>
        </div>
        <iframe id="zoneFrame" title="Game Content" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock"></iframe>

        function getContrastYIQ(hexcolor){
            if (!hexcolor || hexcolor.length < 4) return 'light';
            hexcolor = hexcolor.replace("#", "");
            if (hexcolor.length === 3) {
                hexcolor = hexcolor.split("").map(c => c + c).join("");
            }
            const r = parseInt(hexcolor.substr(0,2),16);
            const g = parseInt(hexcolor.substr(2,2),16);
            const b = parseInt(hexcolor.substr(4,2),16);
            const yiq = ((r*299)+(g*587)+(b*114))/1000;
            return (yiq >= 128) ? 'dark' : 'light';
        }

            const accentHex = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();

        const imageObserver = new IntersectionObserver((entries, observer) => {

                    if (img.dataset.src) {
                        img.src = img.dataset.src;
                    }
                } else {
                    if(img.src && !img.src.includes('placehold.co') && !img.dataset.src) {

                        img.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";

        async function sd_getEmbedPath(adjustedHref, originalHref, page) {
            let cleanHref = adjustedHref.replace(/index\.html$/, "").replace(/base\.html$/, "").replace(/\.html$/, "");
            if (!cleanHref.endsWith("/")) cleanHref += "/";
            const pathsToTry = [cleanHref + "game/index.html", cleanHref + "game/base.html", cleanHref + "gamereal/index.html", cleanHref + "gamereal/base.html", cleanHref + "index.html", cleanHref + "base.html", ];
            try {
                const response = await fetch(adjustedHref);
                if (response.ok) {
                    const text = await response.text();
                    const match = text.match(/embedGame\((['"])(.*?)\1,\s*(['"])(.*?)\3\)/);
                    if (match) {
                        const resolvedPath = new URL(match[2], adjustedHref).href;
                        if (await sd_fileExists(resolvedPath)) return resolvedPath;
                    }
                }
            } catch (error) {}
            for (const path of pathsToTry) {
                if (await sd_fileExists(path)) return path;
            }
            return adjustedHref;
        }
        async function sd_fileExists(url) {
            try { const response = await fetch(url, { method: "HEAD" }); return response.ok; } catch { return false; }
        }

                return relativePath.substring(6);

                return `${WORKER_ROOT}${pathPart}`;

            return `${GAMES_BASE_URL}${relativePath.replace(/^\.\//, '')}`;

                        ${game.isDownload ? `<a class="btn-card-action download-action" href="${game.url}" target="_blank" title="Download Game"><i class="fa-solid fa-download"></i></a>` : `<button class="btn-card-action play-action" title="Play Game"><i class="fa-solid fa-play"></i></button>`}
                        <button class="btn-card-action fav-action ${isFavorite ? 'favorited' : ''}" title="${isFavorite ? 'Remove from Favorites' : 'Add to Favorites'}"><i class="fa-solid fa-star fa-solid-star"></i><i class="fa-regular fa-star fa-regular-star"></i></button>
                    </div>
                </div>
            `;
            
            const handlePlay = async (e) => {
                e.stopPropagation();
                if (game.isDownload) {
                    window.open(game.url, '_blank');
                    return;
                }
                if (isStrongdog) {
                    const baseURL = sd_getBaseURLForPage(game.page);
                    let adjustedHref = baseURL.endsWith("/") ? baseURL + game.href.replace(/^\.\//, "") : baseURL + "/" + game.href.replace(/^\.\//, "");
                    const embedPath = await sd_getEmbedPath(adjustedHref, game.href, game.page);
                    openZone({ name: game.name, url: embedPath, category: game.category, id: game.id });
                } else {
                    let gUrl = game.url;
                    if (game.category === 'Others' || game.category === 'Gameboy Games') {
                        gUrl = resolveGameUrl(gUrl);
                    }
                    openZone({ ...game, url: gUrl, fallbackUrl: game.fallbackUrl });
                }
            };

            card.querySelector('.group').addEventListener('click', handlePlay);
            card.querySelector('.play-action').addEventListener('click', handlePlay);
            card.querySelector('.fav-action').addEventListener('click', (e) => { e.stopPropagation(); toggleFavorite(game.id); });
            imageObserver.observe(card.querySelector('img'));
            return card;
        }

        // --- Helper for Download ---
        async function downloadResource(url, filename) {
            try {
                const r = await fetch(url);
                if (!r.ok) throw new Error("Fetch failed");
                const b = await r.blob();
                const a = document.createElement("a");
                a.href = URL.createObjectURL(b);
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (e) {
                console.error(e);
                alert("Download failed.");
            }
        }

        // --- Game Viewer Logic ---
        async function openZone(game) {
            if (!game || !game.url) return;

            updateURL(categories[currentCategoryIndex], game.id || null);
            
            const zoneViewer = document.getElementById('zoneViewer');
            const zoneFrame = document.getElementById('zoneFrame');
            const zoneNameEl = document.getElementById('zoneNameEl');
            const downloadBtn = document.getElementById('downloadBtnZone');
            const controls = zoneViewer.querySelector('.zone-controls');

            zoneViewer.style.opacity = '0';
            zoneViewer.style.display = 'flex';

            const show404 = (errorMsg = "Game content unavailable.") => {
                zoneFrame.src = 'about:blank';
                const doc = zoneFrame.contentWindow.document;
                doc.open();
                doc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
                        <style>
                            body { background: #000; color: #fff; font-family: 'Geist', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
                            h1 { font-size: 4rem; font-weight: 300; margin: 0; color: #4f46e5; }
                            p { color: #888; font-size: 1.2rem; font-weight: 300; max-width: 400px; margin-top: 10px; }
                            .btn { margin-top: 30px; padding: 12px 30px; border: 1px solid #333; border-radius: 16px; color: #fff; cursor: pointer; background: #111; transition: all 0.2s; font-weight: 500; }
                            .btn:hover { border-color: #4f46e5; background: #4f46e51a; }
                        </style>
                    </head>
                    <body>
                        <h1>Load Failed</h1>
                        <p><strong>${game.name}</strong> could not be loaded.<br><span style="font-size: 0.9rem; opacity: 0.7;">${errorMsg}</span></p>
                        <div class="btn" onclick="window.parent.closeZoneViewer()">Return to Hub</div>
                    </body>
                    </html>
                `);
                doc.close();
                zoneViewer.style.display = "flex";
                zoneViewer.classList.add('active', 'animate-fade-in');
                zoneViewer.style.opacity = '1';
            };

            const isEagler = game.baseGameId === 'other-eaglercraft' || game.id === 'other-eaglercraft' || (game.id && String(game.id).startsWith('other-eaglercraft'));
            if (isEagler) {
                downloadBtn.href = "#"; 
                downloadBtn.onclick = (e) => {
                    e.preventDefault();
                    downloadResource(game.url, game.name.replace(/ /g, '_') + '.html');
                };
                downloadBtn.classList.remove('hidden');
            } else {
                downloadBtn.classList.add('hidden');
                downloadBtn.href = '#';
                downloadBtn.onclick = null;
                downloadBtn.removeAttribute('download');
            }

            const existingFav = controls.querySelector('.player-fav-btn');
            if (existingFav) existingFav.remove();

            const favBtn = document.createElement('button');
            favBtn.className = 'player-fav-btn btn-card-action fav-action border-none';
            favBtn.innerHTML = '<i class="fa-solid fa-star fa-solid-star"></i><i class="fa-regular fa-star fa-regular-star"></i>';
            const isFavorited = getFavorites().map(String).includes(String(game.id));
            if (isFavorited) favBtn.classList.add('favorited');
            
            favBtn.onclick = (e) => {
                e.stopPropagation();
                toggleFavorite(game.id);
                favBtn.classList.toggle('favorited');
            };
            controls.prepend(favBtn);

            zoneNameEl.textContent = game.name;
            zoneFrame.src = 'about:blank';
            
            zoneFrame.setAttribute('allow', 'autoplay; fullscreen; clipboard-write');
            
            const sandboxRules = 'allow-scripts allow-same-origin allow-forms allow-pointer-lock';
            zoneFrame.setAttribute('sandbox', sandboxRules);

            // New categories typically act like standard URL games
            const isStandardURLGame = (game.category === 'Others' && !isEagler) || game.category === 'StrongdogXP' || game.category === 'Elite Gamez' || game.category === 'Diesmos';
            
            const attemptLoad = async (retriesLeft, useFallback = false) => {
                try {
                    let currentUrl = useFallback && game.fallbackUrl ? game.fallbackUrl : game.url;
                    
                    const check = await fetch(currentUrl, { method: 'HEAD' });
                    if (!check.ok) throw new Error(`HTTP ${check.status}`);
                    
                    if (isStandardURLGame) {
                        zoneFrame.src = currentUrl;
                        zoneFrame.onload = () => {
                            try {
                                const doc = zoneFrame.contentDocument;
                                const title = doc.title;
                                if (title.includes("CDN files") || title.includes("Index of") || title.includes("Directory listing") || (doc.body && doc.body.textContent.includes("4sp-dv CDN files"))) {
                                     console.warn("Directory listing detected. Aborting.");
                                     closeZoneViewer();
                                     return;
                                }
                                zoneFrame.contentWindow.focus();
                                zoneFrame.focus();
                            } catch (e) {}
                        };
                    } else {
                        const response = await fetch(`${currentUrl}?t=${Date.now()}`);
                        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
                        let html = await response.text();
                        
                        // Inject base tag to fix relative assets
                        const baseUrl = currentUrl.substring(0, currentUrl.lastIndexOf('/') + 1);
                        const baseTag = `<base href="${baseUrl}">`;
                        if (html.includes('<head>')) {
                            html = html.replace('<head>', `<head>${baseTag}`);
                        } else {
                            html = baseTag + html;
                        }

                        const doc = zoneFrame.contentWindow.document;
                        doc.open();
                        doc.write(html);
                        doc.close();
                        
                        let focusAttempts = 0;
                        const forceFocusInterval = setInterval(() => {
                            if (zoneFrame.contentWindow) {
                                zoneFrame.contentWindow.focus();
                                zoneFrame.focus();
                            }
                            focusAttempts++;
                            if (focusAttempts > 20) clearInterval(forceFocusInterval);
                        }, 100);
                        
                        zoneFrame.contentWindow.addEventListener('click', () => {
                            zoneFrame.contentWindow.focus();
                        });
                    }

                    zoneViewer.classList.remove('animate-fade-out');
                    zoneViewer.classList.add('active', 'animate-fade-in');
                    zoneViewer.style.opacity = '1';

                } catch (e) {
                    console.warn(`Load failed for ${game.name}. Retries left: ${retriesLeft}`, e);
                    if (!useFallback && game.fallbackUrl) {
                        console.warn(`Trying fallback URL for ${game.name}...`);
                        attemptLoad(retriesLeft, true);
                    } else if (retriesLeft > 0) {
                        setTimeout(() => attemptLoad(retriesLeft - 1, useFallback), 1000);
                    } else {
                        show404("The game files could not be loaded after multiple attempts.");
                    }
                }
            };

            attemptLoad(2); 
        }

        // --- Search ---
        function debounce(func, delay) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), delay);
            };
        }

        const handleSearch = debounce(() => {
            const text = searchInput.value.toLowerCase().trim();
            const filteredDropdown = text ? searchableGames.filter(g => g.name.toLowerCase().includes(text)).slice(0, 5) : [];
            
            searchResults.innerHTML = "";
            
            if (filteredDropdown.length === 0 || !text) {
                searchResults.style.display = "none";
                searchDivider.style.display = "none";
                return;
            }
            
            const favorites = getFavorites().map(String);

                        </div>

                    <div class="flex items-center flex-shrink-0">
                        <div class="bg-black/40 backdrop-blur-md rounded-2xl p-1 flex items-center gap-1 border border-white/10 shadow-lg">
                            ${game.isDownload ? `<a class="btn-card-action download-action" href="${game.url}" target="_blank" title="Download Game"><i class="fa-solid fa-download"></i></a>` : `<button class="btn-card-action play-action" title="Play Game"><i class="fa-solid fa-play"></i></button>`}
                            <button class="btn-card-action fav-action ${isFavorite ? 'favorited' : ''}" title="${isFavorite ? 'Remove from Favorites' : 'Add to Favorites'}">
                                <i class="fa-solid fa-star fa-solid-star"></i>

                const favBtn = linkEl.querySelector('.fav-action');
                favBtn.addEventListener('click', (e) => {

                linkEl.addEventListener('click', async (e) => {

        async function fetchGameData() {
            try {
                const response = await fetch(CARDS_DATA_URL);
                if (!response.ok) throw new Error('Failed to fetch game data');
                let scriptText = await response.text();
                
                if (scriptText.includes('export default')) {
                    scriptText = scriptText.replace('export default', 'window.loadedGameData =');
                }
                
                const scriptEl = document.createElement('script');
                scriptEl.textContent = scriptText;
                document.body.appendChild(scriptEl);
                
                await new Promise(resolve => setTimeout(resolve, 0));
                
                if (window.loadedGameData) {
                    return window.loadedGameData;
                } else {
                    console.warn("Script loaded but window.loadedGameData is undefined");
                    return [];
                }
            } catch (e) {
                console.error("Error manual loading games:", e);
                return [];
            }
        }

        // --- Init ---
        async function initializeApp() {
            const checkPrivilege = () => {
                return new Promise((resolve) => {
                    const check = async () => {
                        if (typeof firebase === 'undefined' || !firebase.apps.length) {
                            setTimeout(check, 100);
                            return;
                        }
                        const auth = firebase.auth();
                        const validate = async (u) => {
                            if (!u) return false;
                            if (u.email === 'otweno30@minerva.sparcc.org' || u.email === '4simpleproblems@gmail.com') return true;
                            const db = firebase.firestore();
                            try {
                                const adminDoc = await db.collection('admins').doc(u.uid).get();
                                return adminDoc.exists;
                            } catch (e) {
                                return false;
                            }
                        };
                        const user = auth.currentUser;
                        if (user) resolve(await validate(user));
                        else {
                            const unsubscribe = auth.onAuthStateChanged(async (u) => {
                                unsubscribe();
                                resolve(await validate(u));
                            });
                        }
                    };
                    check();
                });
            };

            const isAuthorized = await checkPrivilege();
            const filteredOthers = othersGames.filter(g => !g.privileged || isAuthorized);

            let gamesData = [];
            try {
                gamesData = await fetchGameData();
            } catch (e) {
                console.error("Could not load external games data", e);
            }
            
            const strongdogGames = gamesData.map(g => ({ ...g, category: 'StrongdogXP' }));
            
            try {
                let sharesponse;
                let shajson;
                let sha;
                try {
                    sharesponse = await fetch("https://api.github.com/repos/gn-math/assets/commits?t="+Date.now());
                } catch (error) {}
                if (sharesponse && sharesponse.status === 200) {
                    try {
                        shajson = await sharesponse.json();
                        sha = shajson[0]['sha'];
                        if (sha) {
                            zonesURL = `https://raw.githubusercontent.com/gn-math/assets/${sha}/zones.json`;
                        }
                    } catch (error) {
                        try {
                            let secondarysharesponse = await fetch("https://raw.githubusercontent.com/gn-math/xml/refs/heads/main/sha.txt?t="+Date.now());
                            if (secondarysharesponse && secondarysharesponse.status === 200) {
                                sha = (await secondarysharesponse.text()).trim();
                                if (sha) {
                                    zonesURL = `https://raw.githubusercontent.com/gn-math/assets/${sha}/zones.json`;
                                }
                            }
                        } catch(error) {}
                    }
                }

                const popularityData = {};
                try {
                    const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/npm/gn-math.github.io-main/files?period=year");
                    if (!response.ok) throw new Error("Stats API failed");
                    const data = await response.json();
                    data.forEach(file => {
                        const idMatch = file.name.match(/\/(\d+)\.html$/);
                        if (idMatch) {
                            const id = parseInt(idMatch[1]);
                            popularityData[id] = file.hits.total;
                        }
                    });
                } catch (error) {
                    popularityData[0] = 0;
                }

                const response = await fetch(zonesURL+"?t="+Date.now());
                const gnMathRaw = await response.json();
                
                const ghBase = `https://raw.githubusercontent.com/gn-math/assets/${sha || 'main'}`;
                const npmBase = `https://unpkg.com/gn-math.github.io-main@latest`;

                const gnMathGames = gnMathRaw.map(g => {
                    let coverPath = g.cover.split('/').pop(); 
                    let htmlPath = g.url ? g.url.split('/').pop() : `${g.id}.html`;
                    
                    return { 
                        id: `gn-${g.id}`, 
                        name: g.name, 
                        imgSrc: `${ghBase}/covers/${coverPath}`, 
                        fallbackImgSrc: `${npmBase}/covers-main/${coverPath}`,
                        category: 'GN-Math', 
                        url: `${ghBase}/html/${htmlPath}`,
                        fallbackUrl: `${npmBase}/html-main/${htmlPath}`,
                        popularity: popularityData[g.id] || 0
                    };
                });
                
                allGames = [...strongdogGames, ...gnMathGames, ...filteredOthers];
            } catch (error) { 
                console.warn("Failed to load GN-Math, falling back to others.", error);
                allGames = [...strongdogGames, ...filteredOthers]; 
            }

            // -------------------------------------------------------------
            // Elite Gamez Fetch
            // -------------------------------------------------------------
            let eliteGames = [];
            try {
                const egRes = await fetch("https://cdn.jsdelivr.net/gh/elite-gamez/elite-gamez.github.io@main/games.json?t=" + Date.now());
                if (egRes.ok) {
                    const egRaw = await egRes.json();
                    eliteGames = egRaw.map(g => {
                        let img = g.image || g.imgSrc || '';
                        let u = g.url || g.link || '';
                        return {
                            id: `eg-${(g.title || g.name || 'unnamed').replace(/[^a-z0-9]/gi, '-').toLowerCase()}`,
                            name: g.title || g.name,
                            description: g.description || '',
                            imgSrc: img.startsWith('http') ? img : `https://cdn.jsdelivr.net/gh/elite-gamez/elite-gamez.github.io@main/${img}`,
                            category: 'Elite Gamez',
                            url: u.startsWith('http') ? u : `https://cdn.jsdelivr.net/gh/elite-gamez/elite-gamez.github.io@main/${u}`
                        };
                    });
                }
            } catch (error) { console.warn("Failed to load Elite Gamez", error); }

            // -------------------------------------------------------------
            // Diesmos Fetch
            // -------------------------------------------------------------
            let diesmosGames = [];
            try {
                const dRes = await fetch("https://cdn.jsdelivr.net/gh/waycrosspublicmedia/HTMLFILES@main/games.json?t=" + Date.now());
                if (dRes.ok) {
                    const dRaw = await dRes.json();
                    diesmosGames = dRaw.map(g => {
                        let img = g.image || g.imgSrc || g.thumb || '';
                        let u = g.url || g.link || g.file || '';
                        return {
                            id: `d-${(g.title || g.name || 'unnamed').replace(/[^a-z0-9]/gi, '-').toLowerCase()}`,
                            name: g.title || g.name,
                            description: g.description || '',
                            imgSrc: img.startsWith('http') ? img : `https://cdn.jsdelivr.net/gh/waycrosspublicmedia/HTMLFILES@main/${img}`,
                            category: 'Diesmos',
                            url: u.startsWith('http') ? u : `https://cdn.jsdelivr.net/gh/waycrosspublicmedia/HTMLFILES@main/${u}`
                        };
                    });
                }
            } catch (error) { console.warn("Failed to load Diesmos", error); }

            // Assemble the final game array
            allGames = [...allGames, ...eliteGames, ...diesmosGames];

            try {
                const blacklistRes = await fetch("https://cdn.jsdelivr.net/npm/4sp-asset-library@latest/blacklisted_games.json");
                const blacklist = await blacklistRes.json();
                allGames = allGames.filter(g => !blacklist.some(term => g.name.toLowerCase().includes(term.toLowerCase())));
            } catch (err) {
                console.warn("Failed to fetch game blacklist:", err);
                allGames = allGames.filter(g => !['bitlife', 'soundboard', 'five nights at e'].some(term => g.name.toLowerCase().includes(term)));
            }
            
            searchableGames = [];
            allGames.forEach(game => {
                if (game.versions && game.versions.length > 0) {
                    game.versions.forEach(version => {
                        searchableGames.push({
                            ...game,
                            id: version.favoriteId,
                            name: `${game.name} - ${version.name}`,
                            url: version.url,
                            wasm: version.wasm,
                            versions: undefined,
                            baseGameId: game.id
                        });
                    });
                } else {
                    searchableGames.push(game);
                }
            });

            categories = ['StrongdogXP', 'GN-Math', 'Elite Gamez', 'Diesmos', 'Gameboy Games', 'Others'].filter(cat => allGames.some(g => g.category === cat));

            const { category: urlCat } = parseURL();
            if (urlCat) currentCategoryIndex = Math.max(0, categories.findIndex(c => c.replace(/\s+/g, '-').toLowerCase() === urlCat.toLowerCase()));

            categorySlider.style.width = `${categories.length * 100}%`;
            categorySlider.innerHTML = categories.map(cat => `<div class="w-full max-w-lg flex-shrink-0 px-12"><h2 class="text-4xl md:text-5xl font-light tracking-tight ${categoryColors[cat] || 'text-[var(--text-main)]'}">${cat}</h2></div>`).join('');

            switchCategory(currentCategoryIndex);
            
            const smartTextClass = getSmartTextColor();
            searchInput.classList.add(smartTextClass);
            
            renderFavorites();
            
            searchInput.addEventListener("input", handleSearch);
            searchInput.addEventListener("focus", handleSearch);

            document.addEventListener("click", ev => {
                if (!document.getElementById('bottom-fixed-bar').contains(ev.target)) {
                    searchResults.style.display = "none";
                    searchDivider.style.display = "none";
                }
                if (!ev.target.closest('.version-btn') && !ev.target.closest('.version-favorite-btn') && !ev.target.closest('.eagler-dropdown')) {
                    document.querySelectorAll('.eagler-dropdown.show').forEach(d => {
                        d.classList.remove('show');
                        const card = d.closest('.other-zone-item, .zone-item');
                        if(card) card.style.zIndex = '';
                    });
                }
            });

            prevCategoryBtn.addEventListener('click', () => switchCategory(currentCategoryIndex - 1));
            nextCategoryBtn.addEventListener('click', () => switchCategory(currentCategoryIndex + 1));
            document.getElementById('closeBtnZone').addEventListener('click', window.closeZoneViewer);

            document.getElementById('zoneViewer').addEventListener('click', (e) => {
                if (e.target.closest('.zone-controls')) return;
                
                const zoneFrame = document.getElementById('zoneFrame');
                if (zoneFrame && zoneFrame.contentWindow) {
                    zoneFrame.contentWindow.focus();
                    zoneFrame.focus();
                }
            });

            document.getElementById('fullscreenBtnZone').addEventListener('click', () => {
                const zoneFrame = document.getElementById('zoneFrame');
                if (zoneFrame && zoneFrame.requestFullscreen) {
                    zoneFrame.requestFullscreen();
                } else if (zoneFrame && zoneFrame.webkitRequestFullscreen) {
                    zoneFrame.webkitRequestFullscreen();
                } else if (zoneFrame && zoneFrame.msRequestFullscreen) {
                    zoneFrame.msRequestFullscreen();
                }
            });

            window.addEventListener('keydown', (e) => {
                const zoneViewer = document.getElementById('zoneViewer');
                if (zoneViewer && zoneViewer.style.display === 'flex') {
                    const scrollKeys = ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
                    if (scrollKeys.includes(e.code) || (e.key === ' ' || scrollKeys.includes(e.key))) {
                        e.preventDefault();
                    }
                }
            }, false);

            const updateNavButtons = () => {
                const scrollTop = creditsScrollContainer.scrollTop;
                const maxScroll = creditsScrollContainer.scrollHeight - creditsScrollContainer.clientHeight;
                
                creditsPrevBtn.disabled = scrollTop <= 5;
                creditsNextBtn.disabled = scrollTop >= maxScroll - 5;
            };

            creditsScrollContainer.addEventListener('scroll', updateNavButtons);

            creditsBtn.addEventListener('click', () => { 
                creditsModal.classList.add('active');
                creditsScrollContainer.innerHTML = '';
                
                Object.keys(CREDITS_DATA).forEach(key => {
                    const data = CREDITS_DATA[key];
                    const section = document.createElement('section');
                    section.className = 'credit-section';
                    
                    let linksHtml = '';
                    if (data.links.length > 0) {
                        linksHtml = `<div class="credit-links">` + data.links.map(l => `
                            <a href="${l.url}" target="_blank" class="credit-btn" style="border-color: ${data.color}; color: ${data.color}; background: ${data.color}1a;">
                                <i class="fa-brands fa-${l.type}"></i> ${l.label}
                            </a>
                        `).join('') + `</div>`;
                    }

                    section.innerHTML = `
                        <div class="credit-content-grid">
                            <div class="credit-text-col">
                                <h2 class="credit-title" style="background: ${data.color}; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">${key}</h2>
                                <p class="credit-desc" style="border-left: 2px solid ${data.color}; padding-left: 1rem;">${data.desc}</p>
                                ${linksHtml}
                            </div>
                            <div class="credit-img-col">
                                <img src="${data.logo}" class="credit-logo" onerror="this.style.display='none'">
                            </div>
                        </div>
                    `;
                    creditsScrollContainer.appendChild(section);
                });
                
                requestAnimationFrame(() => {
                    creditsScrollContainer.scrollTop = 0;
                    updateNavButtons();
                });
            });
            
            closeCreditsFixed.addEventListener('click', () => {
                creditsModal.classList.remove('active');
            });

            creditsPrevBtn.addEventListener('click', () => {
                creditsScrollContainer.scrollBy({ top: -window.innerHeight, behavior: 'smooth' });
            });

            creditsNextBtn.addEventListener('click', () => {
                creditsScrollContainer.scrollBy({ top: window.innerHeight, behavior: 'smooth' });
            });
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
