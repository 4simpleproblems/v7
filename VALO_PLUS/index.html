<!DOCTYPE html>

<head>
    <!-- VERN_SYSTEM Proxy -->
    <script src="/VALO_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>window.__4sp_nav_none = true;
        const basePath = "/VALO_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VALO_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VALO_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VALO_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const workerPath = "/VALO_PLUS/VERN_SYSTEM/baremux/worker.js";
            const connection = new BareMux.BareMuxConnection(workerPath);
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VALO_PLUS/VERN_SYSTEM/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Valo Plus: BareMux Transport Active");

                    const bc = new BroadcastChannel("bare-mux-sync");
                    const port = connection.getInnerPort();
                    
                    const signalReady = () => {
                        const msg = { 
                            type: 'baremuxready', 
                            path: workerPath,
                            hasPort: !!port 
                        };
                        
                        bc.postMessage(msg);
                        
                        if (navigator.serviceWorker.controller) {
                            if (port) {
                                navigator.serviceWorker.controller.postMessage(msg, [port]);
                            } else {
                                navigator.serviceWorker.controller.postMessage(msg);
                            }
                        }
                    };
                    
                    signalReady();
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Valo Plus: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valo Plus // Live Sports</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <script>window.__4sp_nav_none = true;
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#0D47A1',

    <style>
        :root {
            --bg-page: #05080f;
            --bg-card: #0a0d14;
            --text-main: #ffffff;
            --text-muted: #8e99af;
            --accent-color: #2196F3;
            --accent-glow: rgba(33, 150, 243, 0.4);
            --border-main: #1a2233;
            --sport-gradient: linear-gradient(to bottom, #05080f, #0D47A1);
        }
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 120px; /* Space for bottom nav */
        }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        #dynamic-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            transition: all 1s ease-in-out;
            background: var(--sport-gradient);
            opacity: 0.6;
        }

        .hero-section {
            height: 70vh;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 0 4rem 4rem 4rem;
            background-size: cover;
            background-position: center;
            transition: background-image 0.8s ease-in-out;
        }
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, #05080f 0%, rgba(5,8,15,0.8) 20%, rgba(5,8,15,0) 60%),
                        linear-gradient(to right, #05080f 0%, rgba(5,8,15,0.4) 30%, rgba(5,8,15,0) 100%);
        }
        .hero-content { position: relative; z-index: 10; max-width: 800px; }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            gap: 1.5rem;
            padding: 1rem 0 2rem 0;
            scroll-behavior: smooth;
        }
        .sport-card {
            flex: 0 0 280px;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-main);
            background: var(--bg-card);
        }
        .sport-card:hover {
            transform: scale(1.05);
            z-index: 50;
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .sport-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; transition: opacity 0.3s; }
        .sport-card:hover img { opacity: 1; }
        
        .sport-info-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
        }

        .category-title { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; letter-spacing: 0.05em; margin-bottom: 0.5rem; padding-left: 4rem; color: var(--accent-color); }

        /* Bottom Navigation & Search */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 100px;
            background: rgba(10, 13, 20, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-main);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem 2rem;
        }

        .sports-bar {
            width: 100%;
            display: flex;
            overflow-x: auto;
            gap: 2rem;
            padding: 0.5rem 0;
            justify-content: center;
        }
        .sports-bar-item {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.2rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sports-bar-item:hover, .sports-bar-item.active {
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-top: 0.5rem;
        }
        #searchInput {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-main);
            border-radius: 9999px;
            padding: 0.5rem 3rem;
            font-size: 0.9rem;
            color: white;
            outline: none;
            transition: all 0.3s;
        }
        #searchInput:focus {
            border-color: var(--accent-color);
            background: rgba(0,0,0,0.6);
            box-shadow: 0 0 15px var(--accent-glow);
        }
        .search-icon {
            position: absolute;
            left: 1.2rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }
        .search-suggestions {
            position: absolute;
            bottom: 110%;
            left: 0; right: 0;
            background: var(--bg-card);
            border: 1px solid var(--border-main);
            border-radius: 12px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }
        .suggestion-item {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .suggestion-item:hover {
            background: rgba(33, 150, 243, 0.1);
        }

        .live-tag {
            background: #ff0000;
            color: white;
            font-size: 0.6rem;
            font-weight: 900;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            text-transform: uppercase;
            margin-right: 0.5rem;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="dynamic-bg"></div>

    <nav class="fixed top-0 left-0 right-0 h-20 flex items-center px-16 z-[100] bg-gradient-to-b from-[#05080f] to-transparent">

    <main class="relative z-20 pb-20 mt-[-5vh]">

                <!-- Replay items will be injected here -->
            </div>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="sports-bar" id="bottomSportsBar">
            <!-- Sports categories injected here -->
        </div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search for teams, players, or matches...">
            <div class="search-suggestions" id="suggestions"></div>
        </div>
    </div>

    <script>window.__4sp_nav_none = true;
        const sports = [
            { id: 'nba', name: 'NBA', gradient: 'linear-gradient(to bottom, #05080f, #0D47A1, #b91c1c)', icon: 'fa-basketball', img: './images/grid-strength.jpg' },
            { id: 'nfl', name: 'NFL', gradient: 'linear-gradient(to bottom, #05080f, #1e3a8a, #334155)', icon: 'fa-football', img: './images/grid-endurance.jpg' },
            { id: 'mlb', name: 'MLB', gradient: 'linear-gradient(to bottom, #05080f, #1d4ed8, #be123c)', icon: 'fa-baseball', img: './images/grid-power.jpg' },
            { id: 'soccer', name: 'Soccer', gradient: 'linear-gradient(to bottom, #05080f, #065f46, #1e40af)', icon: 'fa-futbol', img: './images/hero.webp' },
            { id: 'nhl', name: 'NHL', gradient: 'linear-gradient(to bottom, #05080f, #334155, #000000)', icon: 'fa-hockey-puck', img: './images/grid-strength.jpg' },
            { id: 'ufc', name: 'UFC', gradient: 'linear-gradient(to bottom, #05080f, #450a0a, #78350f)', icon: 'fa-hand-fist', img: './images/grid-power.jpg' },
            { id: 'tennis', name: 'Tennis', gradient: 'linear-gradient(to bottom, #05080f, #4d7c0f, #1e40af)', icon: 'fa-table-tennis-paddle-ball', img: './images/grit.webp' },
            { id: 'f1', name: 'Formula 1', gradient: 'linear-gradient(to bottom, #05080f, #991b1b, #171717)', icon: 'fa-car-side', img: './images/grid-endurance.jpg' }
        ];

        const bottomSportsBar = document.getElementById('bottomSportsBar');
        const sportsGrid = document.getElementById('sportsGrid');
        const dynamicBg = document.getElementById('dynamic-bg');

        sports.forEach(sport => {
            // Bottom bar items
            const barItem = document.createElement('div');
            barItem.className = 'sports-bar-item';
            barItem.innerHTML = `<i class="fas ${sport.icon}"></i> ${sport.name}`;
            barItem.onmouseenter = () => {
                dynamicBg.style.background = sport.gradient;
                dynamicBg.style.opacity = '0.8';
            };
            barItem.onmouseleave = () => {
                dynamicBg.style.opacity = '0.6';
            };
            barItem.onclick = () => {
                window.location.href = `./sports/${sport.id === 'soccer' ? 'football' : sport.id}`;
            };
            bottomSportsBar.appendChild(barItem);

            // Grid items
            const card = document.createElement('div');
            card.className = 'sport-card';
            card.innerHTML = `
                <img src="${sport.img}" alt="${sport.name}">
                <div class="sport-info-overlay">
                    <h3 class="font-bebas text-2xl">${sport.name}</h3>
                    <p class="text-xs text-white/60">Live Coverage & More</p>
                </div>
            `;
            card.onclick = () => {
                window.location.href = `./sports/${sport.id === 'soccer' ? 'football' : sport.id}`;
            };
            sportsGrid.appendChild(card);
        });

        // Search Suggestions
        const searchInput = document.getElementById('searchInput');
        const suggestions = document.getElementById('suggestions');
        const mockSuggestions = [
            { title: 'Lakers vs Warriors', cat: 'NBA' },
            { title: 'Super Bowl Highlights', cat: 'NFL' },
            { title: 'Champions League Final', cat: 'Soccer' },
            { title: 'Wimbledon 2026', cat: 'Tennis' },
            { title: 'Yankees Game Live', cat: 'MLB' }
        ];

        searchInput.oninput = (e) => {
            const val = e.target.value.toLowerCase();
            if (val.length < 2) {
                suggestions.style.display = 'none';
                return;
            }
            const filtered = mockSuggestions.filter(s => s.title.toLowerCase().includes(val));
            if (filtered.length > 0) {
                suggestions.innerHTML = filtered.map(s => `
                    <div class="suggestion-item">
                        <i class="fas fa-play-circle text-accent-blue"></i>
                        <div>
                            <div class="font-bold text-sm text-white">${s.title}</div>
                            <div class="text-[10px] text-white/40 uppercase tracking-widest">${s.cat}</div>
                        </div>
                    </div>
                `).join('');
                suggestions.style.display = 'block';
            } else {
                suggestions.style.display = 'none';
            }
        };

        window.onclick = (e) => {
            if (!e.target.closest('.search-container')) {
                suggestions.style.display = 'none';
            }
        };

        // Scroll effect
        window.addEventListener('scroll', () => {
            const opacity = Math.min(0.9, 0.6 + window.scrollY / 1000);
            dynamicBg.style.opacity = opacity;
        });
    </script>
    <!-- Made with ❤️ from 4SP -->
</body>
</html>
