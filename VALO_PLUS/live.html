<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <!-- VERN_SYSTEM Proxy -->
    <script src="/VALO_PLUS/VERN_SYSTEM/uv/uv.bundle.js"></script>
    <script>window.__4sp_nav_none = true;
        const basePath = "/VALO_PLUS/VERN_SYSTEM/uv/";
        self.__uv$config = {
            prefix: basePath + "service/",
            encodeUrl: Ultraviolet.codec.xor.encode,
            decodeUrl: Ultraviolet.codec.xor.decode,
            handler: basePath + "uv.handler.js",
            client: basePath + "uv.client.js",
            bundle: basePath + "uv.bundle.js",
            config: basePath + "uv.config.js",
            sw: basePath + "uv.sw.js",
            stockSW: "/VALO_PLUS/VERN_SYSTEM/sw.js",
        };
    </script>
    <script src="/VALO_PLUS/VERN_SYSTEM/baremux/index.js"></script>
    <script type="module">
        import * as libcurl from "/VALO_PLUS/VERN_SYSTEM/libcurl/index.mjs";

        window.checkBare = async (retries = 5) => {
            if (window.__4sp_bare_mux_connecting) return;
            window.__4sp_bare_mux_connecting = true;

            const workerPath = "/VALO_PLUS/VERN_SYSTEM/baremux/worker.js";
            const connection = new BareMux.BareMuxConnection(workerPath);
            const wispUrl = "wss://wisp.mercurywork.shop/";
            const transportPath = "/VALO_PLUS/VERN_SYSTEM/libcurl/index.mjs";

            for (let i = 0; i < retries; i++) {
                try {
                    if (libcurl && libcurl.load_wasm) {
                        libcurl.load_wasm().catch(() => {});
                    }

                    const transport = await connection.getTransport();
                    if (!transport || transport.path !== transportPath) {
                        await connection.setTransport(transportPath, [
                            { websocket: wispUrl },
                            { websocket: "wss://ruby.rubynetwork.xyz/wisp/" },
                            { websocket: "wss://flow-works.me/wisp/" }
                        ]);
                    }
                    console.log("Valo Plus: BareMux Transport Active");

                    const bc = new BroadcastChannel("bare-mux-sync");
                    const port = connection.getInnerPort();
                    
                    const signalReady = () => {
                        const msg = { 
                            type: 'baremuxready', 
                            path: workerPath,
                            hasPort: !!port 
                        };
                        
                        bc.postMessage(msg);
                        
                        if (navigator.serviceWorker.controller) {
                            if (port) {
                                navigator.serviceWorker.controller.postMessage(msg, [port]);
                            } else {
                                navigator.serviceWorker.controller.postMessage(msg);
                            }
                        }
                    };
                    
                    signalReady();
                    window.__4sp_bare_mux_connecting = false;
                    return; 
                } catch (e) {
                    if (i === retries - 1) console.error("Valo Plus: BareMux connection exhausted", e);
                    await new Promise(r => setTimeout(r, 200));
                }
            }
            window.__4sp_bare_mux_connecting = false;
        };

        (async () => {
            if ("serviceWorker" in navigator) {
                try {
                    await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                } catch (e) { console.error("VERN Proxy Error", e); }
            }
            await window.checkBare();
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Arena | Valo Plus</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <script>window.__4sp_nav_none = true;
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'deep-blue': '#0D47A1',
                        'card-dark': '#0a0d14',
                        'accent-blue': '#2196F3',
                        'brand-border': '#1a2233',
                    },
                    fontFamily: { 
                        sans: ['Geist', 'sans-serif'],
                        bebas: ['Bebas Neue', 'cursive']
                    },
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-page: #05080f;
            --bg-card: #0a0d14;
            --text-main: #ffffff;
            --text-muted: #8e99af;
            --accent-color: #2196F3;
            --accent-glow: rgba(33, 150, 243, 0.4);
            --border-main: #1a2233;
        }
        body { 
            font-family: 'Geist', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 120px;
        }
        ::-webkit-scrollbar { display: none; }
        * { -ms-overflow-style: none; scrollbar-width: none; }

        .media-card {
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border-main);
            background: var(--bg-card);
            aspect-ratio: 16/9;
        }
        .media-card:hover {
            transform: scale(1.05);
            z-index: 50;
            border-color: var(--accent-color);
            box-shadow: 0 10px 30px var(--accent-glow);
        }
        .media-card img { width: 100%; height: 100%; object-fit: cover; }
        .media-info-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
        }

        .category-title { font-family: 'Bebas Neue', cursive; font-size: 2.5rem; letter-spacing: 0.05em; margin-bottom: 1.5rem; color: var(--accent-color); text-transform: uppercase; }

        .live-indicator {
            position: absolute;
            top: 1rem; right: 1rem;
            background: #ff0000;
            color: white;
            font-size: 0.7rem;
            font-weight: 900;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 100px;
            background: rgba(10, 13, 20, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-main);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.5rem 2rem;
        }
        .sports-bar {
            width: 100%;
            display: flex;
            overflow-x: auto;
            gap: 2rem;
            padding: 0.5rem 0;
            justify-content: center;
        }
        .sports-bar-item {
            font-family: 'Bebas Neue', cursive;
            font-size: 1.2rem;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sports-bar-item:hover, .sports-bar-item.active {
            color: var(--accent-color);
            transform: translateY(-2px);
        }
        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            margin-top: 0.5rem;
        }
        #searchInput {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-main);
            border-radius: 9999px;
            padding: 0.5rem 3rem;
            font-size: 0.9rem;
            color: white;
            outline: none;
        }
    </style>
</head>
<body class="pt-24">
    <nav class="fixed top-0 left-0 right-0 h-20 flex items-center px-16 z-[100] bg-[#05080f]/90 backdrop-blur-md border-bottom border-white/5">
        <div class="flex items-center gap-3">
            <img src="/VALO_PLUS/logo.png" class="w-10 h-10 object-contain">
            <span class="text-3xl font-black tracking-tighter text-white font-bebas">VALO<span class="text-accent-blue ml-1">PLUS</span></span>
        </div>
        <div class="ml-auto flex items-center gap-8">
            <a href="/VALO_PLUS/index.html" class="text-sm font-bold uppercase tracking-widest text-white/60 hover:text-white transition">Home</a>
            <a href="/VALO_PLUS/live.html" class="text-sm font-bold uppercase tracking-widest text-white border-b-2 border-accent-blue">Live</a>
            <a href="/VALO_PLUS/schedule.html" class="text-sm font-bold uppercase tracking-widest text-white/60 hover:text-white transition">Schedule</a>
        </div>
    </nav>

    <main class="max-w-[1600px] mx-auto pb-20 px-16">
        <h1 class="category-title">All Live Events</h1>
        <div id="videoGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Matches will be injected here -->
            <div id="loader" class="col-span-full text-center py-20 text-white/40 font-medium">Scanning for live matches...</div>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="sports-bar" id="bottomSportsBar"></div>
        <div class="search-container">
            <i class="fas fa-search search-icon absolute left-3 top-1/2 -translate-y-1/2 text-white/20"></i>
            <input type="text" id="searchInput" placeholder="Search for teams, players, or matches...">
        </div>
    </div>

    <script>window.__4sp_nav_none = true;
        const sports = [
            { id: 'nba', name: 'NBA', icon: 'fa-basketball' },
            { id: 'nfl', name: 'NFL', icon: 'fa-football' },
            { id: 'mlb', name: 'MLB', icon: 'fa-baseball' },
            { id: 'football', name: 'Soccer', icon: 'fa-futbol' },
            { id: 'hockey', name: 'NHL', icon: 'fa-hockey-puck' },
            { id: 'ufc', name: 'UFC', icon: 'fa-hand-fist' },
            { id: 'tennis', name: 'Tennis', icon: 'fa-table-tennis-paddle-ball' },
            { id: 'motor-sports', name: 'Formula 1', icon: 'fa-car-side' }
        ];

        const bottomSportsBar = document.getElementById('bottomSportsBar');
        sports.forEach(sport => {
            const barItem = document.createElement('div');
            barItem.className = 'sports-bar-item';
            barItem.innerHTML = `<i class="fas ${sport.icon}"></i> ${sport.name}`;
            barItem.onclick = () => window.location.href = `/VALO_PLUS/sports/${sport.id}`;
            bottomSportsBar.appendChild(barItem);
        });

        const sportImages = {
            'nba': '/VALO_PLUS/images/grid-strength.jpg',
            'nfl': '/VALO_PLUS/images/grid-endurance.jpg',
            'mlb': '/VALO_PLUS/images/grid-power.jpg',
            'football': '/VALO_PLUS/images/hero.webp',
            'hockey': '/VALO_PLUS/images/grid-strength.jpg',
            'ufc': '/VALO_PLUS/images/grid-power.jpg',
            'tennis': '/VALO_PLUS/images/grit.webp',
            'motor-sports': '/VALO_PLUS/images/grid-endurance.jpg'
        };

        async function loadAllLive() {
            const grid = document.getElementById('videoGrid');
            try {
                // Fetch all live matches
                const response = await fetch(`/VALO_PLUS/api/proxy?path=matches/live`);
                const allMatches = await response.json();

                grid.innerHTML = '';
                if (allMatches && allMatches.length > 0) {
                    allMatches.forEach(match => {
                        const card = document.createElement('div');
                        card.className = 'media-card';
                        const imgSrc = sportImages[match.category.toLowerCase()] || '/VALO_PLUS/images/grid-strength.jpg';
                        card.innerHTML = `
                            <img src="${imgSrc}">
                            <div class="live-indicator">Live</div>
                            <div class="media-info-overlay">
                                <span class="text-[10px] uppercase tracking-widest text-accent-blue font-black">${match.category}</span>
                                <h3 class="font-bebas text-2xl text-white">${match.title}</h3>
                                <p class="text-[10px] text-white/40 font-medium">${match.time || 'Live Now'}</p>
                            </div>
                        `;
                        card.onclick = () => {
                            const url = `https://streamed.pk/watch/${match.id}`;
                            window.location.href = __uv$config.prefix + __uv$config.encodeUrl(url);
                        };
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="col-span-full text-white/40 py-20 text-center font-medium">No live events found at the moment. Check back during game times!</div>';
                }
            } catch (error) {
                console.error("Failed to load live events:", error);
                grid.innerHTML = '<div class="col-span-full text-red-500 py-20 text-center font-medium">Failed to connect to sports API.</div>';
            }
        }

        loadAllLive();
    </script>
    <!-- Made with ❤️ from 4SP -->
</body>
</html>
